 que:'Puntaje diagnóstico de enfermedad vascular porto-sinusoidal o fibrosis portal no cirrótica (Baveno VIII).',
 cuando:'Hipertensión portal con rigidez hepática baja o sin causa de cirrosis, con biopsia adecuada.',
 ojo:'Solo válido con biopsia adecuada sin cirrosis y sin criterios de exclusión.',
 esc:(v,r)=>{const p=+r.vals[0].v;return {h:['Puntaje','Categoría'],rows:[['0–2','No PSVD/NCPF'],['3–4','Posible'],['≥ 5','Definitivo']],on:p<=2?0:p<=4?1:2}},
 ej:[{l:'Definitivo',v:{hp:'3',hi:'5',aso:true,ok:true}},{l:'Posible',v:{hp:'2',hi:'2',ok:true}},{l:'No cumple',v:{hp:'0',hi:'2',ok:true}}]},

tvpnc:{uso:'s',
 que:'Duración y estrategia de anticoagulación en trombosis portal no cirrótica según riesgo de recurrencia (Baveno VIII).',
 cuando:'Al completar el estudio etiológico y a los 3–6 meses de anticoagulación.',
 ojo:'No aplica a trombosis portal en cirrosis (ver bloque 3).',
 ej:[{l:'Riesgo alto (NMP)',v:{pm:'ma',rec:'nd'}},{l:'Riesgo intermedio',v:{pm:'nm',prov:true,rec:'inc',ext:true}},{l:'Provocada y resuelta',v:{pm:'no',prov:true,res:true,rec:'c3'}}]},

cirugia:{uso:'s',
 que:'Orienta el riesgo de una cirugía no hepática en cirrosis por Child-Pugh, MELD, tipo de cirugía y urgencia.',
 cuando:'Evaluación preoperatoria; para una probabilidad individual usar VOCAL-Penn (enlace en el resultado).',
 ojo:'Orientación por bandas, no modelo validado; la HPCS y la ascitis no controlada suben el riesgo.',
 esc:(v,r)=>{const e=r.vals[0].v;return {h:['Riesgo','Perfil típico','Conducta'],rows:[['Bajo','Child A, MELD &lt; 10, cirugía de pared o laparoscópica electiva','Operar con manejo estándar'],['Intermedio','Child B o MELD 10–15, ascitis o HPCS','Optimizar y decidir con hepatología'],['Alto','Child C, MELD &gt; 15, cirugía abierta, cardíaca o de urgencia','Evitar la electiva; trasplante primero']],on:['Bajo','Intermedio','Alto'].indexOf(e)}},
 ej:[{l:'Bajo',v:{cp:'A',meld:8,tipo:'pa'}},{l:'Intermedio',v:{cp:'B',meld:13,tipo:'lap'}},{l:'Alto',v:{cp:'C',meld:18,tipo:'ab',urg:true}}]},

lfi:{uso:'s',
 que:'Interpreta el Liver Frailty Index (prensión, levantarse de la silla, equilibrio) calculado en la herramienta oficial de UCSF.',
 cuando:'Cirróticos ambulatorios y candidatos a trasplante: predice mortalidad en lista más allá del MELD y guía la prehabilitación.',
 ojo:'Esta calculadora no computa el índice (la normalización de la prensión no está publicada).',
 esc:(v,r)=>{const x=v.lfi;return {h:['LFI','Categoría'],rows:[['&lt; 3,2','Robusto'],['3,2–4,4','Prefrágil'],['≥ 4,5','Frágil']],on:x<3.2?0:x<4.5?1:2}},
 ej:[{l:'Robusto',v:{lfi:3.0}},{l:'Prefrágil',v:{lfi:4.0}},{l:'Frágil en lista',v:{lfi:4.8,lista:true}}]},

maddrey:{uso:'s',
 que:'Gravedad de la hepatitis alcohólica por tiempo de protrombina y bilirrubina.',
 cuando:'En desuso: el pronóstico de la hepatitis alcohólica hoy se define con el <b>MELD</b> (ACG 2024: &gt; 20 grave; corticoides en MELD 21–39). El Maddrey ≥ 32 persiste en ensayos antiguos, fichas y algunos protocolos.',
 ojo:'Depende del tiempo de protrombina control del laboratorio (variabilidad entre reactivos). Para pronóstico usar MELD; para respuesta, Lille.',
 esc:(v,r)=>{const x=4.6*(v.pt-v.ptc)+v.bili;return {h:['Maddrey','Lectura'],rows:[['&lt; 32','No grave: soporte y abstinencia'],['≥ 32','Grave: prednisolona 40 mg/día si no hay contraindicación']],on:x>=32?1:0}},
 ej:[{l:'No grave',v:{pt:15,ptc:12,bili:5}},{l:'Grave',v:{pt:24,ptc:12,bili:14}}]},

lille:{uso:'r',
 que:'Respuesta a corticoides en hepatitis alcohólica por la evolución de la bilirrubina al día 4 o 7.',
 cuando:'Día 4 o 7 de prednisolona: decide continuar 28 días o suspender y discutir trasplante precoz. Es el complemento del MELD: el MELD define gravedad e indicación (día 0) y el Lille la respuesta.',
 ojo:'Solo tiene sentido en pacientes que reciben corticoides.',
 esc:(v,r)=>{const x=P(r.vals[0].v);return {h:['Lille','Respuesta','Sobrevida a 28 días'],rows:[['≤ 0,16','Completa','~91 %'],['0,16–0,45','Parcial: completar 28 días','~79 %'],['0,45–0,56','Parcial (Louvet 2010), pero sobre el corte clásico de 0,45: suspender','~79 %'],['≥ 0,56','Nula','~53 %']],on:x<=0.16?0:x<=0.45?1:x<0.56?2:3}},
 ej:[{l:'Respuesta completa',v:{age:48,alb:2.6,b0:15,b7:8,pt:18}},{l:'Respuesta parcial',v:{age:52,alb:2.5,b0:16,b7:12,pt:20}},{l:'Respuesta nula',v:{age:56,alb:2.3,b0:18,b7:19,pt:24,ren:true}}]},

gahs:{uso:'x',
 que:'Glasgow Alcoholic Hepatitis Score: edad, leucocitos, urea, INR y bilirrubina.',
 cuando:'Alternativa británica al Maddrey/MELD (usada en STOPAH).',
 ojo:'Redundante con MELD y Maddrey en la práctica chilena.',
 esc:(v,r)=>{const p=+r.vals[0].v;return {h:['GAHS','Lectura'],rows:[['5–8','Mejor pronóstico'],['≥ 9','Mal pronóstico']],on:p>=9?1:0}},
 ej:[{l:'GAHS < 9',v:{age:45,wbc:9,bun:12,inr:1.4,bili:6}},{l:'GAHS ≥ 9',v:{age:55,wbc:17,bun:25,inr:2.2,bili:18}}]},

abic:{uso:'x',
 que:'Edad, bilirrubina, INR y creatinina para pronóstico a 90 días en hepatitis alcohólica.',
 cuando:'Alternativa española al Maddrey/MELD.',
 ojo:'Redundante con MELD y Lille.',
 esc:(v,r)=>{const x=P(r.vals[0].v);return {h:['ABIC','Riesgo','Sobrevida a 90 días'],rows:[['&lt; 6,71','Bajo','~100 %'],['6,71–8,99','Intermedio','~70 %'],['≥ 9','Alto','~25 %']],on:x<6.71?0:x<9?1:2}},
 ej:[{l:'Bajo',v:{age:40,bili:4,inr:1.3,cr:0.7}},{l:'Intermedio',v:{age:50,bili:10,inr:1.8,cr:1.1}},{l:'Alto',v:{age:60,bili:22,inr:2.5,cr:2.5}}]},

fib4:{uso:'r',
 que:'Índice de fibrosis con edad, AST, ALT y plaquetas.',
 cuando:'Primer escalón en MASLD, alcohol y hepatitis virales en atención primaria y consulta: decide quién va a elastografía.',
 ojo:'Menor rendimiento en &lt; 35 años; en ≥ 65 años el corte bajo es 2,0.',
 esc:(v,r)=>{const x=P(r.vals[0].v),lo=v.age>=65?2:1.3;return {h:['FIB-4','Riesgo de fibrosis avanzada','Conducta'],rows:[[`&lt; ${lo===2?'2,0':'1,3'}`,'Bajo','Repetir en 1–3 años'],[`${lo===2?'2,0':'1,3'}–2,67`,'Intermedio','Elastografía o ELF'],['&gt; 2,67','Alto','Elastografía y hepatología']],on:x<lo?0:x<=2.67?1:2}},
 ej:[{l:'Bajo',v:{age:45,ast:25,alt:30,plt:250}},{l:'Intermedio',v:{age:58,ast:48,alt:52,plt:165}},{l:'Alto',v:{age:62,ast:70,alt:50,plt:110}},{l:'≥ 65 años',v:{age:68,ast:28,alt:30,plt:220}}]},

apri:{uso:'s',
 que:'Índice AST/plaquetas.',
 cuando:'Hepatitis B y C donde no hay elastografía (OMS 2024: APRI &gt; 0,5 como criterio de tratamiento de VHB).',
 ojo:'Inferior a FIB-4 y a la elastografía en MASLD.',
 esc:(v,r)=>{const x=P(r.vals[0].v);return {h:['APRI','Lectura'],rows:[['&lt; 0,5','Descarta fibrosis significativa'],['0,5–1,5','Indeterminado'],['1,5–2,0','Fibrosis significativa'],['&gt; 2,0','Cirrosis probable']],on:x<0.5?0:x<=1.5?1:x<=2?2:3}},
 ej:[{l:'Bajo',v:{ast:30,uln:40,plt:250}},{l:'Indeterminado',v:{ast:80,uln:40,plt:140}},{l:'Cirrosis probable',v:{ast:120,uln:40,plt:95}}]},

nfs:{uso:'x',
 que:'NAFLD Fibrosis Score: edad, IMC, glicemia, AST/ALT, plaquetas y albúmina.',
 cuando:'Alternativa a FIB-4 en MASLD.',
 ojo:'Las guías actuales prefieren FIB-4 (más simple, menos indeterminados por IMC y albúmina).',
 esc:(v,r)=>{const x=P(r.vals[0].v);return {h:['NFS','Lectura'],rows:[['&lt; −1,455','Descarta fibrosis avanzada'],['−1,455 a 0,676','Indeterminado'],['&gt; 0,676','Fibrosis avanzada probable']],on:x<-1.455?0:x<=0.676?1:2}},
 ej:[{l:'Bajo',v:{age:40,bmi:26,ast:25,alt:40,plt:260,alb:4.5}},{l:'Alto',v:{age:63,bmi:34,dm:true,ast:60,alt:45,plt:120,alb:3.6}}]},

hai:{uso:'s',
 que:'Criterios simplificados del IAIHG para el diagnóstico de hepatitis autoinmune.',
 cuando:'Sospecha de HAI al evaluar biopsia, autoanticuerpos e IgG.',
 ojo:'Menos sensible en presentación aguda grave y en variantes; no sirve para seguimiento.',
 esc:(v,r)=>{const p=+r.vals[0].v;return {h:['Puntaje','Lectura'],rows:[['&lt; 6','No cumple'],['6','HAI probable'],['≥ 7','HAI definida']],on:p<6?0:p===6?1:2}},
 ej:[{l:'Definida',v:{ac:'2',igg:'2',his:'2',vir:'2'}},{l:'Probable',v:{ac:'1',igg:'1',his:'2',vir:'2'}},{l:'No cumple',v:{ac:'1',igg:'0',his:'1',vir:'2'}}]},

audc:{uso:'r',
 que:'Define el riesgo basal de la CBP, cuándo evaluar la respuesta y si corresponde segunda línea.',
 cuando:'Al diagnóstico de CBP y a los 6 o 12 meses de AUDC.',
 ojo:'Verificar adherencia y dosis (13–15 mg/kg) antes de declarar falla.',
 esc:(v,r)=>({h:['Perfil','Momento','Meta'],rows:[['Alto riesgo (rigidez ≥ 10 kPa, bilirrubina &gt; LSN, FA &gt; 3 × LSN o edad ≤ 62)','6 meses','FA &lt; 1,9 × LSN y bilirrubina normal'],['Sin alto riesgo','12 meses','FA &lt; 1,67 × LSN y bilirrubina normal'],['Meta ideal','Siempre','FA normal y bilirrubina ≤ 0,6 × LSN']],on:r.vals[2].v==='Respuesta profunda'?2:r.vals[0].v==='Alto'?0:1}),
 ej:[{l:'Alto riesgo, falla a 6 meses',v:{lsm:11,age:54,fa0:3.4,bi0:0.8,mes:'6',fa:1.95,ast:1.2,bili:0.8}},{l:'Respuesta profunda',v:{lsm:7,age:66,fa0:2.2,bi0:0.7,mes:'12',fa:0.9,bili:0.5}},{l:'Falla con HPCS',v:{lsm:22,age:58,fa0:4,bi0:1.3,mes:'6',fa:2.5,bili:1.6,hpcs:true}}]},

leipzig:{uso:'s',
 que:'Puntaje diagnóstico de enfermedad de Wilson (clínica, ceruloplasmina, cobre urinario y hepático, genética).',
 cuando:'Sospecha de Wilson: hepatopatía en &lt; 40 años, FHA con hemólisis, síntomas neuropsiquiátricos.',
 ojo:'La ceruloplasmina puede ser normal con inflamación; el cobre urinario se eleva en otras colestasias.',
 esc:(v,r)=>{const p=+r.vals[0].v;return {h:['Puntaje','Lectura'],rows:[['0–1','Improbable'],['2–3','Probable: completar estudio'],['≥ 4','Diagnóstico establecido']],on:p<=1?0:p<=3?1:2}},
 ej:[{l:'Establecido',v:{kf:'2',neu:'1',hem:'0',cer:'2',cu:'2',hcu:'0',mut:'0'}},{l:'Probable',v:{kf:'0',neu:'0',hem:'0',cer:'1',cu:'1',hcu:'0',mut:'1'}},{l:'Improbable',v:{kf:'0',neu:'0',hem:'0',cer:'1',cu:'0',hcu:'0',mut:'0'}}]},

rfactor:{uso:'r',
 que:'Patrón de daño (factor R) y ley de Hy.',
 cuando:'Toda alteración aguda del perfil hepático y toda sospecha de DILI: orienta el estudio y la causalidad (RUCAM).',
 ojo:'Calcular con los valores del primer control alterado.',
 esc:(v,r)=>{const x=P(r.vals[0].v);return {h:['Factor R','Patrón','Causas típicas'],rows:[['≤ 2','Colestásico','Amoxicilina-clavulánico, obstrucción, CBP/CEP'],['2–5','Mixto','DILI mixta, sepsis'],['≥ 5','Hepatocelular','Virus, isquemia, paracetamol, HAI']],on:x<=2?0:x<5?1:2}},
 ej:[{l:'Hepatocelular con Hy',v:{alt:620,altu:40,fa:180,fau:120,bili:3.1,bu:1.2}},{l:'Colestásico',v:{alt:120,altu:40,fa:640,fau:120,bili:4,bu:1.2}},{l:'Mixto',v:{alt:200,altu:40,fa:250,fau:120,bili:1,bu:1.2}}]},

kings:{uso:'s',
 que:'Criterios de King\'s College para indicar trasplante en falla hepática aguda.',
 cuando:'Toda FHA, al ingreso y de forma seriada.',
 ojo:'Alta especificidad, sensibilidad moderada: no cumplirlos no excluye el trasplante.',
 ej:[{l:'Paracetamol (cumple)',v:{tipo:'p',ph:7.25,inr:3,cr:2}},{l:'No paracetamol (cumple)',v:{tipo:'n',inr:4.2,cr:2,age:45,desf:true,ict7:true,bili:19}},{l:'No cumple',v:{tipo:'n',inr:2.1,cr:1,age:30,bili:8}}]},

rucam:{uso:'s',
 que:'Puntúa la probabilidad de que un fármaco o suplemento cause el daño hepático (7 dominios: latencia, evolución, factores de riesgo, concomitantes, causas alternativas, hepatotoxicidad conocida y reexposición).',
 cuando:'Toda sospecha de DILI, tras completar el estudio de causas alternativas; útil para documentar la causalidad en la ficha y en la notificación a farmacovigilancia (ISP).',
 ojo:'Baja reproducibilidad entre observadores y pondera poco la hepatotoxicidad conocida; el estándar en investigación es la opinión experta (DILIN) y el RECAM (2022) es su revisión electrónica. Se puntúa cada fármaco por separado.',
 esc:(v,r)=>{const c=r.vals[1].v;return {h:['Puntaje','Causalidad'],rows:[['≤ 0 o latencia incompatible','Excluida / no relacionado'],['1–2','Improbable'],['3–5','Posible'],['6–8','Probable'],['≥ 9','Muy probable']],on:{'Excluido':0,'No relacionado':0,'Improbable':1,'Posible':2,'Probable':3,'Muy probable':4}[c]}},
 ej:[{l:'Amoxicilina-clavulánico (colestásico)',v:{pat:'c',lat:'2',cc:'2',age:45,con:'0',alt:'1',prev:'2',rex:'0'}},{l:'Isoniazida (hepatocelular)',v:{pat:'h',lat:'2',ch:'3',age:58,con:'0',alt:'2',prev:'2',rex:'0'}},{l:'Posible',v:{pat:'h',lat:'2',ch:'0',age:60,con:'-1',alt:'1',prev:'1',rex:'0'}},{l:'Improbable',v:{pat:'h',lat:'1',ch:'0',age:40,con:'-1',alt:'0',prev:'1',rex:'0'}},{l:'Latencia incompatible',v:{pat:'h',lat:'x'}}]},

vhb:{uso:'r',
 que:'Aplica a un mismo paciente los criterios de tratamiento de EASL 2025, OMS 2024 y MINSAL 2021 (DNA-VHB, ALT, fibrosis, HBeAg, edad y factores de riesgo).',
 cuando:'Todo HBsAg positivo crónico al diagnóstico y en cada control (DNA y ALT cada 6–12 meses, rigidez anual): define si tratar, observar o dar profilaxis por inmunosupresión.',
 ojo:'EASL 2025 considera ALT elevada &gt; 40 U/L (con 30/19 U/L como mejor predictor); OMS usa 30/19. La ALT debe estar persistentemente alterada (2 controles); descartar otra causa (MASLD, alcohol). Siempre pedir anti-VHD.',
 esc:(v,r)=>({h:['Criterio (EASL 2025)','Recomendación'],rows:[['Cirrosis con DNA detectable','Tratar (fuerte)'],['DNA &gt; 2.000 UI/mL y ALT &gt; LSN y/o fibrosis &gt; 7 kPa','Tratar (fuerte)'],['HBeAg positivo con riesgo de HCC (&gt; 30 años, familiar) o manifestaciones extrahepáticas','Tratar (fuerte)'],['Fibrosis avanzada (&gt; 8 kPa) con DNA detectable, o DNA &lt; 2.000 con ALT persistentemente alta','Puede tratarse (débil)'],['Sin lo anterior','Observar: DNA y ALT cada 6–12 meses'],['Inmunosupresión, o embarazo con DNA &gt; 200.000 UI/mL','Profilaxis (TDF desde la semana 24–28 en el embarazo)']],on:{'Tratar':r.txt.indexOf('Cirrosis con DNA')>=0?0:r.txt.indexOf('DNA &gt; 2.000 UI/mL con ALT')>=0?1:2,'Considerar':3,'Observar':4,'Profilaxis':5,'TDF semana 24–28':5}[r.vals[0].v]}),
 ej:[{l:'HBeAg (−) con hepatitis activa',v:{dna:25000,alt:68,sex:'m',age:44,ag:'n',lsm:6.5}},{l:'Infección HBeAg (−) inactiva',v:{dna:800,alt:22,sex:'f',age:38,ag:'n',lsm:5}},{l:'HBeAg (+) > 30 años, ALT normal',v:{dna:50000000,alt:28,sex:'m',age:34,ag:'p',lsm:5.8}},{l:'Cirrosis compensada',v:{dna:350,alt:35,sex:'m',age:61,ag:'n',lsm:16,cir:true}},{l:'Rituximab planificado',v:{dna:0,alt:20,sex:'f',age:55,ag:'n',ims:true}},{l:'Embarazo con DNA alto',v:{dna:3500000,alt:25,sex:'f',age:29,ag:'p',emb:true}}]},

asge:{uso:'r',
 que:'Clasifica la probabilidad de coledocolitiasis en alto, intermedio o bajo riesgo con predictores clínicos, de laboratorio y de ecografía.',
 cuando:'Todo paciente con colelitiasis sintomática, pancreatitis biliar o colecistitis antes de la colecistectomía: decide entre CPRE, endosonografía o colangiorresonancia, o cirugía directa.',
 ojo:'Los criterios de 2019 son más estrictos que los de 2010: la bilirrubina &gt; 4 o el colédoco dilatado aislados ya no son alto riesgo. La pancreatitis biliar sin colangitis no es por sí sola indicación de CPRE.',
 esc:(v,r)=>({h:['Riesgo','Criterios','Conducta'],rows:[['Alto (&gt; 50 %)','Cálculo visto · colangitis · bilirrubina &gt; 4 + colédoco dilatado','CPRE'],['Intermedio (10–50 %)','Pruebas alteradas · edad &gt; 55 · colédoco dilatado','Endosonografía o colangiorresonancia'],['Bajo (&lt; 10 %)','Ninguno','Colecistectomía']],on:{Alto:0,Intermedio:1,Bajo:2}[r.vals[0].v]}),
 ej:[{l:'Alto: cálculo visto',v:{cal:true,bili:2.5,dil:true,lab:true,age:48}},{l:'Alto: bilirrubina > 4 + dilatación',v:{bili:5.2,dil:true,lab:true,age:40}},{l:'Intermedio',v:{bili:1.4,lab:true,age:62}},{l:'Bajo',v:{bili:0.6,age:35}}]},

tg18cg:{uso:'r',
 que:'Criterios de Tokio 2018 para el diagnóstico (A inflamación, B colestasis, C imagen) y la gravedad de la colangitis aguda.',
 cuando:'Al ingreso de toda sospecha de colangitis: el grado define cuándo drenar la vía biliar (urgente en III, precoz en II).',
 ojo:'La tríada de Charcot es poco sensible (~25 %). La gravedad cambia en horas: reevaluar. En el grado III basta descomprimir; la extracción del cálculo se completa después.',
 esc:(v,r)=>{const g=String(r.vals[1]?r.vals[1].v:'');return {h:['Grado','Definición','Drenaje'],rows:[['I · leve','Sin criterios de II ni III','Si no responde a 24 h de antibiótico'],['II · moderada','≥ 2 de: leucocitos &gt; 12.000 o &lt; 4.000, fiebre ≥ 39 °C, edad ≥ 75, bilirrubina ≥ 5, albúmina baja','Precoz (24 h)'],['III · grave','Disfunción de ≥ 1 órgano','Urgente tras estabilizar']],on:g.endsWith('III')?2:g.endsWith('II')?1:g.endsWith('I')?0:-1}},
 ej:[{l:'Grado I',v:{fie:true,inf:true,ict:true,lab:true,dil:true,cau:true,wbc:11,tem:38.4,age:50,bili:2.6}},{l:'Grado II',v:{fie:true,inf:true,ict:true,lab:true,dil:true,cau:true,wbc:16.5,tem:39.2,age:78,bili:4.1}},{l:'Grado III',v:{fie:true,inf:true,ict:true,lab:true,dil:true,cau:true,ofa:true,wbc:22,tem:39.5,age:70,bili:6}},{l:'Solo sospecha',v:{fie:true,inf:true,lab:true,wbc:13,tem:38.6,age:60,bili:1.5}}]},

tg18cc:{uso:'r',
 que:'Criterios de Tokio 2018 para el diagnóstico (A local, B sistémico, C imagen) y la gravedad de la colecistitis aguda, con la conducta según Charlson y ASA.',
 cuando:'Al diagnóstico de colecistitis: decide entre colecistectomía precoz y drenaje vesicular.',
 ojo:'La edad avanzada por sí sola no contraindica la cirugía precoz (CHOCOLATE). Con más de 72 h de evolución el grado sube a II.',
 esc:(v,r)=>{const g=String(r.vals[1]?r.vals[1].v:'');return {h:['Grado','Definición','Conducta'],rows:[['I · leve','Sin criterios de II ni III','Colecistectomía laparoscópica precoz'],['II · moderada','Leucocitos &gt; 18.000, masa palpable, &gt; 72 h o inflamación local marcada','Cirugía precoz si Charlson ≤ 5 y ASA ≤ 2; si no, drenaje'],['III · grave','Disfunción de ≥ 1 órgano','Soporte y drenaje; cirugía precoz solo en casos seleccionados']],on:g.endsWith('III')?2:g.endsWith('II')?1:g.endsWith('I')?0:-1}},
 ej:[{l:'Grado I',v:{mur:true,fie:true,pcr:true,img:true,wbc:13,dur:30,cci:1,asa:'1'}},{l:'Grado II operable',v:{mur:true,loc:true,fie:true,leu:true,img:true,wbc:19,dur:80,cci:3,asa:'2'}},{l:'Grado II alto riesgo',v:{mur:true,leu:true,pcr:true,img:true,wbc:20,mas:true,dur:96,cci:7,asa:'3'}},{l:'Grado III',v:{mur:true,fie:true,leu:true,img:true,ofa:true,wbc:24,dur:60,cci:5,asa:'3'}}]},
hcc:{uso:'r',
 que:'Estadio BCLC 2026 con su tratamiento de primera opción y criterios de trasplante (Milán, UCSF, up-to-seven, Metroticket 2.0, modelo AFP).',
 cuando:'Al diagnóstico de HCC y en cada comité.',
 ojo:'Requiere imagen completa (número, tamaño, invasión) y función hepática; el comité ajusta según comorbilidad.',
 esc:(v,r)=>{const st=r.vals[0].v;return {h:['BCLC','Definición','Primera opción'],rows:[['0','Único ≤ 2 cm, ECOG 0','Ablación o resección'],['A','Único o ≤ 3 nódulos ≤ 3 cm, ECOG 0','Resección, ablación o trasplante'],['B','Multinodular, ECOG 0','Trasplante extendido, TACE/TARE o sistémica'],['C','Invasión portal o extrahepática, o ECOG 1–2','Inmunoterapia combinada'],['D','ECOG &gt; 2 o hepatopatía terminal','Soporte']],on:['0','A','B','C','D'].indexOf(st)}},
 ej:[{l:'BCLC 0',v:{nod:'1.8',afp:12,ecog:'0',fun:'p'}},{l:'BCLC A (Milán)',v:{nod:'2.5, 2, 1.5',afp:40,ecog:'0',fun:'p'}},{l:'BCLC B',v:{nod:'4, 3, 2.5, 2',afp:150,ecog:'0',fun:'p'}},{l:'BCLC C',v:{nod:'5.5',afp:850,vas:true,ecog:'1',fun:'p'}},{l:'BCLC D',v:{nod:'3',afp:20,ecog:'3',fun:'p'}}]},

pageb:{uso:'s',
 que:'Riesgo de HCC a 5 años en hepatitis B tratada con análogos (edad, sexo, plaquetas).',
 cuando:'VHB sin cirrosis en tratamiento: decide si hacer vigilancia de HCC.',
 ojo:'Validado en población caucásica; en asiáticos se usan otros puntajes.',
 esc:(v,r)=>{const p=+r.vals[0].v;return {h:['PAGE-B','Riesgo a 5 años','Vigilancia'],rows:[['≤ 9','~0 %','Puede omitirse'],['10–17','~3 %','Individualizar'],['≥ 18','~17 %','Semestral']],on:p<=9?0:p<=17?1:2}},
 ej:[{l:'Bajo',v:{age:35,sex:'f',plt:230}},{l:'Intermedio',v:{age:45,sex:'f',plt:180}},{l:'Alto',v:{age:62,sex:'m',plt:95}}]}
};

/* ===================== interfaz ===================== */
const side=document.getElementById('side'), selm=document.getElementById('selm'), box=document.getElementById('calc');
const VIS=CALCS.filter(c=>(META[c.id]||{}).uso!=='x'); /* las de referencia quedan ocultas del menú, accesibles desde la curaduría */
const grupos=[...new Set(VIS.map(c=>c.g))];
const dot=id=>{const u=(META[id]||{}).uso||'s';return `<i class="${u}" title="${USO[u][0]}"></i>`};
side.innerHTML='<input type="search" id="fq" placeholder="Buscar calculadora…" aria-label="Buscar calculadora"><a href="#curaduria" data-id="curaduria" class="curl">Cuáles se usan de verdad</a><div class="ley"><i class="r"></i>rutina<i class="s"></i>situacional</div>'+grupos.map(g=>`<h6>${g}</h6>`+VIS.filter(c=>c.g===g).map(c=>`<a href="#${c.id}" data-id="${c.id}">${dot(c.id)}${c.t}</a>`).join('')).join('');
selm.innerHTML='<option value="curaduria">★ Cuáles se usan de verdad</option>'+grupos.map(g=>`<optgroup label="${g}">`+VIS.filter(c=>c.g===g).map(c=>`<option value="${c.id}">${c.t}</option>`).join('')+'</optgroup>').join('');
selm.onchange=()=>{location.hash=selm.value};
document.getElementById('fq').addEventListener('input',e=>{const q=e.target.value.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  side.querySelectorAll('a').forEach(a=>{a.hidden=!!q&&a.textContent.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').indexOf(q)<0});});

function campo(f){
  if(f.t==='n')return `<div class="f"><label for="i-${f.id}">${f.l}${f.u?` <span class="u">(${f.u})</span>`:''}</label><input type="number" inputmode="decimal" step="any" id="i-${f.id}" data-k="${f.id}" placeholder="${f.ex?'ej. '+f.ex:''}"></div>`;
  if(f.t==='t')return `<div class="f full"><label for="i-${f.id}">${f.l}</label><input type="text" id="i-${f.id}" data-k="${f.id}" placeholder="${f.ex?'ej. '+f.ex:''}"></div>`;
  if(f.t==='s')return `<div class="f"><label for="i-${f.id}">${f.l}</label><select id="i-${f.id}" data-k="${f.id}">${f.o.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select></div>`;
  return `<div class="f chk full"><input type="checkbox" id="i-${f.id}" data-k="${f.id}"><label for="i-${f.id}">${f.l}</label></div>`;
}
function leer(cal){const v={}; cal.i.forEach(f=>{const el=document.getElementById('i-'+f.id);
  if(f.t==='n'){const x=el.value.trim().replace(',','.'); v[f.id]=x===''?null:parseFloat(x);}
  else if(f.t==='c')v[f.id]=el.checked; else v[f.id]=el.value;}); return v;}
/* carga un ejemplo completo: limpia todo y fija números, textos, listas y casillas */
function cargar(cal,ej){
  document.getElementById('frm').reset();
  cal.i.forEach(f=>{const el=document.getElementById('i-'+f.id); if(!(f.id in ej.v))return; const x=ej.v[f.id];
    if(f.t==='c')el.checked=!!x; else el.value=String(x);});
}
function escala(cal,v,r){const m=META[cal.id]; if(!m||!m.esc)return ''; let e=null; try{e=m.esc(v,r)}catch(err){e=null} if(!e)return '';
  return `<div class="esc"><h4>Escala completa · fila marcada = este paciente</h4><table><tr>${e.h.map(x=>`<th>${x}</th>`).join('')}</tr>${e.rows.map((row,i)=>`<tr class="${i===e.on?'on':''}">${row.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></div>`;}
function calcular(cal){const v=leer(cal); let r=null; try{r=cal.f(v)}catch(e){r=null}
  const out=document.getElementById('res');
  if(!r){out.innerHTML='<p class="falta">Complete los campos o cargue un ejemplo para ver el resultado.</p>';return;}
  out.innerHTML=`<div class="vals">${r.vals.map(x=>`<div class="val ${x.cls||''}"><small>${x.k}</small><b>${x.v}</b></div>`).join('')}</div>${escala(cal,v,r)}<div class="interp">${r.txt||''}</div>`;
}
function ficha(cal){const m=META[cal.id]; if(!m)return '';
  return `<details class="ficha" open><summary>Para qué sirve</summary><dl><dt>Qué mide</dt><dd>${m.que}</dd><dt>Cuándo usarla</dt><dd>${m.cuando}</dd><dt>Ojo</dt><dd>${m.ojo}</dd></dl></details>`;}
function curaduria(){
  side.querySelectorAll('a').forEach(a=>a.setAttribute('aria-current',a.dataset.id==='curaduria'));
  selm.value='curaduria'; document.title='Cuáles se usan de verdad · Calculadoras Hepatología';
  const filas=u=>CALCS.filter(c=>(META[c.id]||{}).uso===u).map(c=>`<tr><td><a href="#${c.id}">${c.t}</a></td><td>${c.g}</td><td>${META[c.id].cuando}</td></tr>`).join('');
  const bloque=(u,txt)=>`<h2><span class="uso ${u}">${USO[u][0]}</span> ${CALCS.filter(c=>(META[c.id]||{}).uso===u).length} calculadoras</h2><p class="desc">${txt}</p><div class="wrap"><table><tr><th>Calculadora</th><th>Grupo</th><th>Cuándo usarla</th></tr>${filas(u)}</table></div>`;
  box.innerHTML=`<div class="cur"><h1>Cuáles se usan de verdad</h1><p class="desc">Clasificación de las ${CALCS.length} calculadoras por uso real en sala y consulta.</p>
   ${bloque('r','Las que se calculan a diario o en casi todo paciente de su escenario. Se mantienen en primer plano.')}
   ${bloque('s','Se usan en un escenario concreto (HCC, enfermedad vascular, falla hepática aguda, sospecha de Wilson o HAI). Se mantienen.')}
   ${bloque('x','Ocultas del menú por redundantes con MELD, Lille y FIB-4. Siguen disponibles desde estos enlaces.')}
   <h2>Qué MELD leer</h2><ul><li><b>MELD-Na</b>: ordena la lista de trasplante en Chile y es el que se informa para pronóstico y derivación (≥ 15; GES 88).</li><li><b>MELD 3.0</b>: asignación en EE.UU. desde 2023; corrige la desventaja de las mujeres. Útil como complemento, no cambia la prioridad chilena.</li><li><b>MELD clásico</b>: el que validan la hepatitis alcohólica (ACG &gt; 20), el riesgo de TIPS y el riesgo quirúrgico (Mayo).</li></ul>
   <h2>Hepatitis alcohólica</h2><ul><li><b>MELD</b> (día 0): gravedad y pronóstico; &gt; 20 grave, corticoides en 21–39.</li><li><b>Lille</b> (día 4–7): respuesta a corticoides.</li><li><b>Maddrey</b>: en desuso, se mantiene como situacional.</li></ul></div>`;
}
function abrir(id){
  if(id==='curaduria')return curaduria();
  const cal=CALCS.find(c=>c.id===id)||CALCS[0], m=META[cal.id]||{};
  side.querySelectorAll('a').forEach(a=>a.setAttribute('aria-current',a.dataset.id===cal.id));
  if(!selm.querySelector(`option[value="${cal.id}"]`))selm.insertAdjacentHTML('beforeend',`<option value="${cal.id}">${cal.t} (oculta)</option>`);
  selm.value=cal.id; document.title=cal.t+' · Calculadoras Hepatología';
  const u=m.uso?`<div class="uso ${m.uso}">${USO[m.uso][0]} <span>${USO[m.uso][1]}</span></div>`:'';
  const ejs=(m.ej||[]).map((e,i)=>`<button type="button" data-ej="${i}">${e.l}</button>`).join('');
  box.innerHTML=`${u}<h1>${cal.t}</h1><p class="desc">${cal.d}</p>${ficha(cal)}<div class="card"><div class="ejs"><small>Ejemplos</small>${ejs}<button type="button" class="lim" id="lim">Limpiar</button></div><form class="grid" id="frm" onsubmit="return false">${cal.i.map(campo).join('')}</form>
   <div class="res" id="res"></div><p class="ref">${cal.ref}</p></div>`;
  const frm=document.getElementById('frm'), bts=[...box.querySelectorAll('[data-ej]')];
  const marca=b=>bts.forEach(x=>x.setAttribute('aria-pressed',x===b));
  frm.addEventListener('input',()=>{marca(null);calcular(cal)}); frm.addEventListener('change',()=>calcular(cal));
  bts.forEach(b=>b.onclick=()=>{cargar(cal,m.ej[+b.dataset.ej]); marca(b); calcular(cal)});
  document.getElementById('lim').onclick=()=>{frm.reset(); marca(null); calcular(cal)};
  calcular(cal);
}
window.addEventListener('hashchange',()=>{abrir(location.hash.slice(1)); window.scrollTo(0,0)});
abrir(location.hash.slice(1));

(function(){var root=document.documentElement,btn=document.getElementById('tema');
  try{var g=localStorage.getItem('hepato-tema');if(g)root.setAttribute('data-theme',g);}catch(e){}
  btn.onclick=function(){var o=root.getAttribute('data-theme')==='dark'||(!root.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);
    var nn=o?'light':'dark';root.setAttribute('data-theme',nn);try{localStorage.setItem('hepato-tema',nn)}catch(e){}};
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!/claude\.ai|claudeusercontent/.test(location.hostname)){
    addEventListener('load',function(){navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(function(){})});}
})();
</script>
