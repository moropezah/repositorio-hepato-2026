<style>
:root{
  --bg:#f7f5f1; --panel:#fffefb; --panel-2:#f1ede6; --fg:#1c2530; --fg-2:#4a5664;
  --fg-3:#78838f; --line:#ddd6cb; --line-2:#c9c0b2;
  --marino:#173a5e; --marino-2:#255a8a; --acento:#b0561c;
  --verde:#2f6b4f; --rojo:#9e2b25; --ambar:#8a6414;
  --sh:0 1px 2px rgba(28,37,48,.06),0 4px 14px rgba(28,37,48,.05);
  --r:12px;
  --ff-s:"Source Serif 4",Georgia,serif;
  --ff-b:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --ff-m:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161c; --panel:#1a2029; --panel-2:#222b36; --fg:#e6e9ed; --fg-2:#b3bcc6;
  --fg-3:#8b95a1; --line:#2c3642; --line-2:#3d4956;
  --marino:#8fbde6; --marino-2:#a8cdf0; --acento:#e89a5c;
  --verde:#6fc296; --rojo:#e88a84; --ambar:#d9b25c;
  --sh:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12161c; --panel:#1a2029; --panel-2:#222b36; --fg:#e6e9ed; --fg-2:#b3bcc6;
  --fg-3:#8b95a1; --line:#2c3642; --line-2:#3d4956;
  --marino:#8fbde6; --marino-2:#a8cdf0; --acento:#e89a5c;
  --verde:#6fc296; --rojo:#e88a84; --ambar:#d9b25c;
  --sh:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ff-b);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--ff-s);font-weight:700;color:var(--fg);text-decoration:none;white-space:nowrap}
.dot{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--marino),var(--acento));display:grid;place-items:center;color:var(--bg);font:700 .6rem var(--ff-b)}
.top a.back{margin-left:auto;font-size:.8rem;font-weight:600;color:var(--fg-2);text-decoration:none;padding:6px 10px;border-radius:7px}
.top a.back:hover{background:var(--panel-2)}
.tema{background:none;border:1px solid var(--line-2);color:var(--fg-2);border-radius:7px;width:30px;height:30px;cursor:pointer}
.lay{max-width:1180px;margin:0 auto;padding:22px 20px 80px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;align-items:start}
nav.side{position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto;padding-right:4px}
nav.side input{width:100%;padding:7px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel);color:var(--fg);font:inherit;font-size:.85rem;margin-bottom:10px}
nav.side h6{margin:14px 0 4px;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--acento)}
nav.side a{display:block;padding:5px 9px;border-radius:7px;color:var(--fg-2);text-decoration:none;font-size:.86rem}
nav.side a:hover{background:var(--panel-2)}
nav.side a[aria-current="true"]{background:var(--marino);color:var(--bg);font-weight:600}
.selm{display:none}
h1{font-family:var(--ff-s);font-size:clamp(1.5rem,3.6vw,2rem);margin:0 0 4px;letter-spacing:-.02em}
.desc{color:var(--fg-2);margin:0 0 18px;max-width:72ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px 18px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label,.f .lb{font-size:.78rem;font-weight:600;color:var(--fg-2)}
.f .u{font-weight:500;color:var(--fg-3)}
.f input[type=number],.f input[type=text],.f select{width:100%;padding:8px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-size:.95rem}
.f input:focus,.f select:focus{outline:2px solid var(--marino-2);outline-offset:1px}
.f.chk{flex-direction:row;align-items:center;gap:8px}
.f.chk input{width:18px;height:18px;accent-color:var(--marino)}
.f.chk label{font-weight:500;color:var(--fg)}
.f.full{grid-column:1/-1}
.res{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
.vals{display:flex;gap:12px;flex-wrap:wrap}
.val{background:var(--panel-2);border-radius:10px;padding:10px 14px;min-width:120px}
.val small{display:block;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.val b{font-family:var(--ff-s);font-size:1.7rem;line-height:1.15;color:var(--marino)}
.val.ok b{color:var(--verde)}.val.mid b{color:var(--ambar)}.val.bad b{color:var(--rojo)}
.interp{margin-top:12px;color:var(--fg-2);font-size:.93rem}
.interp b{color:var(--fg)}
.interp table{border-collapse:collapse;width:100%;margin-top:8px;font-size:.86rem}
.interp td,.interp th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.interp th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3)}
.si{color:var(--verde);font-weight:700}.no{color:var(--rojo);font-weight:700}
.falta{color:var(--fg-3);font-size:.88rem;margin-top:16px}
.ref{font-size:.76rem;color:var(--fg-3);margin-top:16px;font-style:italic}
.uso{display:inline-flex;align-items:center;gap:6px;font:700 .66rem var(--ff-b);letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:99px;border:1px solid currentColor;margin:0 0 10px}
.uso.r{color:var(--verde)}.uso.s{color:var(--marino-2)}.uso.x{color:var(--fg-3)}
.uso span{font-weight:500;letter-spacing:0;text-transform:none;color:var(--fg-3)}
nav.side a i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
i.r{background:var(--verde)}i.s{background:var(--marino-2)}i.x{background:var(--line-2)}
.ficha{background:var(--panel-2);border-radius:10px;padding:12px 16px;margin:0 0 16px;max-width:860px}
.ficha summary{cursor:pointer;font-weight:700;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2)}
.ficha dl{margin:8px 0 0;display:grid;grid-template-columns:110px 1fr;gap:6px 14px;font-size:.9rem}
.ficha dt{font-weight:700;color:var(--acento);font-size:.78rem;padding-top:2px}
.ficha dd{margin:0;color:var(--fg-2)}.ficha dd b{color:var(--fg)}
.ejs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 16px}
.ejs small{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);margin-right:4px}
.ejs button{border:1px solid var(--line-2);background:var(--bg);color:var(--fg-2);border-radius:99px;padding:5px 12px;font:600 .8rem var(--ff-b);cursor:pointer}
.ejs button:hover{border-color:var(--marino-2);color:var(--marino-2)}
.ejs button[aria-pressed="true"]{background:var(--marino);border-color:var(--marino);color:var(--bg)}
.ejs button.lim{margin-left:auto;border-style:dashed}
.esc{margin-top:14px}
.esc h4{margin:0 0 4px;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3)}
.esc table{border-collapse:collapse;width:100%;font-size:.86rem}
.esc td,.esc th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.esc th{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3)}
.esc tr.on td{background:color-mix(in srgb,var(--marino-2) 14%,transparent);color:var(--fg);font-weight:600}
.esc tr.on td:first-child{box-shadow:inset 3px 0 0 var(--marino-2)}
.cur table{border-collapse:collapse;width:100%;font-size:.87rem;background:var(--panel)}
.cur td,.cur th{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.cur th{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3);background:var(--panel-2)}
.cur td a{color:var(--marino-2);font-weight:600;text-decoration:none}
.cur h2{font-family:var(--ff-s);font-size:1.15rem;margin:24px 0 8px}
.cur .wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
.cur ul{color:var(--fg-2);font-size:.92rem;padding-left:20px}
nav.side a.curl{font-weight:700;color:var(--acento);border:1px dashed var(--line-2);margin-bottom:6px}
nav.side a.curl[aria-current="true"]{color:var(--bg)}
.ley{font-size:.72rem;color:var(--fg-3);margin:0 0 4px 2px}.ley i{display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 4px 0 8px}.ley i:first-child{margin-left:0}
@media (max-width:600px){.ficha dl{grid-template-columns:1fr;gap:2px}.ficha dd{margin-bottom:6px}.ejs button.lim{margin-left:0}}
@media (max-width:820px){
  .lay{grid-template-columns:1fr;padding:14px 16px 80px;gap:12px}
  nav.side{display:none}
  .selm{display:block;width:100%;padding:9px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel);color:var(--fg);font:600 .95rem var(--ff-b)}
  .grid{grid-template-columns:1fr 1fr}
  .card{padding:16px}
}
@media (max-width:440px){.grid{grid-template-columns:1fr}.brand span{display:none}}
</style>

<body>
<header class="top"><div class="top-in">
  <a class="brand" href="../"><span class="dot">HEP</span><span>Calculadoras · Hepatología 2026</span></a>
  <a class="back" href="../">← Repositorio</a>
  <button class="tema" id="tema" type="button" aria-label="Cambiar tema">◐</button>
</div></header>
<div class="lay">
  <nav class="side" id="side" aria-label="Calculadoras"></nav>
  <main>
    <select class="selm" id="selm" aria-label="Elegir calculadora"></select>
    <div id="calc"></div>
  </main>
</div>

<script>
/* ===================== utilidades ===================== */
const ln=Math.log, clamp=(x,a,b)=>Math.min(b,Math.max(a,x)), r1=x=>Math.round(x*10)/10, r2=x=>Math.round(x*100)/100;
const fmt=(x,d=1)=>Number.isFinite(x)?x.toLocaleString('es-CL',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const n=(name,label,unit,ex)=>({t:'n',id:name,l:label,u:unit,ex});
const s=(name,label,opts)=>({t:'s',id:name,l:label,o:opts});
const c=(name,label)=>({t:'c',id:name,l:label});
const tx=(name,label,ex)=>({t:'t',id:name,l:label,ex});
function need(v,keys){return keys.every(k=>v[k]!==null&&v[k]!==''&&!Number.isNaN(v[k]));}
function V(k,val,cls){return {k,v:val,cls}}

/* ===================== calculadoras ===================== */
const CALCS=[
/* ---------- cirrosis ---------- */
{id:'child',g:'Cirrosis',t:'Child-Pugh',d:'Clasificación de función hepática en cirrosis.',
 i:[n('bili','Bilirrubina','mg/dL','2.4'),n('alb','Albúmina','g/dL','3.1'),n('inr','INR','','1.6'),
    s('asc','Ascitis',[[1,'Ausente'],[2,'Leve o controlada con diuréticos'],[3,'Moderada-grave o refractaria']]),
    s('eh','Encefalopatía',[[1,'Ausente'],[2,'Grado I–II o controlada'],[3,'Grado III–IV o refractaria']]),
    c('col','Enfermedad colestásica (CBP/CEP): cortes de bilirrubina 4 y 10 mg/dL')],
 f(v){if(!need(v,['bili','alb','inr']))return null;
  const b=v.col?(v.bili<4?1:v.bili<=10?2:3):(v.bili<2?1:v.bili<=3?2:3);
  const a=v.alb>3.5?1:v.alb>=2.8?2:3, i=v.inr<1.7?1:v.inr<=2.3?2:3;
  const p=b+a+i+(+v.asc)+(+v.eh); const cl=p<=6?'A':p<=9?'B':'C';
  return {vals:[V('Puntaje',p,p<=6?'ok':p<=9?'mid':'bad'),V('Clase',cl,p<=6?'ok':p<=9?'mid':'bad')],
   txt:`Bilirrubina ${b} · albúmina ${a} · INR ${i} · ascitis ${v.asc} · encefalopatía ${v.eh}.<br>GES 88: queda en atención primaria con A5–6 o B7 y MELD-Na ≤ 14; Child ≥ 8 se deriva a especialidad. TIPS preventivo si C 10–13 (o B 8–9 con sangrado activo).`}},
 ref:'Pugh RN et al. Br J Surg 1973;60:646-9.'},

{id:'meld',g:'Cirrosis',t:'MELD · MELD-Na · MELD 3.0',d:'Pronóstico a 90 días y prioridad en lista de trasplante (Chile asigna por MELD-Na).',
 i:[n('bili','Bilirrubina','mg/dL','3.2'),n('inr','INR','','1.8'),n('cr','Creatinina','mg/dL','1.4'),n('na','Sodio','mmol/L','131'),
    n('alb','Albúmina (para MELD 3.0)','g/dL','2.9'),s('sex','Sexo (para MELD 3.0)',[['m','Hombre'],['f','Mujer']]),
    c('dial','Diálisis ≥ 2 veces en la última semana o hemofiltración ≥ 24 h')],
 f(v){if(!need(v,['bili','inr','cr']))return null;
  const B=Math.max(1,v.bili), I=Math.max(1,v.inr), C=v.dial?4:clamp(v.cr,1,4);
  let mi=0.957*ln(C)+0.378*ln(B)+1.120*ln(I)+0.643; mi=Math.round(mi*10)/10*10; const meld=Math.min(40,Math.round(mi));
  const out=[V('MELD',meld,meld<15?'ok':meld<25?'mid':'bad')]; let mna=null,m3=null;
  if(need(v,['na'])){const Na=clamp(v.na,125,137); mna=meld>11?meld+1.32*(137-Na)-0.033*meld*(137-Na):meld; mna=Math.min(40,Math.round(mna)); out.push(V('MELD-Na',mna,mna<15?'ok':mna<25?'mid':'bad'));}
  if(need(v,['na','alb'])){const Na=clamp(v.na,125,137),Al=clamp(v.alb,1.5,3.5),C3=v.dial?3:clamp(v.cr,1,3);
    m3=(v.sex==='f'?1.33:0)+4.56*ln(B)+0.82*(137-Na)-0.24*(137-Na)*ln(B)+9.09*ln(I)+11.14*ln(C3)+1.85*(3.5-Al)-1.83*(3.5-Al)*ln(C3)+6;
    m3=clamp(Math.round(m3),6,40); out.push(V('MELD 3.0',m3,m3<15?'ok':m3<25?'mid':'bad'));}
  const ref=mna??meld;
  const mort=ref<10?'~2 %':ref<20?'~6 %':ref<30?'~20 %':ref<40?'~53 %':'~71 %';
  return {vals:out,txt:`<b>Valor de referencia en Chile: ${mna!==null?'MELD-Na '+mna:'MELD '+meld+' (ingrese el sodio para el MELD-Na)'}</b>. Mortalidad a 90 días orientativa: <b>${mort}</b>. MELD/MELD-Na ≥ 15: derivar a evaluación de trasplante. MELD-Na ≥ 15 también deriva a especialidad en el GES 88. Hepatitis alcohólica: MELD &gt; 20 grave; ventana de corticoides 21–39.<br>Límites aplicados: valores &lt; 1 llevados a 1; creatinina máx. 4 (MELD) y 3 (MELD 3.0); sodio 125–137; albúmina 1,5–3,5.`}},
 ref:'Kamath PS, Hepatology 2001 · Kim WR, NEJM 2008 (MELD-Na) · Kim WR, Gastroenterology 2021;161:1887 (MELD 3.0).'},

{id:'albi',g:'Cirrosis',t:'ALBI',d:'Función hepática por albúmina y bilirrubina; útil en HCC (BCLC 2026 la incorpora).',
 i:[n('bili','Bilirrubina','mg/dL','1.1'),n('alb','Albúmina','g/dL','3.6')],
 f(v){if(!need(v,['bili','alb']))return null; const x=Math.log10(v.bili*17.1)*0.66+(v.alb*10)*-0.085;
  const gr=x<=-2.60?1:x<=-1.39?2:3;
  return {vals:[V('ALBI',fmt(x,2),gr===1?'ok':gr===2?'mid':'bad'),V('Grado',gr,gr===1?'ok':gr===2?'mid':'bad')],txt:'Grado 1 ≤ −2,60 · grado 2 &gt; −2,60 a ≤ −1,39 · grado 3 &gt; −1,39. Discrimina dentro del Child A.'}},
 ref:'Johnson PJ et al. J Clin Oncol 2015;33:550-8.'},

{id:'hpcs',g:'Cirrosis',t:'cACLD y HPCS no invasiva (Baveno VIII)',d:'Reglas de Baveno VIII con rigidez hepática (VCTE, en ayuno), plaquetas y rigidez esplénica a 100 Hz; incluye la decisión de endoscopía en quien no puede recibir BBNS.',
 i:[n('lsm','Rigidez hepática (VCTE)','kPa','18'),n('plt','Plaquetas','×10³/µL','128'),n('ssm','Rigidez esplénica 100 Hz (opcional)','kPa',''),n('bmi','IMC (para ANTICIPATE-NASH)','kg/m²','27'),
    s('et','Etiología',[['v','Viral'],['a','Alcohol'],['m','MASLD con IMC < 30'],['mo','MASLD con IMC ≥ 30'],['o','Otra']]),
    c('bb','Ya recibe betabloqueador no selectivo'),c('nobb','No puede recibir BBNS (contraindicación o intolerancia)'),
    c('sup','Causa retirada o suprimida (abstinencia, RVS, VHB suprimido)')],
 f(v){if(!need(v,['lsm','plt']))return null;
  const L=v.lsm,P=v.plt,S=v.ssm; let cacld=L<10?'Descarta cACLD':L<=15?'Sugiere cACLD':'cACLD muy probable';
  let h,cls; const out=L<=15&&P>=150;
  const nash=(v.et==='m'||v.et==='mo')&&v.bmi!==null;
  const lg=nash?-3.9529402+2.2835809*ln(L)-0.033777725*v.bmi-0.014490895*P:-6.3320165+3.1001014*ln(L)-0.020481545*Math.min(P,150);
  const pr=1/(1+Math.exp(-lg)), mod=nash?'ANTICIPATE-NASH':'ANTICIPATE', prOk=L>=10&&((v.et!=='m'&&v.et!=='mo')||nash);
  const inA=(L>=25&&['v','a','m'].includes(v.et))||(S!==null&&S>55)||(prOk&&pr>=0.75);
  const vasc=L<10&&(P<150||(S!==null&&S>40));
  if(vasc){h='No aplica: sospecha vascular';cls='mid'}else if(out||L<10){h='HPCS descartada';cls='ok'}else if(inA){h='HPCS confirmada';cls='bad'}else{h='Zona gris';cls='mid'}
  if(vasc) return {vals:[V('cACLD','Descarta cACLD','ok'),V('HPCS',h,cls)],txt:'<b>Rigidez &lt; 10 kPa con signos de hipertensión portal:</b> los criterios de cACLD y HPCS no aplican. Sospechar <b>enfermedad vascular hepática</b> (Baveno VIII 1.6): Doppler y TC con contraste para trombosis portal o Budd-Chiari; si no hay trombosis, biopsia adecuada y puntaje PSVD/NCPF (calculadora en «Enfermedad vascular»). En PSVD la endoscopía se evita solo con rigidez esplénica &lt; 40 kPa y bilirrubina &lt; 1 mg/dL.'};
  const evita=(L<20&&P>=150)||(S!==null&&S<40);
  const rep=v.sup?'3 años (causa suprimida)':'2 años (causa activa)';
  let endo='';
  if(v.bb&&!v.nobb) endo='En BBNS: no requiere endoscopía de tamizaje (Baveno VIII 3.18).';
  else if(inA&&!v.nobb) endo='<b>Carvedilol</b> 6,25 mg/día → 6,25 mg c/12 h; no requiere endoscopía de tamizaje.';
  else if(evita) endo='Evita endoscopía: '+(L<20&&P>=150?'rigidez &lt; 20 kPa y plaquetas ≥ 150.000 (Baveno VI)':'rigidez esplénica &lt; 40 kPa (Baveno VIII 1.19)')+'. Repetir los tests en 12 meses.';
  else if(v.nobb) endo='<b>Endoscopía</b>: ligar várices grandes (esofágicas o GOV1). Sin várices, repetir a los '+rep+', salvo que antes cumpla los criterios para evitarla (Baveno VIII 1.19–1.20).';
  else if(L<25&&P>110) endo='Cumple el criterio expandido (&lt; 25 kPa y &gt; 110.000), que no es de consenso: riesgo bajo de várices que requieren tratamiento. Si no inicia BBNS, decisión individual.';
  else endo='Si no inicia BBNS: endoscopía de tamizaje. Sin várices, repetir a los '+rep+'.';
  let nota=''; if(L>=25&&v.et==='mo'&&!(S>55)) nota='<br>En MASLD con obesidad el corte de 25 kPa pierde VPP: la decisión se apoya en ANTICIPATE-NASH o en la rigidez esplénica.';
  if(prOk) nota+=`<br><b>${mod}</b>: probabilidad de HPCS ${Math.round(pr*100)} % (≥ 75 % confirma por Baveno VIII).`;
  else if(v.et==='m'||v.et==='mo') nota+='<br>Ingrese el IMC para calcular ANTICIPATE-NASH.';
  if(h==='Zona gris') nota+='<br>Zona gris: agregar rigidez esplénica o reevaluar a los 12 meses; GPVH si cambia la conducta.';
  if(L>=10) nota+='<br>Índice ≥ 10 kPa: confirmar con una segunda medición en ayuno u otro test de fibrosis avanzada antes de rotular la cACLD.';
  const vv=[V('cACLD',cacld,L<10?'ok':L<=15?'mid':'bad'),V('HPCS',h,cls)]; if(prOk)vv.push(V(mod,Math.round(pr*100)+' %',pr>=0.75?'bad':pr>=0.5?'mid':'ok'));
  return {vals:vv,txt:endo+nota}},
 ref:'Abraldes JG, Hepatology 2016;64:2173 (ANTICIPATE) · Pons M, Am J Gastroenterol 2021;116:723 (ANTICIPATE-NASH; fórmulas según Rabiee A, Hepatol Commun 2022) · Baveno VIII – Advancing consensus in portal hypertension. J Hepatol 2026;85:993-1018 (1.3–1.20, 3.18–3.19) · Baveno VII (J Hepatol 2022;76:959).'},

{id:'aclf',g:'Cirrosis',t:'ACLF: grado EASL-CLIF y CLIF-C ACLF',d:'Fallas orgánicas por CLIF-OF, grado de ACLF y score pronóstico (si no hay ACLF, usar CLIF-C AD).',
 i:[n('age','Edad','años','56'),n('wbc','Leucocitos','×10⁹/L','14'),n('bili','Bilirrubina','mg/dL','8'),n('cr','Creatinina','mg/dL','2.4'),c('rrt','Terapia de reemplazo renal'),
    s('eh','Encefalopatía (West Haven)',[[0,'Ausente'],[1,'Grado I–II'],[3,'Grado III–IV']]),n('inr','INR','','2.1'),
    s('circ','Circulación',[[1,'PAM ≥ 70 mmHg'],[2,'PAM < 70 mmHg'],[3,'Vasopresores']]),
    s('resp','Respiración',[[1,'PaO₂/FiO₂ > 300 (SpO₂/FiO₂ > 357)'],[2,'PaO₂/FiO₂ 201–300 (SpO₂/FiO₂ 215–357)'],[3,'PaO₂/FiO₂ ≤ 200 (≤ 214) o ventilación mecánica']])],
 f(v){if(!need(v,['age','wbc','bili','cr','inr']))return null;
  const liv=v.bili<6?1:v.bili<12?2:3, kid=(v.rrt||v.cr>=3.5)?3:v.cr>=2?2:1, bra=v.eh==0?1:v.eh==1?2:3, coa=v.inr<2?1:v.inr<2.5?2:3, cir=+v.circ, res=+v.resp;
  const of=liv+kid+bra+coa+cir+res;
  const F={hig:v.bili>=12,ren:v.cr>=2||v.rrt,cer:v.eh==3,coa:v.inr>=2.5,cir:v.circ==3,res:v.resp==3};
  const nf=Object.values(F).filter(Boolean).length;
  const crMod=v.cr>=1.5&&v.cr<2, ehMod=v.eh==1;
  let g;
  if(nf>=3)g=3;else if(nf===2)g=2;
  else if(nf===1){ if(F.ren)g=1; else if(F.cer)g=crMod?1:0; else g=(crMod||ehMod)?1:0; }
  else g=0;
  const score=10*(0.33*of+0.04*v.age+0.63*ln(v.wbc)-2);
  const mort={0:'~5 %',1:'~22 %',2:'~32 %',3:'~77 %'}[g];
  const lista=Object.entries(F).filter(e=>e[1]).map(e=>({hig:'hepática',ren:'renal',cer:'cerebral',coa:'coagulación',cir:'circulatoria',res:'respiratoria'})[e[0]]).join(', ')||'ninguna';
  return {vals:[V('Grado',g?('ACLF-'+g):'Sin ACLF',g===0?'ok':g===1?'mid':'bad'),V('CLIF-OF',of,''),V('CLIF-C ACLF',g?Math.round(score):'—',g?(score>=64?'bad':'mid'):'')],
   txt:`Fallas: <b>${lista}</b>. Mortalidad a 28 días del grado: <b>${mort}</b>.${g?' CLIF-C ACLF &gt; 64 persistente a los 3–7 días: pronóstico muy malo sin trasplante. Reevaluar el grado a los 3–7 días.':' Sin ACLF: usar CLIF-C AD.'}`}},
 ref:'Moreau R et al. Gastroenterology 2013 (CANONIC) · Jalan R et al. J Hepatol 2014;61:1038 (CLIF-C ACLF).'},

{id:'clifad',g:'Cirrosis',t:'CLIF-C AD',d:'Pronóstico en descompensación aguda sin ACLF.',
 i:[n('age','Edad','años','58'),n('cr','Creatinina','mg/dL','1.2'),n('inr','INR','','1.5'),n('wbc','Leucocitos','×10⁹/L','8'),n('na','Sodio','mmol/L','133')],
 f(v){if(!need(v,['age','cr','inr','wbc','na']))return null; const x=10*(0.03*v.age+0.66*ln(v.cr)+1.71*ln(v.inr)+0.88*ln(v.wbc)-0.05*v.na+8);
  const k=x<=45?'ok':x<60?'mid':'bad';
  return {vals:[V('CLIF-C AD',Math.round(x),k)],txt:'≤ 45 riesgo bajo (mortalidad a 3 meses &lt; 2 %) · 46–59 intermedio · ≥ 60 alto (&gt; 30 %).'}},
 ref:'Jalan R et al. J Hepatol 2015;62:831-40.'},

{id:'aki',g:'Cirrosis',t:'Lesión renal aguda (ICA-ADQI)',d:'Estadio por creatinina; criterios de diuresis según la guía.',
 i:[n('base','Creatinina basal (últimos 3 meses)','mg/dL','0.9'),n('act','Creatinina actual','mg/dL','1.6'),c('d48','Alza ≥ 0,3 mg/dL en 48 h'),c('rrt','Terapia de reemplazo renal')],
 f(v){if(!need(v,['base','act']))return null; const r=v.act/v.base; let st=0;
  if(v.rrt||r>=3||(v.act>=4&&(v.act-v.base)>=0.3))st=3;else if(r>=2)st=2;else if(r>=1.5||v.d48)st=1;
  let lab=st===0?'Sin LRA':st===1?(v.act<1.5?'1A':'1B'):String(st);
  return {vals:[V('Razón',fmt(r,2),''),V('Estadio',lab,st===0?'ok':st===1?'mid':'bad')],
   txt:st===0?'No cumple LRA por creatinina (evaluar diuresis &lt; 0,5 mL/kg/h por ≥ 6 h).':
   'Retirar diuréticos, nefrotóxicos y BBNS si hay hipotensión; buscar infección y hemorragia; expandir según volemia (albúmina 1 g/kg/día, máx. 100 g, hasta 2 días). '+(st>=2||v.act>=1.5?'Si no responde y cumple criterios: <b>HRS-AKI → terlipresina + albúmina</b>.':'Estadio 1A: vigilar; progresión → expansión y evaluación de HRS-AKI.')}},
 ref:'Nadim MK et al. ICA-ADQI 2024. J Hepatol 2024;81:163-83.'},

{id:'ascitis',g:'Cirrosis',t:'Líquido ascítico y paracentesis',d:'GASA, PMN corregidos y albúmina a reponer.',
 i:[n('as','Albúmina sérica','g/dL','2.8'),n('aa','Albúmina en ascitis','g/dL','0.9'),n('pt','Proteínas totales en ascitis','g/dL','1.2'),
    n('pmn','PMN en ascitis','/mm³','310'),n('gr','Eritrocitos en ascitis','/mm³','2000'),n('lit','Litros extraídos','L','7')],
 f(v){const vals=[],t=[];
  if(need(v,['as','aa'])){const g=v.as-v.aa; vals.push(V('GASA',fmt(g,1),g>=1.1?'mid':'')); t.push(g>=1.1?'GASA ≥ 1,1: hipertensión portal.':'GASA &lt; 1,1: causa no portal (peritoneal, pancreática, nefrótica).');
    if(need(v,['pt'])) t.push(g>=1.1&&v.pt>=2.5?'Proteínas ≥ 2,5 g/dL con GASA alto: cardíaca o Budd-Chiari.':v.pt<1.5?'Proteínas &lt; 1,5 g/dL: alto riesgo de PBE (evaluar profilaxis primaria).':'');}
  if(need(v,['pmn'])){const cor=Math.max(0,v.pmn-(v.gr||0)/250); vals.push(V('PMN corregidos',Math.round(cor),cor>=250?'bad':'ok')); t.push(cor>=250?'<b>PBE</b>: ceftriaxona + albúmina 1,5 g/kg día 1 y 1 g/kg día 3.':'Sin PBE por recuento.');}
  if(need(v,['lit'])){ if(v.lit>5){vals.push(V('Albúmina','' + Math.round(6*v.lit)+'–'+Math.round(8*v.lit)+' g','')); t.push('6–8 g por litro extraído.');} else {vals.push(V('Albúmina','No necesaria','ok')); t.push('≤ 5 L: albúmina no obligatoria.');}}
  return vals.length?{vals,txt:t.filter(Boolean).join(' ')}:null},
 ref:'EASL CPG descompensada 2018 · Runyon BA.'},

/* ---------- enfermedad vascular hepática ---------- */
{id:'psvd',g:'Enfermedad vascular',t:'PSVD / NCPF: puntaje diagnóstico (Baveno VIII)',d:'Trastorno vascular porto-sinusoidal o fibrosis portal no cirrótica. Requiere biopsia adecuada (≥ 15 mm, un fragmento ≥ 10 mm) sin cirrosis y ausencia de criterios de exclusión.',
 i:[s('hp','Signos de hipertensión portal (el más alto)',[[3,'Específico: várices esofágicas medianas o grandes, várices gástricas, colaterales espontáneas o rigidez esplénica > 40 kPa sin neoplasia mieloproliferativa'],[2,'Inespecífico: ascitis clínica, várices pequeñas, plaquetas < 150.000 o esplenomegalia'],[0,'Ninguno']]),
    s('hi','Lesión histológica',[[5,'Mayor: HNR, vénulas portales muscularizadas, estenosis de vénulas en ≥ 50 % de los espacios porta, o las tres menores juntas'],[2,'Menor: distribución vascular anormal, estenosis en 25–49 %, cambios regenerativos sin HNR clara'],[0,'Normal']]),
    c('aso','Condición asociada (tiopurinas, oxaliplatino, didanosina, inmunodeficiencia común variable, EII, celíaca, autoinmunes sistémicas, trombofilia, NMP, VIH, trasplante, genéticas…)'),
    c('cir','Causa concomitante de cirrosis (virus, alcohol, síndrome metabólico)'),
    c('ok','Biopsia adecuada sin cirrosis y sin criterios de exclusión (Budd-Chiari, cardiopatía/Fontan, colestasias, fibrosis congénita, esquistosomiasis hepatoesplénica, SOS < 6 meses, infiltración…)')],
 f(v){const p=(+v.hp)+(+v.hi)+(v.aso?1:0)-(v.cir?1:0);
  const cat=p>=5?'Definitivo':p>=3?'Posible':'No';
  let txt=p>=5?'<b>PSVD/NCPF definitivo.</b> Estudiar condiciones asociadas (fármacos, inmunes, hematológicas, genéticas, VIH); endoscopía al diagnóstico salvo rigidez esplénica &lt; 40 kPa con bilirrubina &lt; 1 mg/dL; TC o RM con contraste; Doppler cada 6 meses si hay hipertensión portal. No aplicar Baveno VI.'
   :p>=3?'<b>Posible PSVD/NCPF.</b> Completar estudios (nueva biopsia, rigidez hepática y esplénica), derivar a un centro con experiencia en enfermedad vascular y seguir para detectar signos nuevos.'
   :'No cumple criterios de PSVD/NCPF.';
  if(!v.ok) txt='<b>Atención:</b> el puntaje solo es válido con biopsia adecuada sin cirrosis y sin criterios de exclusión.<br>'+txt;
  return {vals:[V('Puntaje',p,p>=5?'bad':p>=3?'mid':'ok'),V('PSVD/NCPF',cat,p>=5?'bad':p>=3?'mid':'ok')],
   txt:txt+'<br>Hipertensión portal '+v.hp+' · histología '+v.hi+' · condición asociada '+(v.aso?1:0)+' · causa de cirrosis '+(v.cir?-1:0)+'. 0–2 no · 3–4 posible · ≥ 5 definitivo.'}},
 ref:'Baveno VIII – J Hepatol 2026;85:993-1018, Fig. 4 y enunciados 8.38–8.53; tablas S2 y S3.'},

{id:'tvpnc',g:'Enfermedad vascular',t:'Trombosis portal no cirrótica: anticoagulación',d:'Duración y estrategia a largo plazo según factores de riesgo de recurrencia (Baveno VIII, Fig. 5 y tabla S4). Siempre: anticoagulación terapéutica inmediata al diagnóstico.',
 i:[s('pm','Factor de riesgo permanente',[['no','Ausente'],['nm','No mayor: FV Leiden o G20210A heterocigoto aislado, hiperhomocisteinemia, obesidad central, variantes NGS de alto riesgo'],['ma','Mayor: NMP, HPN, SAF, Behçet, trombofilia homocigota o compuesta, déficit AT/PC/PS, cáncer activo, TVP personal o familiar 1.er grado']]),
    c('prov','Provocada: factor reversible en los 3 meses previos (cirugía, trauma o inflamación/infección abdominal, estrógenos, embarazo, CMV, SARS-CoV-2)'),
    c('res','El factor reversible ya resolvió'),
    s('rec','Recanalización',[['nd','Aún no evaluada'],['c3','Completa a los 3 meses'],['inc','Incompleta a los 6 meses']]),
    c('ext','Extensión a la mesentérica superior o a la esplénica')],
 f(v){let rc,cls,txt;
  if(v.pm==='ma'){rc='Alto';cls='bad';txt='<b>Anticoagulación indefinida a dosis plena</b> (fuerte).';}
  else if(v.pm==='nm'||!v.prov){rc='Intermedio o indeterminado';cls='mid';txt='Tras el período inicial, considerar <b>ACOD a dosis baja</b> indefinido (débil; dato disponible: rivaroxabán 15 mg/día).';}
  else {rc='Bajo';cls='ok';txt=v.res?'Tras el período inicial, considerar <b>suspender</b> (débil).':'Mantener mientras persista el factor reversible; luego considerar suspender.';}
  let dur='Duración mínima: <b>6 meses</b> (fuerte).';
  if(v.rec==='c3'&&v.prov&&v.res&&v.pm==='no') dur='Recanalización completa a los 3 meses, factor reversible resuelto y sin factor permanente: <b>puede suspenderse ya</b> (débil, nuevo).';
  if(v.rec==='inc'&&v.ext) dur='Sin recanalización a los 6 meses con extensión mesentérica o esplénica: puede seguir <b>6 meses más a dosis plena</b>, porque la recanalización tardía ocurre (débil).';
  let extra=v.ext?'<br>Extensión mesentérica: vigilar isquemia intestinal; si persiste o empeora tras 24–48 h de anticoagulación sin indicación de resección, tratamiento endovascular en un centro experto.':'';
  return {vals:[V('Riesgo de recurrencia',rc,cls)],txt:dur+'<br>'+txt+extra+'<br>Endoscopía al diagnóstico; sin várices de alto riesgo, repetir a los 12 meses y luego cada 2 años (se evita si la rigidez esplénica es &lt; 40 kPa). ACOD contraindicados en SAF doble o triple positivo, embarazo y filtración &lt; 30 mL/min.'}},
 ref:'Baveno VIII – J Hepatol 2026;85:993-1018, enunciados 9.1–9.15, Fig. 5 y tabla S4.'},

{id:'cirugia',g:'Cirrosis',t:'Riesgo quirúrgico en cirrosis',d:'Orientación por Child-Pugh, MELD y tipo de cirugía; la estimación individual se hace con VOCAL-Penn.',
 i:[s('cp','Child-Pugh',[['A','A'],['B','B'],['C','C']]),n('meld','MELD','','14'),
    s('tipo','Tipo de cirugía',[['pa','Pared abdominal (hernias)'],['lap','Abdominal laparoscópica'],['ab','Abdominal abierta'],['vas','Vascular'],['ort','Ortopédica mayor'],['car','Torácica o cardíaca']]),
    c('urg','Cirugía de urgencia'),c('asc','Ascitis no controlada'),c('hp','HPCS o GPVH ≥ 16 mmHg')],
 f(v){if(!need(v,['meld']))return null;
  const m=v.meld, cpM={A:'~10 %',B:'~31 %',C:'~76 %'}[v.cp], mM=m<8?'~6 %':m<12?'~6–25 %':m<=15?'~25 %':m<=20?'~25–50 %':'~50 %';
  let nivel=0; if(v.cp==='B'||(m>=10&&m<=15))nivel=1; if(v.cp==='C'||m>15)nivel=2; if(v.urg||['ab','car'].includes(v.tipo))nivel=Math.min(2,nivel+1); if(v.asc||v.hp)nivel=Math.max(nivel,1);
  const etq=['Bajo','Intermedio','Alto'][nivel];
  const cond=['Operar con manejo perioperatorio estándar en centro con hepatología.','Optimizar antes: control de ascitis, nutrición, corrección de sodio y función renal; decidir en equipo con hepatología. Considerar alternativas menos invasivas.','Evitar la cirugía electiva; evaluar trasplante primero o en conjunto. Si es urgente, centro con trasplante y UPC.'][nivel];
  return {vals:[V('Riesgo',etq,['ok','mid','bad'][nivel]),V('Mortalidad (Child)',cpM,''),V('Mortalidad 30 d (MELD)',mM,'')],
   txt:`${cond}<br>La cirugía abdominal abierta, cardíaca y la de urgencia elevan el riesgo; la hernia umbilical con ascitis se repara con la ascitis controlada (TIPS previo en casos seleccionados).<br>Para una probabilidad individual a 30, 90 y 180 días use la <a href="https://www.vocalpennscore.com/" target="_blank" rel="noopener">calculadora oficial VOCAL-Penn</a> (edad, ASA, tipo de cirugía, urgencia, MASLD, albúmina, plaquetas, bilirrubina, obesidad): su fórmula usa splines no publicadas en el texto del artículo.`}},
 ref:'Garrison RN, Ann Surg 1984 (Child) · Teh SH, Gastroenterology 2007 (Mayo/MELD) · Mahmud N, Hepatology 2021;73:204 (VOCAL-Penn) · Northup PG, AGA CPU 2019.'},

{id:'lfi',g:'Cirrosis',t:'Liver Frailty Index (interpretación)',d:'Categoría y conducta a partir del LFI obtenido en la calculadora oficial (prensión, levantarse 5 veces de la silla, equilibrio).',
 i:[n('lfi','Liver Frailty Index','','4.6'),c('lista','Candidato o en lista de trasplante')],
 f(v){if(!need(v,['lfi']))return null; const x=v.lfi, cat=x<3.2?'Robusto':x<4.5?'Prefrágil':'Frágil';
  return {vals:[V('Categoría',cat,x<3.2?'ok':x<4.5?'mid':'bad')],
   txt:(x>=4.5?'<b>Frágil</b>: mayor mortalidad en lista independiente del MELD; prehabilitación supervisada (ejercicio de resistencia y aeróbico), 35–40 kcal/kg, proteínas 1,2–1,5 g/kg, colación nocturna; buscar sarcopenia por TC en L3. No contraindica el trasplante por sí solo.':x>=3.2?'<b>Prefrágil</b>: intervención nutricional y ejercicio; repetir el LFI cada 3 meses.':'<b>Robusto</b>: repetir en controles; cambio ≥ 0,3 es clínicamente relevante.')+(v.lista?' En lista: medir en cada control y presentar la tendencia al comité.':'')+'<br>El índice combina la prensión ajustada por sexo con una normalización que el artículo no publica: obtenga el valor en la <a href="https://liverfrailtyindex.ucsf.edu/" target="_blank" rel="noopener">calculadora de UCSF</a>.'}},
 ref:'Lai JC, Hepatology 2017;66:564 · AASLD frailty and sarcopenia guidance 2021 · Wolff R, Curso Dávila 2026.'},

/* ---------- alcohol ---------- */
{id:'maddrey',g:'Hepatitis alcohólica',t:'Función discriminante de Maddrey',d:'Gravedad de la hepatitis alcohólica.',
 i:[n('pt','Tiempo de protrombina del paciente','s','24'),n('ptc','Tiempo de protrombina control','s','12'),n('bili','Bilirrubina','mg/dL','14')],
 f(v){if(!need(v,['pt','ptc','bili']))return null; const x=4.6*(v.pt-v.ptc)+v.bili;
  return {vals:[V('Maddrey',fmt(x,1),x>=32?'bad':'ok')],txt:x>=32?'<b>≥ 32: grave</b>. Prednisolona 40 mg/día × 28 días si no hay contraindicación; Lille al día 4–7.':'&lt; 32: no grave; soporte y abstinencia.'}},
 ref:'Maddrey WC, Gastroenterology 1978 · Carithers RL, Ann Intern Med 1989.'},

{id:'lille',g:'Hepatitis alcohólica',t:'Modelo de Lille',d:'Respuesta a corticoides al día 7 (o día 4).',
 i:[n('age','Edad','años','48'),n('alb','Albúmina día 0','g/dL','2.6'),n('b0','Bilirrubina día 0','mg/dL','15'),n('b7','Bilirrubina día 4–7','mg/dL','13'),n('pt','Tiempo de protrombina','s','20'),c('ren','Creatinina > 1,3 mg/dL')],
 f(v){if(!need(v,['age','alb','b0','b7','pt']))return null; const B0=v.b0*17.1,B7=v.b7*17.1;
  const R=3.19-0.101*v.age+0.147*(v.alb*10)+0.0165*(B0-B7)-0.206*(v.ren?1:0)-0.0065*B0-0.0096*v.pt; const L=Math.exp(-R)/(1+Math.exp(-R));
  return {vals:[V('Lille',fmt(L,3),L>0.45?'bad':'ok')],txt:L>0.45?'<b>&gt; 0,45: no respondedor</b> (sobrevida a 6 meses ~25 %). Suspender corticoides; presentar a comité de trasplante precoz.':'≤ 0,45: respondedor (sobrevida a 6 meses ~85 %). Completar 28 días.'}},
 ref:'Louvet A et al. Hepatology 2007;45:1348-54.'},

{id:'gahs',g:'Hepatitis alcohólica',t:'Glasgow (GAHS)',d:'Pronóstico de la hepatitis alcohólica.',
 i:[n('age','Edad','años','52'),n('wbc','Leucocitos','×10⁹/L','16'),n('bun','Nitrógeno ureico (BUN)','mg/dL','20'),n('inr','INR (o razón de protrombina)','','1.9'),n('bili','Bilirrubina','mg/dL','12')],
 f(v){if(!need(v,['age','wbc','bun','inr','bili']))return null; const urea=v.bun*0.357, bu=v.bili*17.1;
  const p=(v.age<50?1:2)+(v.wbc<15?1:2)+(urea<5?1:2)+(v.inr<1.5?1:v.inr<=2?2:3)+(bu<125?1:bu<=250?2:3);
  return {vals:[V('GAHS',p,p>=9?'bad':'ok')],txt:p>=9?'≥ 9: mal pronóstico (sobrevida a 28 días ~46 % sin corticoides).':'&lt; 9: mejor pronóstico.'}},
 ref:'Forrest EH et al. Gut 2005;54:1174-9.'},

{id:'abic',g:'Hepatitis alcohólica',t:'ABIC',d:'Edad, bilirrubina, INR y creatinina.',
 i:[n('age','Edad','años','50'),n('bili','Bilirrubina','mg/dL','10'),n('inr','INR','','1.8'),n('cr','Creatinina','mg/dL','1.1')],
 f(v){if(!need(v,['age','bili','inr','cr']))return null; const x=v.age*0.1+v.bili*0.08+v.cr*0.3+v.inr*0.8;
  return {vals:[V('ABIC',fmt(x,2),x<6.71?'ok':x<9?'mid':'bad')],txt:'&lt; 6,71 riesgo bajo (sobrevida a 90 días ~100 %) · 6,71–8,99 intermedio (~70 %) · ≥ 9 alto (~25 %).'}},
 ref:'Dominguez M et al. Am J Gastroenterol 2008;103:2747-56.'},

/* ---------- fibrosis ---------- */
{id:'fib4',g:'Fibrosis y MASLD',t:'FIB-4',d:'Primer escalón no invasivo en MASLD y hepatopatía crónica.',
 i:[n('age','Edad','años','58'),n('ast','AST','U/L','48'),n('alt','ALT','U/L','52'),n('plt','Plaquetas','×10³/µL','165')],
 f(v){if(!need(v,['age','ast','alt','plt']))return null; const x=v.age*v.ast/(v.plt*Math.sqrt(v.alt)); const lo=v.age>=65?2.0:1.3;
  const k=x<lo?'ok':x<=2.67?'mid':'bad';
  return {vals:[V('FIB-4',fmt(x,2),k)],txt:`&lt; ${fmt(lo,1)} riesgo bajo${v.age>=65?' (corte para ≥ 65 años)':''} · ${fmt(lo,1)}–2,67 intermedio → elastografía · &gt; 2,67 alto → elastografía y hepatología. Menor rendimiento en &lt; 35 años.`}},
 ref:'Sterling RK, Hepatology 2006 · EASL-EASD-EASO MASLD 2024.'},

{id:'apri',g:'Fibrosis y MASLD',t:'APRI',d:'Índice AST/plaquetas.',
 i:[n('ast','AST','U/L','80'),n('uln','Límite superior normal de AST','U/L','40'),n('plt','Plaquetas','×10³/µL','140')],
 f(v){if(!need(v,['ast','uln','plt']))return null; const x=(v.ast/v.uln)/v.plt*100;
  return {vals:[V('APRI',fmt(x,2),x<0.5?'ok':x<=1.5?'mid':'bad')],txt:'&lt; 0,5 descarta fibrosis significativa · &gt; 1,5 fibrosis significativa · &gt; 2,0 cirrosis. OMS 2024: APRI &gt; 0,5 es criterio de tratamiento de VHB donde no hay elastografía.'}},
 ref:'Wai CT, Hepatology 2003 · OMS VHB 2024.'},

{id:'nfs',g:'Fibrosis y MASLD',t:'NAFLD Fibrosis Score',d:'Fibrosis avanzada en MASLD.',
 i:[n('age','Edad','años','55'),n('bmi','IMC','kg/m²','32'),c('dm','Glicemia alterada en ayunas o diabetes'),n('ast','AST','U/L','40'),n('alt','ALT','U/L','45'),n('plt','Plaquetas','×10³/µL','190'),n('alb','Albúmina','g/dL','4.2')],
 f(v){if(!need(v,['age','bmi','ast','alt','plt','alb']))return null; const x=-1.675+0.037*v.age+0.094*v.bmi+1.13*(v.dm?1:0)+0.99*v.ast/v.alt-0.013*v.plt-0.66*v.alb;
  return {vals:[V('NFS',fmt(x,3),x<-1.455?'ok':x<=0.676?'mid':'bad')],txt:'&lt; −1,455 descarta fibrosis avanzada · −1,455 a 0,676 indeterminado · &gt; 0,676 fibrosis avanzada probable.'}},
 ref:'Angulo P et al. Hepatology 2007;45:846-54.'},

{id:'hai',g:'Autoinmunes y colestásicas',t:'Hepatitis autoinmune: criterios simplificados',d:'Puntaje diagnóstico IAIHG 2008.',
 i:[s('ac','Autoanticuerpos',[[0,'Negativos'],[1,'ANA o anti-músculo liso ≥ 1:40'],[2,'ANA o AML ≥ 1:80, o anti-LKM1 ≥ 1:40, o anti-SLA +']]),
    s('igg','IgG',[[0,'Normal'],[1,'> límite superior normal'],[2,'> 1,1 × límite superior normal']]),
    s('his','Histología',[[0,'Atípica'],[1,'Compatible'],[2,'Típica (interfase, emperipolesis, rosetas)']]),

{id:'audc',g:'Autoinmunes y colestásicas',t:'CBP: respuesta al AUDC (enfoque por riesgo)',d:'Estratificación basal y meta según riesgo (6 o 12 meses), más los criterios clásicos de respuesta.',
 i:[n('lsm','Rigidez hepática basal (VCTE)','kPa','11'),n('age','Edad al diagnóstico','años','54'),n('fa0','FA basal','× LSN','3.4'),n('bi0','Bilirrubina basal','× LSN','0.8'),
    s('mes','Momento de la evaluación',[['6','6 meses'],['12','12 meses']]),
    n('fa','FA actual','× LSN','1.9'),n('ast','AST actual (opcional)','× LSN','1.2'),n('bili','Bilirrubina actual','× LSN','0.8'),
    c('hpcs','HPCS, descompensación o Child B–C')],
 f(v){if(!need(v,['fa','bili']))return null;
  const hr=(v.lsm!==null&&v.lsm>=10)||(v.bi0!==null&&v.bi0>1)||(v.fa0!==null&&v.fa0>3)||(v.age!==null&&v.age<=62);
  const meta=hr?1.9:1.67, ok=v.fa<meta&&v.bili<=1, prof=v.fa<=1&&v.bili<=0.6;
  const temprano=hr?'6 meses':'12 meses';
  let estado,cls,txt;
  if(!hr&&v.mes==='6'){estado='Aún no se evalúa';cls='mid';txt='Sin rasgos de alto riesgo: la respuesta se evalúa a los <b>12 meses</b> (meta FA &lt; 1,67 × LSN y bilirrubina normal).';}
  else if(ok){estado=prof?'Respuesta profunda':'Adecuada';cls='ok';txt=prof?'FA normal y bilirrubina ≤ 0,6 × LSN: menor riesgo de trasplante o muerte (GLOBAL). Continuar AUDC; FA y bilirrubina cada 3–6 meses.':'Cumple la meta. Continuar AUDC y controlar FA y bilirrubina cada 3–6 meses; la FA normal es la meta ideal, sobre todo en alto riesgo.';}
  else{estado='Incompleta';cls='bad';txt=v.hpcs?'<b>Con HPCS, descompensación o Child B–C</b>: derivar a trasplante; los agonistas PPAR y fibratos están contraindicados en cirrosis descompensada.':'Agregar <b>seladelpar 10 mg/día</b> (preferido con prurito), <b>elafibranor 80 mg/día</b> (preferido con fatiga) o <b>bezafibrato 400 mg/día</b> (disponible en Chile). Verificar antes adherencia y dosis de 13–15 mg/kg.';}
  const p1=v.ast!==null?(v.fa<=3&&v.ast<=2&&v.bili<=1):null, p2=v.ast!==null?(v.fa<=1.5&&v.ast<=1.5&&v.bili<=1):null, to=v.fa<=1.67;
  const po=v.fa0!==null?(v.fa<1.67&&(v.fa0-v.fa)/v.fa0>=0.15&&v.bili<=1):null;
  const row=(a,b)=>b===null?'':`<tr><td>${a}</td><td class="${b?'si':'no'}">${b?'Cumple':'No cumple'}</td></tr>`;
  return {vals:[V('Riesgo basal',hr?'Alto':'Estándar',hr?'mid':'ok'),V('Evaluar a',temprano,''),V('Respuesta',estado,cls)],
   txt:`${hr?'Alto riesgo (rigidez ≥ 10 kPa, bilirrubina &gt; LSN, FA &gt; 3 × LSN o edad ≤ 62): meta a los 6 meses FA &lt; 1,9 × LSN y bilirrubina normal. ':'Sin alto riesgo: meta a los 12 meses FA &lt; 1,67 × LSN y bilirrubina normal. '}${txt}<table><tr><th>Criterio clásico</th><th></th></tr>${row('París I (FA ≤ 3, AST ≤ 2 × LSN, bilirrubina ≤ 1 mg/dL)',p1)}${row('París II (FA y AST ≤ 1,5 × LSN, bilirrubina normal)',p2)}${row('Toronto (FA ≤ 1,67 × LSN a 2 años)',to)}${row('POISE (FA &lt; 1,67 × LSN con caída ≥ 15 % y bilirrubina normal)',po)}</table>`}},
 ref:'Sandhu S, Goel A. Semin Liver Dis 2026;46:103 (doi 10.1055/a-2952-2261) · Kowdley KV, Am J Gastroenterol 2023 · Murillo Perez CF, Am J Gastroenterol 2020 · Corpechot C, Hepatology 2008 · Nevens F, NEJM 2016.'},

{id:'leipzig',g:'Metabólicas',t:'Wilson: puntaje de Leipzig',d:'Diagnóstico de enfermedad de Wilson.',
 i:[s('kf','Anillos de Kayser-Fleischer',[[0,'Ausentes'],[2,'Presentes']]),s('neu','Síntomas neuropsiquiátricos',[[0,'Ausentes'],[1,'Leves'],[2,'Graves']]),
    s('hem','Anemia hemolítica Coombs negativa',[[0,'Ausente'],[1,'Presente']]),s('cer','Ceruloplasmina sérica',[[0,'Normal (> 20 mg/dL)'],[1,'10–20 mg/dL'],[2,'< 10 mg/dL']]),
    s('cu','Cobre urinario 24 h (sin hepatitis aguda)',[[0,'Normal'],[1,'1–2 × LSN'],[2,'> 2 × LSN, o > 5 × LSN tras penicilamina']]),
    s('hcu','Cobre hepático',[[0,'No medido'],[-1,'Normal (< 50 µg/g)'],[1,'50–249 µg/g, o rodanina + sin cuantificación'],[2,'≥ 250 µg/g (> 5 × LSN)']]),
    s('mut','Mutaciones ATP7B',[[0,'Ninguna detectada'],[1,'Una'],[4,'Dos']])],
 f(v){const p=+v.kf+ +v.neu+ +v.hem+ +v.cer+ +v.cu+ +v.hcu+ +v.mut;
  return {vals:[V('Leipzig',p,p>=4?'bad':p>=2?'mid':'ok')],txt:p>=4?'<b>≥ 4: diagnóstico establecido</b>.':p>=2?'2–3: probable; completar estudio (cobre hepático, genética).':'0–1: improbable.'}},
 ref:'Ferenci P et al. Liver Int 2003 · EASL-ERN Wilson 2025.'},

/* ---------- agudo ---------- */
{id:'rfactor',g:'Daño agudo y DILI',t:'Factor R y ley de Hy',d:'Patrón de daño hepático.',
 i:[n('alt','ALT','U/L','620'),n('altu','LSN de ALT','U/L','40'),n('fa','Fosfatasa alcalina','U/L','180'),n('fau','LSN de FA','U/L','120'),n('bili','Bilirrubina','mg/dL','3.1'),n('bu','LSN de bilirrubina','mg/dL','1.2')],
 f(v){if(!need(v,['alt','altu','fa','fau']))return null; const R=(v.alt/v.altu)/(v.fa/v.fau); const pat=R>=5?'Hepatocelular':R<=2?'Colestásico':'Mixto';
  let hy=''; if(need(v,['bili','bu'])){const h=v.alt/v.altu>3&&v.bili/v.bu>2&&v.fa/v.fau<2; hy=h?'<b>Cumple ley de Hy</b> (ALT &gt; 3 × LSN + bilirrubina &gt; 2 × LSN sin colestasis): mortalidad o trasplante ~10 %.':'No cumple ley de Hy.';}
  return {vals:[V('R',fmt(R,1),''),V('Patrón',pat,'')],txt:'R ≥ 5 hepatocelular · 2–5 mixto · ≤ 2 colestásico. '+hy}},
 ref:'CIOMS · AASLD DILI 2023.'},

{id:'kings',g:'Daño agudo y DILI',t:"Criterios de King's College",d:'Indicación de trasplante en falla hepática aguda.',
 i:[s('tipo','Etiología',[['p','Paracetamol'],['n','No paracetamol']]),n('ph','pH arterial tras resucitación','','7.28'),n('lac','Lactato tras resucitación','mmol/L',''),
    n('inr','INR','','4.2'),n('cr','Creatinina','mg/dL','2.0'),c('eh34','Encefalopatía grado III–IV'),
    n('age','Edad','años','45'),c('desf','Etiología desfavorable (idiosincrática, indeterminada, Wilson)'),c('ict7','Ictericia → encefalopatía > 7 días'),n('bili','Bilirrubina','mg/dL','19')],
 f(v){let ok=false,det='';
  if(v.tipo==='p'){const a=(v.ph!==null&&v.ph<7.3)||(v.lac!==null&&v.lac>3.0); const b=v.inr>6.5&&v.cr>3.4&&v.eh34; ok=a||b;
   det=`pH &lt; 7,30 o lactato &gt; 3,0: ${a?'sí':'no'} · INR &gt; 6,5 + creatinina &gt; 3,4 + encefalopatía III–IV: ${b?'sí':'no'}.`;}
  else{const big=v.inr>6.5; let k=0; if(v.age!==null&&(v.age<10||v.age>40))k++; if(v.desf)k++; if(v.ict7)k++; if(v.inr>3.5)k++; if(v.bili>17.5)k++;
   ok=big||k>=3; det=`INR &gt; 6,5: ${big?'sí':'no'} · criterios menores: ${k} de 5 (edad &lt; 10 o &gt; 40; etiología desfavorable; ictericia → encefalopatía &gt; 7 días; INR &gt; 3,5; bilirrubina &gt; 17,5).`;}
  return {vals:[V("King's",ok?'Cumple':'No cumple',ok?'bad':'ok')],txt:det+(ok?' <b>Listar para trasplante en urgencia nacional</b>.':' No cumplir no excluye el trasplante: reevaluar de forma seriada (MELD &gt; 30, lactato).')}},
 ref:"O'Grady JG et al. Gastroenterology 1989 · ACG FHA 2023."},

{id:'rucam',g:'Daño agudo y DILI',t:'RUCAM: causalidad en DILI',d:'Roussel Uclaf Causality Assessment Method actualizado (2016). Se puntúa un fármaco a la vez; el patrón sale del factor R al primer control alterado.',
 i:[s('pat','Patrón de daño (factor R)',[['h','Hepatocelular (R ≥ 5)'],['c','Colestásico o mixto (R < 5)']]),
    s('lat','1. Latencia',[['2','5–90 días desde el inicio (reexposición: 1–15 d hepatocelular · 1–90 d colestásico)'],['1','< 5 o > 90 días desde el inicio (reexposición: > 15 d · > 90 d)'],['1s','Comenzó tras suspender: ≤ 15 d (hepatocelular) o ≤ 30 d (colestásico)'],['x','Antes de iniciar el fármaco, o > 15 d (hepatocelular) / > 30 d (colestásico) tras suspender']]),
    s('ch','2. Evolución tras suspender — hepatocelular (ALT)',[['3','Cae ≥ 50 % en ≤ 8 días'],['2','Cae ≥ 50 % en ≤ 30 días'],['0','Sin información, fármaco continuado o caída ≥ 50 % después del día 30'],['-2','Cae < 50 % después del día 30, o nueva alza']]),
    s('cc','2. Evolución tras suspender — colestásico o mixto (FA o bilirrubina)',[['2','Cae ≥ 50 % en ≤ 180 días'],['1','Cae < 50 % en ≤ 180 días'],['0','Sin información, persiste, sube o fármaco continuado']]),
    n('age','Edad','años','62'),
    c('alc','3. Alcohol (> 2 tragos/día en mujeres, > 3 en hombres); en patrón colestásico también embarazo'),
    s('con','4. Fármacos concomitantes',[['0','Ninguno, sin información o con latencia incompatible'],['-1','Con latencia compatible o sugerente'],['-2','Hepatotóxico conocido con latencia compatible'],['-3','Con evidencia de su rol (reexposición positiva o test validado)']]),
    s('alt','5. Causas alternativas',[['2','Grupos I y II descartados'],['1','Las 7 causas del grupo I descartadas'],['0','5 o 6 causas del grupo I descartadas'],['-2','Menos de 5 causas del grupo I descartadas'],['-3','Causa alternativa muy probable']]),
    s('prev','6. Hepatotoxicidad conocida del fármaco',[['2','Descrita en la ficha técnica'],['1','Publicada pero no en la ficha'],['0','Desconocida']]),
    s('rex','7. Reexposición',[['0','No hubo u otra situación'],['3','Positiva: ALT (o FA/bilirrubina) se duplica con el fármaco solo, partiendo de ALT < 5 × LSN'],['1','Se duplica, pero con los mismos fármacos que en la primera reacción'],['-2','Sube sin superar el LSN en las mismas condiciones']])],
 f(v){
  if(v.lat==='x')return {vals:[V('RUCAM','—',''),V('Causalidad','No relacionado','ok')],txt:'Latencia incompatible: el caso se considera <b>no relacionado</b> con este fármaco y no se puntúa.'};
  const lat=v.lat==='2'?2:1, cur=v.pat==='h'?+v.ch:+v.cc, ag=v.age!==null&&v.age>=55?1:0, al=v.alc?1:0;
  const p=lat+cur+ag+al+(+v.con)+(+v.alt)+(+v.prev)+(+v.rex);
  const cat=p<=0?'Excluido':p<=2?'Improbable':p<=5?'Posible':p<=8?'Probable':'Muy probable';
  return {vals:[V('RUCAM',p,p>=6?'bad':p>=3?'mid':'ok'),V('Causalidad',cat,p>=6?'bad':p>=3?'mid':'ok')],
   txt:`Latencia ${lat} · evolución ${cur} (${v.pat==='h'?'ALT':'FA/bilirrubina'}) · edad ${ag} · alcohol${v.pat==='c'?'/embarazo':''} ${al} · concomitantes ${v.con} · causas alternativas ${v.alt} · hepatotoxicidad conocida ${v.prev} · reexposición ${v.rex}.<br><b>Grupo I</b> (7): VHA (IgM anti-VHA), VHB (HBsAg, IgM anti-HBc, DNA), VHC (anti-VHC, RNA), VHE (IgM/IgG anti-VHE, RNA), imagen hepatobiliar con Doppler, alcohol (AST/ALT ≥ 2), hipotensión reciente. <b>Grupo II</b>: sepsis, metástasis, HAI, VHB o VHC crónica, CBP/CEP, enfermedades genéticas, CMV, VEB, VHS, VVZ.<br>No se reexpone de forma deliberada: el ítem 7 solo puntúa reexposiciones accidentales. Con ${v.pat==='c'?'patrón colestásico la evolución se mide con FA o bilirrubina, no con ALT.':'patrón hepatocelular la evolución se mide con ALT.'}`}},
 ref:'Danan G, Teschke R. Int J Mol Sci 2016;17:14 (RUCAM actualizado) · Danan G, Bénichou C. J Clin Epidemiol 1993;46:1323 · Fontana RJ et al. AASLD DILI guidance, Hepatology 2023;77:1036.'},

{id:'vhb',g:'Hepatitis virales',t:'Hepatitis B: indicación de tratamiento',d:'Compara EASL 2025, OMS 2024 y la guía MINSAL 2021 con los mismos datos. HBsAg positivo > 6 meses.',
 i:[n('dna','DNA-VHB (vacío si no está disponible)','UI/mL','25000'),n('alt','ALT','U/L','52'),s('sex','Sexo',[['m','Hombre'],['f','Mujer']]),n('age','Edad','años','44'),
    s('ag','HBeAg',[['n','Negativo'],['p','Positivo']]),n('lsm','Rigidez hepática (opcional)','kPa','6.5'),n('apri','APRI (opcional)','','0.4'),
    c('cir','Cirrosis clínica o por imagen'),c('fam','Familiar de 1.er grado con HCC o cirrosis'),c('ehm','Manifestaciones extrahepáticas (glomerulonefritis, vasculitis)'),
    c('coi','Coinfección VIH, VHD o VHC'),c('ims','Inmunosupresión o quimioterapia en curso o planificada'),c('met','Diabetes o MASLD'),c('emb','Embarazo')],
 f(v){if(!need(v,['alt']))return null;
  const D=v.dna, det=D===null?null:D>0, L=v.lsm, cir=v.cir||(L!==null&&L>11), f2=(L!==null&&L>7)||(v.apri!==null&&v.apri>0.5), f3=L!==null&&L>8;
  const ulnO=v.sex==='f'?19:30;
  /* EASL 2025 */
  let e,ek,er;
  if(cir&&det!==false){e='Tratar';ek='bad';er='Cirrosis con DNA detectable, cualquier carga y ALT (fuerte).';}
  else if(D!==null&&D>2000&&(v.alt>40||f2)){e='Tratar';ek='bad';er='DNA &gt; 2.000 UI/mL con ALT &gt; 40 U/L y/o fibrosis significativa (&gt; 7 kPa) (fuerte).';}
  else if(v.ehm){e='Tratar';ek='bad';er='Manifestaciones extrahepáticas por VHB (fuerte).';}
  else if(v.ag==='p'&&D!==null&&D>2000&&(v.age>30||v.fam)){e='Tratar';ek='bad';er='Infección crónica HBeAg positivo con riesgo aumentado de HCC (&gt; 30 años o familiar con HCC) (fuerte).';}
  else if(f3&&det){e='Considerar';ek='mid';er='Fibrosis avanzada (&gt; 8 kPa) con DNA detectable: puede tratarse con cualquier carga y ALT (débil).';}
  else if(D!==null&&D<=2000&&det&&v.alt>40){e='Considerar';ek='mid';er='DNA &lt; 2.000 con ALT persistentemente &gt; 40: puede tratarse tras descartar otra hepatopatía (débil).';}
  else if(v.fam&&det){e='Considerar';ek='mid';er='Familiar con HCC: manejo más intensivo; en principio todo HBsAg con DNA detectable es candidato.';}
  else if(D===null){e='Falta DNA';ek='';er='La indicación EASL requiere DNA-VHB.';}
  else {e='Observar';ek='ok';er='Sin criterio de tratamiento: DNA y ALT cada 6–12 meses, rigidez anual'+(v.ag==='p'&&v.age<=30?'; HBeAg positivo &lt; 30 años sin fibrosis ni factores: no se trata de inmediato.':'.');}
  if(e==='Observar'||e==='Considerar'){if(v.emb&&D!==null&&D>200000){e='TDF semana 24–28';ek='mid';er+=' Embarazo con DNA &gt; 200.000 UI/mL: TDF para prevenir la transmisión vertical (fuerte).';}
   else if(v.ims&&e==='Observar'){e='Profilaxis';ek='mid';er+=' Inmunosupresión: profilaxis antiviral (fuerte).';}}
  /* OMS 2024 */
  const oms=[];
  if(cir||(v.apri!==null&&v.apri>1)||(L!==null&&L>12.5))oms.push('cirrosis');
  else if(f2)oms.push('fibrosis significativa (APRI &gt; 0,5 o &gt; 7 kPa)');
  if(D!==null&&D>2000&&v.alt>ulnO)oms.push(`DNA &gt; 2.000 con ALT &gt; ${ulnO} U/L (confirmar en 2 controles en 6 meses)`);
  if(D===null&&v.alt>ulnO)oms.push(`sin DNA disponible: ALT &gt; ${ulnO} U/L persistente (2 controles en 6–12 meses)`);
  ['coi','fam','ims','met','ehm'].forEach(k=>{if(v[k])oms.push({coi:'coinfección',fam:'historia familiar',ims:'inmunosupresión',met:'diabetes o MASLD',ehm:'manifestaciones extrahepáticas'}[k])});
  /* MINSAL 2021 */
  const mi=[];
  if(cir&&det!==false)mi.push('cirrosis con viremia');
  if(D!==null&&D>=2000&&v.alt>40)mi.push('DNA ≥ 2.000 con ALT elevada');
  if(f2&&det)mi.push('fibrosis ≥ F2');
  if(D!==null&&D>=2000&&(v.age>40||v.fam||v.ehm))mi.push('DNA ≥ 2.000 con edad &gt; 40, familiar con HCC/cirrosis o manifestaciones extrahepáticas');
  let extra='';
  if(v.ims)extra+='<br><b>Inmunosupresión</b>: profilaxis con entecavir o tenofovir antes de iniciar y hasta 12 meses después de suspender (18 meses con anti-CD20), aunque no cumpla criterios de tratamiento.';
  if(v.emb)extra+='<br><b>Embarazo</b>: '+(D!==null&&D>200000?'DNA &gt; 200.000 UI/mL → <b>TDF 300 mg/día</b> desde la semana 24–28 para prevenir la transmisión vertical.':'si DNA &gt; 200.000 UI/mL, TDF desde la semana 24–28.');
  if(v.coi)extra+='<br>Coinfección: VIH → esquema con tenofovir; VHD → evaluar bulevirtida; VHC → tratar VHB antes o durante los AAD.';
  const tr=e==='Tratar'||oms.length||mi.length;
  return {vals:[V('EASL 2025',e,ek),V('OMS 2024',oms.length?'Tratar':'No cumple',oms.length?'bad':'ok'),V('MINSAL 2021',mi.length?'Tratar':'No cumple',mi.length?'bad':'ok')],
   txt:`<b>EASL 2025:</b> ${er}<br><b>OMS 2024:</b> ${oms.length?oms.join('; ')+'.':'sin criterio (LSN de ALT 30 U/L hombres, 19 U/L mujeres).'}<br><b>MINSAL 2021:</b> ${mi.length?mi.join('; ')+'.':'sin criterio.'}${extra}${tr?'<br><b>Fármaco:</b> tenofovir disoproxil 300 mg/día, tenofovir alafenamida 25 mg/día (enfermedad renal u osteoporosis) o entecavir 0,5 mg/día (1 mg en descompensados). GES 68. Antes de tenofovir: serología VIH; todo HBsAg positivo: anti-VHD.':''}`}},
 ref:'EASL CPG hepatitis B. J Hepatol 2025 · OMS, Guidelines for the prevention, diagnosis, care and treatment of chronic hepatitis B, 2024 · MINSAL, Guía clínica hepatitis B, 3.ª ed., 2021.'},

/* ---------- vía biliar ---------- */
{id:'asge',g:'Vía biliar',t:'Coledocolitiasis: riesgo ASGE 2019',d:'Probabilidad de cálculo en el colédoco en el paciente con colelitiasis sintomática, y examen siguiente.',
 i:[c('cal','Cálculo en el colédoco visto en ecografía o tomografía'),c('col','Colangitis aguda'),n('bili','Bilirrubina total','mg/dL','2.1'),
    c('dil','Colédoco dilatado (> 6 mm con vesícula in situ)'),c('lab','Pruebas hepáticas alteradas (FA, GGT, transaminasas o bilirrubina)'),n('age','Edad','años','62')],
 f(v){const alto=v.cal||v.col||(v.bili!==null&&v.bili>4&&v.dil);
  const inter=!alto&&(v.lab||(v.bili!==null&&v.bili>1.2)||(v.age!==null&&v.age>55)||v.dil);
  const r=alto?'Alto':inter?'Intermedio':'Bajo', cls=alto?'bad':inter?'mid':'ok';
  const qu=[];if(v.cal)qu.push('cálculo visto');if(v.col)qu.push('colangitis');if(v.bili>4&&v.dil)qu.push('bilirrubina &gt; 4 con colédoco dilatado');
  const qi=[];if(v.lab||(v.bili!==null&&v.bili>1.2))qi.push('pruebas alteradas');if(v.age>55)qi.push('edad &gt; 55');if(v.dil)qi.push('colédoco dilatado');
  return {vals:[V('Riesgo',r,cls),V('Probabilidad',alto?'&gt; 50 %':inter?'10–50 %':'&lt; 10 %',cls)],
   txt:alto?`Criterio de alto riesgo: ${qu.join(', ')}. <b>CPRE</b> preoperatoria (o exploración laparoscópica de la vía biliar) y colecistectomía en la misma hospitalización.`
   :inter?`Riesgo intermedio por ${qi.join(', ')}. <b>Endosonografía o colangiorresonancia</b> antes de decidir la CPRE (la endosonografía ve mejor los cálculos &lt; 5 mm).`
   :'Sin predictores: <b>colecistectomía</b> sin estudio adicional de la vía biliar.'}},
 ref:'Buxbaum JL et al. ASGE guideline on choledocholithiasis. Gastrointest Endosc 2019;89:1075-1105.'},

{id:'tg18cg',g:'Vía biliar',t:'Colangitis aguda: Tokio 2018',d:'Criterios diagnósticos, grado de gravedad y momento del drenaje biliar.',
 i:[c('fie','A1 · Fiebre > 38 °C o calofríos'),c('inf','A2 · Leucocitos < 4.000 o > 10.000/mm³, o PCR ≥ 1 mg/dL'),c('ict','B1 · Ictericia (bilirrubina ≥ 2 mg/dL)'),c('lab','B2 · FA, GGT, AST o ALT > 1,5 × LSN'),
    c('dil','C1 · Dilatación de la vía biliar'),c('cau','C2 · Causa visible (cálculo, estenosis, prótesis)'),
    c('ofa','Disfunción orgánica: cualquier noradrenalina o dopamina ≥ 5 µg/kg/min, compromiso de conciencia, PaO₂/FiO₂ < 300, oliguria o creatinina > 2 mg/dL, INR > 1,5 o plaquetas < 100.000'),
    n('wbc','Leucocitos','×10³/µL','16.5'),n('tem','Temperatura máxima','°C','39.2'),n('age','Edad','años','78'),n('bili','Bilirrubina total','mg/dL','4.1'),c('alb','Albúmina < 0,7 × límite inferior normal')],
 f(v){const A=v.fie||v.inf,B=v.ict||v.lab,C=v.dil||v.cau; const dx=A&&B&&C?'Definitiva':A&&(B||C)?'Sospecha':'No cumple';
  if(dx==='No cumple')return {vals:[V('Diagnóstico','No cumple','ok')],txt:'Se requiere inflamación sistémica (A) más colestasis (B) o imagen (C).'};
  const k=[v.wbc!==null&&(v.wbc>12||v.wbc<4),v.tem!==null&&v.tem>=39,v.age!==null&&v.age>=75,v.bili!==null&&v.bili>=5,v.alb].filter(Boolean).length;
  const g=v.ofa?3:k>=2?2:1;
  const con={3:'<b>Grado III</b>: soporte orgánico, hemocultivos y antibiótico de amplio espectro; <b>drenaje biliar urgente</b> apenas se estabilice (basta descomprimir con prótesis o sonda nasobiliar).',2:'<b>Grado II</b>: antibiótico y <b>drenaje biliar precoz</b> (primeras 24 h); tratar la causa en el mismo acto si es posible.',1:'<b>Grado I</b>: antibiótico; drenaje si no responde en 24 h o para tratar la causa (cálculo).'}[g];
  return {vals:[V('Diagnóstico',dx,dx==='Definitiva'?'bad':'mid'),V('Gravedad','Grado '+['','I','II','III'][g],['','ok','mid','bad'][g])],
   txt:`${con}${g<3?` Criterios de grado II presentes: ${k} de 5.`:''} Antibiótico por 4–7 días tras controlar el foco; colecistectomía en la misma hospitalización si la causa fue litiásica.`}},
 ref:'Kiriyama S et al. Tokyo Guidelines 2018: diagnostic criteria and severity grading of acute cholangitis. J Hepatobiliary Pancreat Sci 2018;25:17-30 · Miura F et al. TG18 flowchart, ibid. 2018;25:31-40.'},

{id:'tg18cc',g:'Vía biliar',t:'Colecistitis aguda: Tokio 2018',d:'Criterios diagnósticos, grado de gravedad y conducta según comorbilidad.',
 i:[c('mur','A · Signo de Murphy'),c('loc','A · Masa, dolor o sensibilidad en el hipocondrio derecho'),c('fie','B · Fiebre'),c('pcr','B · PCR elevada'),c('leu','B · Leucocitosis'),c('img','C · Imagen compatible (pared engrosada, líquido perivesicular, Murphy ecográfico)'),
    c('ofa','Disfunción orgánica: cualquier noradrenalina o dopamina ≥ 5 µg/kg/min, compromiso de conciencia, PaO₂/FiO₂ < 300, oliguria o creatinina > 2 mg/dL, INR > 1,5 o plaquetas < 100.000'),
    n('wbc','Leucocitos','×10³/µL','14'),c('mas','Masa palpable dolorosa'),n('dur','Horas desde el inicio de los síntomas','h','48'),c('mar','Inflamación local marcada (gangrenosa, enfisematosa, absceso perivesicular o hepático, peritonitis biliar)'),
    n('cci','Índice de comorbilidad de Charlson','','2'),s('asa','ASA',[['1','I'],['2','II'],['3','III'],['4','IV o más']]),c('rev','La falla orgánica es cardiovascular o renal y revierte rápido')],
 f(v){const A=v.mur||v.loc,B=v.fie||v.pcr||v.leu,C=v.img; const dx=A&&B&&C?'Definitiva':A&&B?'Sospecha':'No cumple';
  if(dx==='No cumple')return {vals:[V('Diagnóstico','No cumple','ok')],txt:'Se requiere inflamación local (A) más sistémica (B); la imagen (C) la confirma.'};
  const g=v.ofa?3:((v.wbc!==null&&v.wbc>18)||v.mas||(v.dur!==null&&v.dur>72)||v.mar)?2:1;
  const cci=v.cci, asa=+v.asa; let con;
  if(g===1)con='<b>Grado I</b>: colecistectomía laparoscópica precoz.';
  else if(g===2)con=(cci!==null&&cci<=5&&asa<=2)?'<b>Grado II</b> con Charlson ≤ 5 y ASA ≤ 2: colecistectomía laparoscópica precoz en centro con experiencia.':'<b>Grado II</b> con comorbilidad (Charlson &gt; 5 o ASA ≥ 3): antibiótico y <b>drenaje vesicular</b> (percutáneo o por endosonografía) si no responde; cirugía diferida.';
  else con=(v.rev&&cci!==null&&cci<=3&&asa<=2)?'<b>Grado III</b> con falla rápidamente reversible, Charlson ≤ 3 y ASA ≤ 2: soporte y colecistectomía precoz en centro avanzado.':'<b>Grado III</b>: soporte orgánico, antibiótico y <b>drenaje vesicular urgente</b>; colecistectomía diferida cuando mejore.';
  return {vals:[V('Diagnóstico',dx,dx==='Definitiva'?'bad':'mid'),V('Gravedad','Grado '+['','I','II','III'][g],['','ok','mid','bad'][g])],
   txt:con+' Momento ideal de la cirugía: primeras 72 h (hasta 7 días desde el inicio); pasado ese plazo, enfriar y operar a las 6 semanas.'}},
 ref:'Yokoe M et al. Tokyo Guidelines 2018: diagnostic criteria and severity grading of acute cholecystitis. J Hepatobiliary Pancreat Sci 2018;25:41-54 · Okamoto K et al. TG18 flowchart, ibid. 2018;25:55-72.'},

/* ---------- HCC ---------- */
{id:'hcc',g:'Hepatocarcinoma',t:'BCLC y criterios de trasplante',d:'Ingresar los diámetros de cada nódulo; calcula BCLC 2026, Milán, UCSF, up-to-seven, Metroticket 2.0 simplificado y modelo AFP francés.',
 i:[tx('nod','Diámetros de los nódulos (cm, separados por coma)','3.5, 2'),n('afp','AFP','ng/mL','150'),c('vas','Invasión macrovascular'),c('ext','Diseminación extrahepática'),
    s('ecog','ECOG',[[0,'0'],[1,'1'],[2,'2'],[3,'3–4']]),s('fun','Función hepática',[['p','Preservada (Child A / ALBI 1–2)'],['t','Terminal (Child C no trasplantable)']])],
 f(v){const d=(v.nod||'').split(/[,;\s]+/).map(x=>parseFloat(x.replace(',','.'))).filter(x=>x>0); if(!d.length)return null;
  const N=d.length, mx=Math.max(...d), sum=d.reduce((a,b)=>a+b,0), inv=v.vas||v.ext;
  let bclc;
  if(v.fun==='t'||+v.ecog>=3)bclc='D';else if(inv||+v.ecog>=1)bclc='C';else if(N===1&&mx<=2)bclc='0';else if(N===1||(N<=3&&mx<=3))bclc='A';else bclc='B';
  const trat={'0':'Ablación (o resección).','A':'Resección si no hay HPCS; ablación (≤ 3–4 cm); trasplante si hay HPCS o disfunción.','B':'Trasplante si cumple criterios extendidos o tras downstaging; TACE/TARE; sistémica si carga difusa.','C':'Sistémica: atezolizumab-bevacizumab, durvalumab-tremelimumab o nivolumab-ipilimumab.','D':'Soporte y cuidados paliativos.'}[bclc];
  const mil=!inv&&((N===1&&mx<=5)||(N<=3&&mx<=3));
  const ucsf=!inv&&((N===1&&mx<=6.5)||(N<=3&&mx<=4.5&&sum<=8));
  const u7=!inv&&(mx+N<=7);
  let mt=null; if(v.afp!==null&&!Number.isNaN(v.afp)){const lim=v.afp<200?7:v.afp<=400?5:v.afp<=1000?4:0; mt=!inv&&lim>0&&(mx+N<=lim);}
  let fr=null; if(v.afp!==null&&!Number.isNaN(v.afp)){fr=(mx<=3?0:mx<=6?1:4)+(N<=3?0:2)+(v.afp<=100?0:v.afp<=1000?2:3);}
  const row=(a,b)=>`<tr><td>${a}</td><td class="${b?'si':'no'}">${b?'Dentro':'Fuera'}</td></tr>`;
  return {vals:[V('BCLC',bclc,bclc==='0'||bclc==='A'?'ok':bclc==='B'?'mid':'bad'),V('Nódulos',N,''),V('Mayor + n.º',fmt(mx+N,1),'')],
   txt:`<b>Primera opción BCLC 2026:</b> ${trat}<table><tr><th>Criterio de trasplante</th><th></th></tr>${row('Milán',mil)}${row('UCSF',ucsf)}${row('Up-to-seven',u7)}${mt===null?'':row('Metroticket 2.0 (AFP &lt; 200: ≤ 7 · 200–400: ≤ 5 · 400–1.000: ≤ 4)',mt)}${fr===null?'':`<tr><td>Modelo AFP francés (≤ 2 = bajo riesgo)</td><td class="${fr<=2?'si':'no'}">${fr} pts</td></tr>`}</table>${v.afp>1000?'<b>AFP &gt; 1.000 ng/mL excluye el trasplante</b> salvo descenso sostenido con tratamiento locorregional.':''}`}},
 ref:'Reig M et al. BCLC 2026 (J Hepatol) · Mazzaferro V, NEJM 1996 · Yao FY, Hepatology 2001 · Mazzaferro V, Gastroenterology 2018 (Metroticket 2.0) · Duvoux C, Gastroenterology 2012.'},

{id:'pageb',g:'Hepatocarcinoma',t:'PAGE-B (VHB)',d:'Riesgo de HCC a 5 años en VHB tratado con análogos.',
 i:[n('age','Edad','años','52'),s('sex','Sexo',[['m','Hombre'],['f','Mujer']]),n('plt','Plaquetas','×10³/µL','180')],
 f(v){if(!need(v,['age','plt']))return null; const a=v.age<30?0:v.age<40?2:v.age<50?4:v.age<60?6:v.age<70?8:10;
  const p=a+(v.sex==='m'?6:0)+(v.plt>=200?0:v.plt>=100?6:9);
  return {vals:[V('PAGE-B',p,p<=9?'ok':p<=17?'mid':'bad')],txt:'≤ 9 bajo (~0 % a 5 años; vigilancia puede omitirse en caucásicos) · 10–17 intermedio (~3 %) · ≥ 18 alto (~17 %).'}},
 ref:'Papatheodoridis G et al. J Hepatol 2016;64:800-6.'}
];
