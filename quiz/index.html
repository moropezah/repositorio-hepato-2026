<title>Quiz Hepatología 2026</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F2EF; --surface:#FFFFFF; --surface2:#F9F7F5; --ink:#1E1A1D; --muted:#675F66; --line:#E3DDD8;
  --accent:#173a5e; --accent-ink:#FFFFFF; --accent-soft:#E3ECF5;
  --ba:#8a6414; --ci:#173a5e; --et:#2f6b4f; --ot:#9e2b25;
  --ok:#1D7A4E; --ok-soft:#E3F2EA; --bad:#B0281E; --bad-soft:#FBE7E4; --warn:#9A5B00; --warn-soft:#FBF0DC;
  --shadow:0 1px 2px rgba(40,20,30,.06),0 4px 16px rgba(40,20,30,.05);
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#151214; --surface:#1F1B1E; --surface2:#262126; --ink:#EEE8EB; --muted:#A79CA4; --line:#372F35;
    --accent:#8fbde6; --accent-ink:#0f1720; --accent-soft:#1c2c3d;
    --ba:#d9b25c; --ci:#8fbde6; --et:#6fc296; --ot:#e88a84;
    --ok:#62C792; --ok-soft:#173226; --bad:#F2887D; --bad-soft:#3A1C1A; --warn:#E6B45F; --warn-soft:#352812;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#151214; --surface:#1F1B1E; --surface2:#262126; --ink:#EEE8EB; --muted:#A79CA4; --line:#372F35;
  --accent:#8fbde6; --accent-ink:#0f1720; --accent-soft:#1c2c3d;
  --ba:#d9b25c; --ci:#8fbde6; --et:#6fc296; --ot:#e88a84;
  --ok:#62C792; --ok-soft:#173226; --bad:#F2887D; --bad-soft:#3A1C1A; --warn:#E6B45F; --warn-soft:#352812;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .row{max-width:980px;margin:0 auto;padding:12px 16px 0;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:700;font-size:21px;letter-spacing:-.01em}
.brand small{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400;margin-left:8px;letter-spacing:.04em}
.tabs{max-width:980px;margin:0 auto;padding:8px 16px 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;color:var(--muted);font:600 14px var(--sans);padding:8px 12px 10px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.badge{font-family:var(--mono);font-size:11px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:1px 7px;margin-left:4px;color:var(--muted)}

.filters{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:18px 0 14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 11px;font:500 13px var(--sans);color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.flabel{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:6px}
select{font:500 13px var(--sans);padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.qcard{padding:22px 22px 18px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.chip{font:600 11px var(--mono);letter-spacing:.04em;padding:2px 8px;border-radius:5px;border:1px solid var(--line);color:var(--muted);background:var(--surface2)}
.chip.b-BA{color:var(--ba);border-color:currentColor;background:transparent}
.chip.b-CI{color:var(--ci);border-color:currentColor;background:transparent}
.chip.b-ET{color:var(--et);border-color:currentColor;background:transparent}
.chip.b-OT{color:var(--ot);border-color:currentColor;background:transparent}
.cloudcfg{display:grid;gap:8px;margin-top:6px}.cloudcfg input{font:13px var(--mono);padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%}
.tema-l a{color:var(--accent)}
.chip.lv-S{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.fix{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.chip.new{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.counter{margin-left:auto;font:500 12px var(--mono);color:var(--muted)}
.stem{font-family:var(--serif);font-size:18.5px;line-height:1.5;margin:0 0 16px;max-width:68ch;text-wrap:pretty}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font:15px/1.45 var(--sans);cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .L{flex:0 0 26px;height:26px;border-radius:6px;display:grid;place-items:center;font:600 13px var(--mono);background:var(--surface2);border:1px solid var(--line)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .L{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .L{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
.btn{font:600 14px var(--sans);padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:none}
.spacer{flex:1}

.explain{margin-top:18px;border-top:1px solid var(--line);padding-top:16px;display:grid;gap:14px}
.verdict{font:700 15px var(--sans)}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.blk h4{margin:0 0 6px;font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.blk p,.blk li{margin:0;max-width:72ch}
.blk ul{margin:0;padding-left:0;list-style:none;display:grid;gap:6px}
.blk li b.L{font-family:var(--mono);margin-right:6px}
.mech{background:var(--surface2);border-left:3px solid var(--ci);padding:12px 14px;border-radius:0 8px 8px 0}
.pearl{background:var(--accent-soft);padding:12px 14px;border-radius:8px}
.fixbox{background:var(--warn-soft);padding:10px 14px;border-radius:8px;color:var(--ink)}
.newbox{background:var(--ok-soft);padding:10px 14px;border-radius:8px}
.refs{font-size:13px;color:var(--muted)}

.palette{display:flex;flex-wrap:wrap;gap:4px;margin-top:16px}
.palette button{width:30px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font:500 11px var(--mono);color:var(--muted);cursor:pointer}
.palette button.cur{border-color:var(--accent);color:var(--ink);font-weight:700}
.palette button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.palette button.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.palette button.ans{background:var(--accent-soft)}

.setup{padding:22px;display:grid;gap:16px}
.setup h2,.panel h2{font-family:var(--serif);font-size:22px;margin:0;text-wrap:balance}
.setup p{margin:0;color:var(--muted);max-width:68ch}
.timer{font:600 14px var(--mono);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.progressbar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:0 0 14px}
.progressbar i{display:block;height:100%;background:var(--accent);transition:width .3s}

.score{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end;padding:22px}
.score .big{font:700 52px/1 var(--serif);font-variant-numeric:tabular-nums}
.score .sub{color:var(--muted)}
.bars{display:grid;gap:8px;padding:0 22px 22px}
.bar{display:grid;grid-template-columns:minmax(120px,190px) 1fr 56px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:8px;background:var(--surface2);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.bar .track i{display:block;height:100%}
.bar .v{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.review{display:grid;gap:10px;margin-top:16px}
details.rv{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
details.rv summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;list-style:none}
details.rv summary::-webkit-details-marker{display:none}
.mark{font:700 13px var(--mono);flex:0 0 auto}
.mark.ok{color:var(--ok)} .mark.bad{color:var(--bad)} .mark.na{color:var(--muted)}
.rvq{font-size:14px}

.flash{perspective:1400px;margin-top:6px}
.fc{position:relative;min-height:300px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s}
.fc.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;padding:24px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.fc .back{transform:rotateY(180deg)}
.fc .face .hint{margin-top:auto;font-size:12px;color:var(--muted)}
.fc .ans{font-family:var(--serif);font-size:19px;font-weight:600}
@media (prefers-reduced-motion:reduce){.fc{transition:none}.progressbar i{transition:none}}

.panel{padding:22px;display:grid;gap:14px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
td.id{font-family:var(--mono);white-space:nowrap}
.gloss{columns:2 260px;column-gap:28px;font-size:14px}
.gloss div{break-inside:avoid;padding:3px 0}
.gloss b{font-family:var(--mono);font-size:13px}
.muted{color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}

#printArea{display:none}
textarea.dump{width:100%;min-height:180px;font:12px var(--mono);background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}
.expgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.expgrid .card{padding:16px;display:grid;gap:8px;align-content:start}
.expgrid h3{margin:0;font:600 15px var(--sans)}
.expgrid p{margin:0;font-size:13px;color:var(--muted)}
@media print{
  body.printing header.top, body.printing main{display:none!important}
  body.printing #printArea{display:block!important;color:#000;background:#fff;font:11pt/1.4 Georgia,serif}
  #printArea .pq{break-inside:avoid;border-bottom:1px solid #999;padding:8pt 0}
  #printArea .pq h4{font:600 9pt Arial,sans-serif;margin:0 0 4pt;color:#444}
  #printArea .pq p{margin:3pt 0}
  #printArea .pb{break-before:page}
}
.sync{font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:10px;white-space:nowrap}
.sync.ok{color:var(--ok)}.sync.err{color:var(--warn)}
@media (max-width:560px){.brand small{display:none}.top .row{padding-top:8px}#themeBtn{padding:6px 10px;font-size:13px}.qcard{padding:16px}.stem{font-size:17px}.bar{grid-template-columns:110px 1fr 48px}.score .big{font-size:42px}}
</style>

<header class="top">
  <div class="row">
    <div class="brand">Quiz Hepatología <small>2026 · 164 casos · 16 bloques</small></div>
    <span class="spacer"></span>
    <span id="syncState" class="sync" title="Estado de guardado">● local</span>
    <button class="btn ghost" id="themeBtn" type="button" aria-label="Cambiar tema">◐ Tema</button>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="study" aria-selected="true">Estudio <span class="badge" id="nStudy"></span></button>
    <button role="tab" data-tab="exam" aria-selected="false">Examen <span class="badge" id="nExam"></span></button>
    <button role="tab" data-tab="flash" aria-selected="false">Flashcards</button>
    <button role="tab" data-tab="stats" aria-selected="false">Progreso</button>
    <button role="tab" data-tab="changes" aria-selected="false">Temario</button>
    <button role="tab" data-tab="gloss" aria-selected="false">Siglas</button>
    <button role="tab" data-tab="export" aria-selected="false">Exportar</button>
  </nav>
</header>

<main class="wrap">
  <section id="tab-study"></section>
  <section id="tab-exam" hidden></section>
  <section id="tab-flash" hidden></section>
  <section id="tab-stats" hidden></section>
  <section id="tab-changes" hidden></section>
  <section id="tab-gloss" hidden></section>
  <section id="tab-export" hidden></section>
</main>

<script>
// Bloques 1–4 · Perfil hepático y FHA · Cirrosis y HPCS · Hipertensión portal · Ascitis, PBE y HRS-AKI
const Q1 = [
/* ===================== Bloque 1 · Perfil hepático, hepatitis aguda y FHA ===================== */
{id:"PH01",b:"BA",t:"Perfil hepático y FHA",n:"R",md:"E",
q:"Hombre de 46 años, asintomático, con ALT 64 U/L, AST 41 U/L, FA y bilirrubina normales en un control laboral. IMC 31, triglicéridos 240 mg/dL. Consumo de alcohol 3 tragos los fines de semana. ¿Cuál es el siguiente paso más costo-efectivo?",
o:["Repetir el perfil en 6 meses sin más estudio","HBsAg, anti-VHC, ecografía abdominal y FIB-4 en el mismo momento","Biopsia hepática para descartar esteatohepatitis","Panel autoinmune completo, ceruloplasmina y α1-antitripsina como primer escalón"],
c:1,
e:"Elevación leve y crónica (&lt; 5 × LSN) de patrón hepatocelular: el estudio inicial cubre las causas frecuentes (VHB, VHC, MASLD, alcohol, fármacos) y estratifica fibrosis. La ecografía documenta esteatosis y signos de hipertensión portal; el <b>FIB-4</b> decide si hace falta elastografía.",
w:{0:"Esperar sin estudiar pierde la oportunidad de pesquisar VHB/VHC y fibrosis avanzada.",2:"La biopsia no es el primer paso; se reserva para discordancias o diagnóstico incierto.",3:"Las causas raras se estudian en un segundo escalón si el primero es negativo o el contexto lo sugiere."},
p:"El LSN fisiológico de ALT es menor que el del laboratorio: ~33 U/L en hombres y ~25 U/L en mujeres (ACG); EASL VHB 2025 usa 30 y 19 U/L.",
r:"ACG Clinical Guideline: evaluation of abnormal liver chemistries (Kwo, 2017) · EASL-EASD-EASO MASLD 2024"},

{id:"PH02",b:"BA",t:"Perfil hepático y FHA",n:"R",md:"E",
q:"Mujer de 62 años con FA 410 U/L (LSN 120), GGT 380 U/L, ALT 48 U/L y bilirrubina normal. Ecografía: vía biliar no dilatada. ¿Qué examen tiene mayor rendimiento como siguiente paso?",
o:["Colangiorresonancia","Anticuerpos antimitocondriales (AMA)","Biopsia hepática","CPRE diagnóstica"],
c:1,
e:"Colestasis anictérica de origen hepático (GGT elevada) con vía biliar no dilatada en mujer de mediana edad: la causa más probable es <b>colangitis biliar primaria</b>. AMA &gt; 1:40 con FA ≥ 1,5 × LSN establece el diagnóstico sin biopsia.",
w:{0:"La colangiorresonancia se pide si los AMA son negativos (buscar CEP) o hay sospecha de obstrucción.",2:"La biopsia queda para AMA negativos o sospecha de síndrome de sobreposición.",3:"La CPRE es terapéutica; no se usa como prueba diagnóstica con vía biliar no dilatada."},
p:"Si AMA es negativo, pedir ANA específicos de CBP: anti-sp100 y anti-gp210 (este último de peor pronóstico).",
r:"EASL CBP 2017 · AASLD PBC 2018 (actualización 2021)"},

{id:"PH03",b:"BA",t:"Perfil hepático y FHA",n:"R",md:"X",
q:"Hombre de 70 años, 48 h después de un shock séptico, presenta ALT 3.800 U/L, AST 4.500 U/L, LDH 2.900 U/L e INR 1,9. Bilirrubina 1,8 mg/dL. ¿Diagnóstico más probable y conducta?",
o:["Hepatitis viral aguda; solicitar serologías y aislar","Hepatitis isquémica; optimizar la perfusión y esperar caída rápida de transaminasas","Hepatitis autoinmune aguda; iniciar corticoides","Intoxicación por paracetamol; NAC solo si hay niveles"],
c:1,
e:"Transaminasas &gt; 1.000 U/L con <b>LDH muy alta</b> (razón ALT/LDH &lt; 1,5) tras hipotensión sugieren <b>hepatitis isquémica</b>. Las transaminasas caen ~50 % en 72 h al restablecer la perfusión.",
w:{0:"La hepatitis viral tiene LDH menos elevada y un curso más lento.",2:"No hay datos de autoinmunidad y el contexto hemodinámico explica el cuadro.",3:"Ante duda de paracetamol se da NAC sin esperar niveles, pero aquí el contexto apunta a isquemia."},
p:"La hepatitis isquémica suele ocurrir en corazón congestivo previo: busque insuficiencia cardíaca derecha.",
r:"ACG abnormal liver chemistries 2017"},

{id:"PH04",b:"BA",t:"Perfil hepático y FHA",n:"R",md:"E",
q:"Mujer de 24 años ingresa 10 horas después de ingerir 18 g de paracetamol. Está asintomática; ALT 45 U/L, INR 1,1. ¿Cuál es la conducta correcta?",
o:["Esperar el nivel a las 4 h para decidir con el nomograma","Iniciar N-acetilcisteína EV de inmediato","Carbón activado y alta si el nivel está bajo la línea de tratamiento","Lavado gástrico y observación"],
c:1,
e:"Con más de 8 h desde una ingesta potencialmente tóxica (&gt; 150 mg/kg o &gt; 10–12 g), la NAC se inicia <b>sin esperar el nivel</b>: su eficacia es máxima dentro de 8 h y cae después. El nivel se mide igual para el nomograma de Rumack-Matthew.",
w:{0:"A 10 h ya no se espera; retrasar la NAC aumenta el daño hepático.",2:"El carbón activado es útil dentro de 1–2 h de la ingesta.",3:"El lavado gástrico no tiene rol a las 10 h."},
p:"Régimen SNAP (12 h): 100 mg/kg en 2 h y 200 mg/kg en 10 h; menos reacciones anafilactoides que el clásico de 21 h.",
r:"ACG FHA 2023 · Bateman DN, Lancet 2014 (SNAP)"},

{id:"PH05",b:"BA",t:"Perfil hepático y FHA",n:"F",md:"X",
q:"Hombre de 52 años con FHA por amoxicilina-clavulánico. Encefalopatía grado II, INR 3,8, bilirrubina 19 mg/dL, creatinina 1,1 mg/dL. Ictericia de 12 días antes de la encefalopatía. ¿Cumple criterios de King's College?",
o:["No: requiere INR &gt; 6,5","Sí: cumple al menos 3 de 5 criterios menores","No: los criterios menores solo aplican a paracetamol","Sí, pero solo si el pH es &lt; 7,30"],
c:1,
e:"No-paracetamol: INR &gt; 6,5 <b>o</b> 3 de 5 criterios menores. Cumple: edad &gt; 40, etiología desfavorable (idiosincrática), ictericia → encefalopatía &gt; 7 días, INR &gt; 3,5 y bilirrubina &gt; 17,5 mg/dL: 5 de 5. Corresponde listarlo en urgencia.",
w:{0:"INR &gt; 6,5 es un criterio alternativo, no obligatorio.",2:"Los criterios menores son justamente los del grupo no-paracetamol.",3:"El pH &lt; 7,30 es criterio del grupo paracetamol."},
p:"La DILI idiosincrática con FHA tiene sobrevida espontánea &lt; 30 %: derive precozmente.",
r:"O'Grady JG, Gastroenterology 1989 · ACG FHA 2023"},

{id:"PH06",b:"BA",t:"Perfil hepático y FHA",n:"F",md:"E",
q:"Paciente con FHA no paracetamol, encefalopatía grado I, INR 2,4. ¿Qué intervención mostró aumentar la sobrevida libre de trasplante en este grupo?",
o:["Corticoides en dosis altas","N-acetilcisteína EV por 72 h","Plasma fresco congelado para mantener INR &lt; 1,5","Lactulosa en dosis altas"],
c:1,
e:"Lee 2009: en FHA no paracetamol con encefalopatía grado I–II, la NAC EV (72 h) aumentó la sobrevida sin trasplante (52 % vs 30 %). Sin beneficio en grados III–IV.",
w:{0:"Los corticoides se reservan para HAI aguda grave o DILI con rasgos autoinmunes.",2:"Corregir el INR enmascara el pronóstico y no se recomienda salvo sangrado o procedimiento.",3:"La lactulosa no mejora el desenlace en FHA y puede distender el intestino antes del trasplante."},
p:"NAC no paracetamol: 150 mg/kg/h × 1 h, 12,5 mg/kg/h × 4 h, 6,25 mg/kg/h × 67 h.",
r:"Lee WM, Gastroenterology 2009 · ACG FHA 2023"},

{id:"PH07",b:"BA",t:"Perfil hepático y FHA",n:"R",md:"X",
q:"Mujer de 33 años con ictericia, ALT 1.450 U/L, IgM anti-VHA negativo, HBsAg negativo, anti-HBc IgM positivo. ¿Interpretación?",
o:["Infección resuelta por VHB","Hepatitis B aguda en período de ventana","Falso positivo: si HBsAg es negativo no hay VHB","Vacunación previa"],
c:1,
e:"HBsAg negativo con <b>anti-HBc IgM positivo</b> corresponde al período de ventana de la hepatitis B aguda (HBsAg ya negativizado, anti-HBs aún no detectable).",
w:{0:"La infección resuelta tiene anti-HBc IgG y anti-HBs positivos, no IgM.",2:"El anti-HBc IgM positivo en este contexto es diagnóstico.",3:"La vacuna genera solo anti-HBs."},
p:"Antiviral en VHB aguda solo si es grave (INR ≥ 1,5 o bilirrubina &gt; 10 mg/dL por &gt; 4 semanas), FHA o inmunosupresión.",
r:"EASL VHB 2025"},

{id:"PH08",b:"BA",t:"Perfil hepático y FHA",n:"R",md:"E",
q:"Hombre de 58 años, receptor de trasplante renal, con ALT 280 U/L persistente por 4 meses. Serologías A, B y C negativas. Consume carne de cerdo poco cocida. ¿Qué examen pedir?",
o:["Anti-VHE IgG aislado","RNA del VHE por PCR","Biopsia hepática como primer paso","IgG4 sérica"],
c:1,
e:"En inmunosuprimidos el <b>VHE genotipo 3</b> puede cronificar y la serología es poco sensible: el diagnóstico es por <b>PCR de RNA-VHE</b> en sangre o heces.",
w:{0:"La serología puede ser negativa en inmunosuprimidos.",2:"La biopsia no es el primer paso; el diagnóstico es virológico.",3:"No hay datos de enfermedad por IgG4."},
p:"Tratamiento de VHE crónica: reducir la inmunosupresión; si persiste, ribavirina 3 meses.",
r:"EASL VHE 2018"},

{id:"PH09",b:"BA",t:"Perfil hepático y FHA",n:"S",md:"X",
q:"FHA por Wilson en mujer de 17 años: bilirrubina 28 mg/dL, FA 40 U/L, AST 210, ALT 85 U/L, hemólisis Coombs negativa. ¿Qué combinación de índices bioquímicos sugiere este diagnóstico?",
o:["FA/bilirrubina &lt; 4 y AST/ALT &gt; 2,2","FA/bilirrubina &gt; 10 y AST/ALT &lt; 1","Ceruloplasmina alta y cobre urinario bajo","Ferritina &gt; 10.000 y triglicéridos altos"],
c:0,
e:"En la presentación fulminante del Wilson la FA es desproporcionadamente baja y predomina la AST: <b>FA/bilirrubina total &lt; 4 + AST/ALT &gt; 2,2</b> tiene alta sensibilidad y especificidad (Korman 2008).",
w:{1:"Es el patrón opuesto.",2:"La ceruloplasmina suele estar baja (aunque en FHA puede ser normal) y el cobre urinario alto.",3:"Sugiere linfohistiocitosis hemofagocítica."},
p:"El Wilson fulminante tiene mortalidad cercana al 100 % sin trasplante: puntaje de Dhawan (Nazer modificado) ≥ 11.",
r:"Korman JD, Hepatology 2008 · EASL-ERN Wilson 2025"},

{id:"PH10",b:"BA",t:"Perfil hepático y FHA",n:"F",md:"E",
q:"Paciente con FHA y encefalopatía grado III intubado en UPC. Amonio arterial 210 µmol/L. ¿Cuál medida está indicada para reducir el riesgo de hipertensión endocraneana?",
o:["Lactulosa por sonda","Hiponatremia permisiva (Na 128–132)","Terapia de reemplazo renal continua precoz y sodio 140–145 mmol/L","Corticoides EV"],
c:2,
e:"Amonio &gt; 150–200 µmol/L se asocia a edema cerebral. La <b>hemofiltración continua precoz</b> reduce el amonio, y la hipernatremia leve inducida (Na 140–145) es neuroprotectora.",
w:{0:"La lactulosa no tiene beneficio demostrado en FHA y distiende el intestino.",1:"La hiponatremia empeora el edema cerebral.",3:"Los corticoides no tratan el edema cerebral de la FHA."},
p:"Meta de presión media ≥ 75 mmHg; si hay hipertensión endocraneana: suero hipertónico o manitol, hipotermia leve como puente.",
r:"ACG FHA 2023 · EASL FHA 2017"},

/* ===================== Bloque 2 · Cirrosis, cACLD y HPCS ===================== */
{id:"CI01",b:"CI",t:"Cirrosis y HPCS",n:"R",md:"E",
q:"Hombre de 61 años con VHC curado hace 2 años. Hoy: rigidez hepática 11 kPa, plaquetas 172.000. Antes del tratamiento tenía 21 kPa. ¿Qué conducta corresponde?",
o:["Alta de hepatología: la RVS cura la enfermedad hepática","Mantener vigilancia de HCC cada 6 meses","Endoscopía anual por HPCS","Biopsia para confirmar regresión antes de suspender la vigilancia"],
c:1,
e:"Quien tuvo cACLD antes de la RVS mantiene riesgo de HCC: la <b>vigilancia semestral continúa</b>. La caída de rigidez refleja en parte menos inflamación. Con &lt; 12 kPa y plaquetas &gt; 150.000 se puede descartar HPCS y no requiere endoscopía.",
w:{0:"La RVS no elimina el riesgo de HCC en cACLD.",2:"No tiene HPCS (rigidez &lt; 12 kPa y plaquetas &gt; 150.000).",3:"La biopsia no cambia la conducta."},
p:"Baveno VII/VIII: tras eliminar la causa, rigidez &lt; 12 kPa + plaquetas &gt; 150.000 descarta HPCS.",
r:"Baveno VII · Baveno VIII 2026"},

{id:"CI02",b:"CI",t:"Cirrosis y HPCS",n:"R",md:"X",
q:"Mujer de 55 años con MASLD, IMC 27, rigidez hepática 27 kPa, plaquetas 135.000. Sin descompensaciones. Presión 128/78 mmHg. ¿Conducta?",
o:["Endoscopía de tamizaje y BBNS solo si hay várices grandes","Carvedilol 6,25 mg/día y titular a 6,25 mg c/12 h, sin endoscopía de tamizaje","Medir GPVH antes de cualquier decisión","Propranolol titulado a frecuencia cardíaca 55 lpm y ligadura profiláctica"],
c:1,
e:"Rigidez ≥ 25 kPa en MASLD con IMC &lt; 30 <b>confirma HPCS</b>. El BBNS (preferentemente <b>carvedilol</b>) previene la descompensación (PREDESCI); quien inicia BBNS no necesita endoscopía de tamizaje.",
w:{0:"El objetivo ya no es solo evitar el primer sangrado sino toda descompensación.",2:"El GPVH no es necesario cuando las pruebas no invasivas confirman HPCS.",3:"No corresponde combinar BBNS con ligadura en profilaxis primaria."},
p:"Carvedilol: máximo 12,5 mg/día salvo hipertensión arterial; no se titula por frecuencia cardíaca.",
r:"Baveno VIII 2026 · Villanueva C, Lancet 2019 (PREDESCI)"},

{id:"CI03",b:"CI",t:"Cirrosis y HPCS",n:"F",md:"E",
q:"Hombre de 50 años con cirrosis por alcohol en abstinencia, IMC 34 (MASLD concomitante), rigidez 26 kPa, plaquetas 160.000. ¿Puede confirmarse HPCS con la rigidez hepática?",
o:["Sí: 26 kPa supera el corte de 25 kPa en cualquier etiología","No con certeza: con obesidad el corte de 25 kPa pierde VPP; usar ANTICIPATE-NASH o rigidez esplénica","Sí, porque las plaquetas son normales","No: se requiere siempre GPVH en alcohol"],
c:1,
e:"El corte de 25 kPa se validó en etiología viral, alcohólica y MASLD <b>sin obesidad</b>. Con IMC ≥ 30 su VPP cae: calcular <b>ANTICIPATE-NASH</b> (incluye IMC) o medir rigidez esplénica (&gt; 55 kPa confirma por Baveno VIII).",
w:{0:"Desconoce la limitación en obesidad.",2:"Plaquetas normales no confirman HPCS.",3:"El GPVH se reserva para cuando la decisión no puede tomarse de forma no invasiva."},
p:"Baveno VIII: confirmar HPCS con modelo ≥ 75 %, rigidez ≥ 25 kPa (no obesos) o esplénica &gt; 55 kPa.",
r:"Baveno VIII 2026 · Pons M, Am J Gastroenterol 2021"},

{id:"CI04",b:"CI",t:"Cirrosis y HPCS",n:"R",md:"E",
q:"¿Cuál define la <b>recompensación</b> según Baveno VIII?",
o:["Child A en un control aislado","Control de la causa, sin ascitis, encefalopatía ni hemorragia sin fármacos, con Child A sostenido más de 6 meses","MELD &lt; 15 durante 3 meses","Desaparición de las várices en la endoscopía"],
c:1,
e:"Recompensación: eliminación o control de la causa + resolución de ascitis (sin diuréticos), encefalopatía (sin lactulosa ni rifaximina) y ausencia de hemorragia variceal + mejoría de la función hepática; Baveno VIII exige que se sostenga &gt; 6 meses y Child A.",
w:{0:"Un control aislado no basta.",2:"El MELD no forma parte de la definición.",3:"La erradicación de várices no define recompensación."},
p:"El recompensado mantiene vigilancia de HCC y control de HPCS.",
r:"Baveno VII · Baveno VIII 2026"},

{id:"CI05",b:"CI",t:"Cirrosis y HPCS",n:"R",md:"X",
q:"Cirrosis compensada, rigidez 13 kPa, plaquetas 155.000. ¿Qué significa?",
o:["HPCS confirmada","HPCS descartada; repetir elastografía anual","Zona gris; endoscopía obligatoria","Descarta cACLD"],
c:1,
e:"Rigidez ≤ 15 kPa <b>y</b> plaquetas ≥ 150.000 descarta HPCS (VPN &gt; 90 %). Sugiere cACLD (10–15 kPa). Seguimiento anual.",
w:{0:"No cumple ningún criterio de confirmación.",2:"Cumple el criterio de descarte, no está en zona gris.",3:"&gt; 10 kPa sugiere cACLD."},
p:"Criterios para evitar endoscopía: rigidez &lt; 20 kPa y plaquetas &gt; 150.000.",
r:"Baveno VII/VIII"},

{id:"CI06",b:"CI",t:"Cirrosis y HPCS",n:"F",md:"X",
q:"Paciente con cirrosis por VHB suprimido con entecavir, rigidez 19 kPa, plaquetas 118.000, rigidez esplénica 38 kPa. ¿Cómo se clasifica la HPCS?",
o:["Confirmada por rigidez hepática","Descartada","Zona gris: ni descarta ni confirma","Confirmada por rigidez esplénica"],
c:2,
e:"Rigidez entre 15 y 25 kPa con plaquetas &lt; 150.000: no descarta ni confirma. La rigidez esplénica de 38 kPa no alcanza el corte de confirmación (&gt; 55 kPa en Baveno VIII). Zona gris: reevaluar a los 12 meses, considerar ANTICIPATE o GPVH si cambia la conducta.",
w:{0:"No alcanza 25 kPa.",1:"Las plaquetas &lt; 150.000 y la rigidez &gt; 15 kPa impiden descartar.",3:"Requiere &gt; 55 kPa (o &gt; 50 kPa en Baveno VII)."},
p:"Rigidez esplénica ≤ 40 kPa descarta várices de alto riesgo.",
r:"Baveno VIII 2026 · Dajti E, Lancet Gastroenterol Hepatol 2023"},

{id:"CI07",b:"CI",t:"Cirrosis y HPCS",n:"R",md:"E",
q:"¿Qué valor de GPVH define hipertensión portal clínicamente significativa?",
o:["≥ 5 mmHg","≥ 10 mmHg","≥ 12 mmHg","≥ 20 mmHg"],
c:1,
e:"GPVH normal 1–5 mmHg; &gt; 5 hipertensión portal; <b>≥ 10 mmHg HPCS</b> (várices, descompensación, HCC); ≥ 12 riesgo de sangrado; ≥ 16 mortalidad; ≥ 20 falla del control en hemorragia aguda.",
w:{0:"Define hipertensión portal, no HPCS.",2:"Es el umbral de sangrado variceal.",3:"Predice falla del tratamiento en hemorragia aguda."},
p:"El GPVH mide presión sinusoidal: subestima la hipertensión presinusoidal (vascular porto-sinusoidal, trombosis portal).",
r:"Baveno VII"},

{id:"CI08",b:"CI",t:"Cirrosis y HPCS",n:"R",md:"X",
q:"Paciente con cirrosis compensada en carvedilol 6,25 mg c/12 h ingresa con neumonía y presión 84/48 mmHg. ¿Qué hacer con el carvedilol?",
o:["Mantenerlo para evitar hemorragia","Suspenderlo transitoriamente y reintroducirlo al estabilizarse","Cambiar a propranolol","Duplicar la dosis"],
c:1,
e:"BBNS se suspenden transitoriamente con <b>PAS &lt; 90 mmHg</b>, sepsis, hemorragia aguda, lesión renal aguda o hiponatremia &lt; 130; se reintroducen al resolver el evento.",
w:{0:"Mantenerlo en hipotensión empeora la perfusión renal.",2:"Propranolol también es BBNS; el problema es la hipotensión.",3:"Contraindicado."},
p:"La ventana terapéutica del BBNS se estrecha en la ascitis refractaria: vigilar PAS y función renal.",
r:"Baveno VII/VIII · EASL 2018"},

{id:"CI09",b:"CI",t:"Cirrosis y HPCS",n:"F",md:"E",
q:"En el ensayo PREDESCI, el BBNS en pacientes con HPCS compensada redujo principalmente…",
o:["La hemorragia variceal","La aparición de ascitis","La mortalidad global","El HCC"],
c:1,
e:"PREDESCI (Lancet 2019): BBNS redujo el desenlace compuesto de descompensación o muerte (16 % vs 27 %), a expensas sobre todo de <b>menos ascitis</b>.",
w:{0:"Hubo pocos sangrados en ambos grupos; el beneficio principal fue en ascitis.",2:"No tuvo poder para mortalidad.",3:"No evaluó HCC."},
p:"Por eso el objetivo del BBNS en HPCS es prevenir la descompensación, no solo el sangrado.",
r:"Villanueva C, Lancet 2019"},

{id:"CI10",b:"CI",t:"Cirrosis y HPCS",n:"S",md:"X",
q:"Hombre de 38 años con trombocitopenia, esplenomegalia y várices esofágicas. Rigidez hepática 6 kPa, rigidez esplénica 82 kPa. Portografía: vena porta permeable. ¿Diagnóstico más probable?",
o:["Cirrosis compensada con HPCS","Enfermedad vascular porto-sinusoidal","MASLD sin fibrosis","Error técnico de la elastografía"],
c:1,
e:"Hipertensión portal con <b>rigidez hepática normal</b> y esplénica muy alta, sin trombosis, sugiere <b>enfermedad vascular porto-sinusoidal</b> (presinusoidal). Se confirma con biopsia (venopatía obliterativa, hiperplasia nodular regenerativa).",
w:{0:"La rigidez hepática &lt; 10 kPa hace improbable la cirrosis.",2:"MASLD sin fibrosis no explica la hipertensión portal.",3:"La disociación hígado-bazo es característica, no un error."},
p:"El GPVH puede ser normal o poco elevado en la EVPS: mide presión sinusoidal.",
r:"De Gottardi A, Lancet Gastroenterol Hepatol 2019 · Baveno VII"},

/* ===================== Bloque 3 · Hipertensión portal y hemorragia variceal ===================== */

{id:"CI11",b:"CI",t:"Cirrosis y HPCS",n:"R",md:"X",
q:"Hombre de 63 años con cirrosis por alcohol, abstinente hace 2 años, con bloqueo AV de segundo grado que contraindica los BBNS. Rigidez hepática 21 kPa, plaquetas 142.000/mm³, rigidez esplénica 36 kPa. Nunca se ha hecho endoscopía. ¿Qué indica Baveno VIII?",
o:["Endoscopía de tamizaje: no cumple rigidez &lt; 20 kPa con plaquetas ≥ 150.000","Evitar la endoscopía: la rigidez esplénica &lt; 40 kPa basta","Ligadura empírica de várices sin endoscopía previa","Medir GPVH antes de decidir"],
c:1,
e:"En la cACLD que no puede recibir BBNS, Baveno VIII (1.19) permite evitar la endoscopía con rigidez &lt; 20 kPa y plaquetas ≥ 150.000 <b>o</b> con <b>rigidez esplénica &lt; 40 kPa</b>. Este paciente cumple el segundo criterio. Los tests se repiten a los 12 meses.",
w:{0:"Olvida el criterio nuevo de rigidez esplénica, que es alternativo y no acumulativo.",2:"No se liga sin documentar várices grandes.",3:"El GPVH no cambia la conducta: el BBNS está contraindicado de todos modos."},
p:"Si se hace una endoscopía y no hay várices, se repite a los 3 años si la causa está suprimida, como aquí, o a los 2 años si sigue activa (1.20).",
r:"Baveno VIII (J Hepatol 2026;85:993-1018), enunciados 1.19–1.20"},
{id:"HP01",b:"CI",t:"Hipertensión portal y HDA",n:"R",md:"E",
q:"Hombre de 57 años con cirrosis alcohólica ingresa con hematemesis. PA 96/60, FC 112, Hb 6,8 g/dL. ¿Cuál es la primera indicación farmacológica junto con la reanimación?",
o:["Omeprazol en bolo e infusión como tratamiento principal","Terlipresina 2 mg EV c/4 h (u octreótido) y ceftriaxona 1 g/día","Plasma fresco para corregir el INR antes de la endoscopía","Ácido tranexámico 1 g EV"],
c:1,
e:"Ante sospecha de hemorragia variceal: <b>vasoactivo</b> desde la sospecha (antes de la endoscopía) y <b>profilaxis antibiótica</b> con ceftriaxona. Transfusión restrictiva (Hb &lt; 7, meta 7–8).",
w:{0:"El IBP no trata la hemorragia variceal; se suspende tras confirmar la causa.",2:"El plasma aumenta la volemia y la presión portal sin corregir la hemostasia real.",3:"HALT-IT: el tranexámico no reduce la mortalidad y aumenta la trombosis."},
p:"Endoscopía dentro de 12 h tras la estabilización.",
r:"Baveno VII/VIII · Villanueva, NEJM 2013 · HALT-IT, Lancet 2020"},

{id:"HP02",b:"CI",t:"Hipertensión portal y HDA",n:"R",md:"X",
q:"Paciente del caso anterior: Child-Pugh C 11, ligadura exitosa de várices esofágicas. ¿Qué intervención reduce la mortalidad?",
o:["Mantener terlipresina por 14 días","TIPS preventivo dentro de 72 h (ideal &lt; 24 h)","Repetir ligadura a las 48 h","Iniciar propranolol de inmediato y alta precoz"],
c:1,
e:"En <b>Child C 10–13</b> (o B 8–9 con sangrado activo), el <b>TIPS preventivo</b> con prótesis cubierta reduce resangrado y mortalidad (García-Pagán, NEJM 2010).",
w:{0:"El vasoactivo se mantiene 2–5 días.",2:"La ligadura de control es a las 2–4 semanas.",3:"El BBNS se inicia al suspender el vasoactivo, pero no sustituye al TIPS en alto riesgo."},
p:"Baveno VIII: el beneficio persiste hasta ~1 semana en Child B y ~2 semanas en Child C.",
r:"García-Pagán JC, NEJM 2010 · Baveno VIII 2026"},

{id:"HP03",b:"CI",t:"Hipertensión portal y HDA",n:"F",md:"E",
q:"Hemorragia variceal que persiste pese a terlipresina y dos intentos de ligadura. Hemodinámicamente inestable. ¿Mejor puente al TIPS de rescate?",
o:["Balón de Sengstaken-Blakemore por 72 h","Prótesis esofágica metálica autoexpandible","Tercera ligadura","Cirugía de derivación portosistémica"],
c:1,
e:"Como puente, la <b>prótesis esofágica autoexpandible</b> controla el sangrado con menos complicaciones que el balón y puede mantenerse hasta 7 días.",
w:{0:"El balón tiene alta tasa de complicaciones y no debe pasar de 24 h.",2:"Tras dos fallas no se recomienda un tercer intento.",3:"La cirugía quedó desplazada por el TIPS."},
p:"Definición de falla: hematemesis fresca o ≥ 100 mL de sangre por sonda ≥ 2 h tras iniciar el tratamiento, shock o caída de Hb ≥ 3 g/dL sin transfusión.",
r:"Escorsell A, Hepatology 2016 · Baveno VII"},

{id:"HP04",b:"CI",t:"Hipertensión portal y HDA",n:"R",md:"X",
q:"Tras una primera hemorragia variceal controlada, ¿cuál es la prevención secundaria estándar?",
o:["Ligadura sola","BBNS solo","BBNS + ligadura seriada hasta erradicación","Escleroterapia"],
c:2,
e:"Profilaxis secundaria: <b>BBNS (propranolol o carvedilol) + ligadura</b> cada 2–4 semanas hasta erradicar, y luego control endoscópico.",
w:{0:"La ligadura sola tiene más resangrado y no previene otras descompensaciones.",1:"El BBNS solo es inferior a la combinación.",3:"La escleroterapia tiene más complicaciones."},
p:"Si hay ascitis refractaria con PAS &lt; 90, Na &lt; 130 o LRA, reducir o suspender el BBNS.",
r:"Baveno VII/VIII"},

{id:"HP05",b:"CI",t:"Hipertensión portal y HDA",n:"F",md:"E",
q:"Mujer con cirrosis y sangrado de várices gástricas IGV1 (fúndicas aisladas). ¿Tratamiento endoscópico de elección?",
o:["Ligadura con bandas","Inyección de cianoacrilato (o coils + cianoacrilato guiado por EUS)","Escleroterapia con etanolamina","Argón plasma"],
c:1,
e:"Las várices fúndicas (GOV2, IGV1) se tratan con <b>cianoacrilato</b>; la técnica guiada por EUS con coils reduce la embolía y la recurrencia. TIPS o BRTO según anatomía.",
w:{0:"La ligadura en várices fúndicas tiene alto resangrado.",2:"La escleroterapia es ineficaz en várices gástricas.",3:"El argón no trata várices."},
p:"Metaanálisis EUS vs endoscópico: obliteración 84 % vs 63 %, recurrencia 9 % vs 18 %.",
r:"Baveno VII · Laleman W, J Hepatol 2024"},

{id:"HP06",b:"CI",t:"Hipertensión portal y HDA",n:"R",md:"E",
q:"En la hemorragia variceal, ¿qué meta de hemoglobina se recomienda?",
o:["Hb ≥ 10 g/dL","Transfundir con Hb &lt; 7 g/dL y mantener 7–8 g/dL","No transfundir hasta Hb &lt; 5 g/dL","Hb ≥ 9 en todos"],
c:1,
e:"La estrategia restrictiva (umbral 7, meta 7–8 g/dL) redujo mortalidad y resangrado; la sobretransfusión aumenta la presión portal.",
w:{0:"Aumenta la presión portal y el resangrado.",2:"Demasiado restrictivo.",3:"Solo se considera más alta en cardiopatía isquémica o sangrado masivo."},
p:"Villanueva NEJM 2013: sobrevida a 6 semanas 95 % vs 91 %.",
r:"Villanueva C, NEJM 2013"},

{id:"HP07",b:"CI",t:"Hipertensión portal y HDA",n:"F",md:"X",
q:"Hombre de 49 años con cirrosis Child A y trombosis portal parcial (50 % del lumen) reciente, sin candidatura a trasplante por ahora. ¿Conducta?",
o:["Observar: la trombosis parcial no se trata","Anticoagular (HBPM o ACOD en Child A) y controlar con imagen a 6 meses","TIPS de inmediato","Trombólisis sistémica"],
c:1,
e:"Baveno VII/VIII: anticoagular la trombosis portal reciente, sobre todo &gt; 50 % del lumen, progresiva o con extensión mesentérica; los ACOD son opción en Child A. Recanalización 60–70 %.",
w:{0:"La trombosis &gt; 50 % y reciente debe anticoagularse.",2:"El TIPS se considera si no recanaliza o hay complicaciones de hipertensión portal.",3:"La trombólisis sistémica no se recomienda."},
p:"En candidato a trasplante: anticoagular cualquier trombosis, independiente del grado.",
r:"Baveno VII/VIII · AASLD vascular 2020"},

{id:"HP08",b:"CI",t:"Hipertensión portal y HDA",n:"R",md:"X",
q:"Cirrosis descompensada con várices pequeñas sin signos rojos y ascitis grado 2. ¿Profilaxis primaria?",
o:["Ninguna hasta que crezcan","BBNS","Ligadura","TIPS"],
c:1,
e:"En el descompensado con várices, el BBNS es de elección (también previene otras descompensaciones); la ligadura se reserva para várices de alto riesgo con intolerancia o contraindicación a BBNS.",
w:{0:"El descompensado con várices tiene alto riesgo.",2:"La ligadura no previene otras descompensaciones.",3:"No hay indicación de TIPS."},
p:"Con ascitis: carvedilol máx. 12,5 mg/día, propranolol máx. 160 mg/día.",
r:"Baveno VII/VIII"},

{id:"HP09",b:"CI",t:"Hipertensión portal y HDA",n:"S",md:"E",
q:"Paciente con TIPS hace 3 semanas desarrolla encefalopatía grado II recurrente pese a lactulosa y rifaximina. ¿Siguiente paso?",
o:["Ocluir el TIPS de inmediato","Reducir el diámetro del TIPS (stent de reducción)","Aumentar lactulosa al doble","Listar en urgencia para trasplante"],
c:1,
e:"La encefalopatía refractaria post-TIPS (~5–10 %) se maneja con <b>reducción del calibre</b> del stent; la oclusión completa reaparece la hipertensión portal.",
w:{0:"La oclusión total es la última opción.",2:"Ya está en tratamiento óptimo.",3:"No es indicación de urgencia."},
p:"Prevención: TIPS cubierto de 8 mm dilatado a demanda; rifaximina profiláctica reduce la encefalopatía post-TIPS (Bureau, Ann Intern Med 2021).",
r:"EASL TIPS 2025 · Bureau C, Ann Intern Med 2021"},

{id:"HP10",b:"CI",t:"Hipertensión portal y HDA",n:"R",md:"E",
q:"¿Cuánto dura la profilaxis antibiótica en la hemorragia variceal según Baveno VIII y ACG 2026?",
o:["Máximo 7 días; puede acortarse (2–3 días) según riesgo y gravedad","Siempre 14 días","Solo si hay fiebre","Hasta el alta, sin límite"],
c:0,
e:"Ceftriaxona 1 g/día hasta 7 días; Baveno VIII individualiza la duración (puede no ser necesaria en Child A) y la ACG 2026 sugiere un curso corto de 2–3 días.",
w:{1:"Excesivo.",2:"La profilaxis es universal en el cirrótico que sangra.",3:"Excesivo y selecciona resistencias."},
p:"La profilaxis reduce infecciones, resangrado y mortalidad.",
r:"Baveno VIII 2026 · ACG 2026"},

/* ===================== Bloque 4 · Ascitis, PBE, HRS-AKI e hiponatremia ===================== */

{id:"HP11",b:"CI",t:"Hipertensión portal y HDA",n:"R",md:"E",
q:"Mujer de 41 años con colitis ulcerosa en azatioprina desde hace 10 años. Plaquetas 98.000/mm³ y bazo de 15 cm. Rigidez hepática 6,2 kPa y esplénica 58 kPa. Várices esofágicas pequeñas. Porta permeable. Biopsia de 20 mm sin cirrosis, con vénulas portales muscularizadas. ¿Puntaje PSVD/NCPF de Baveno VIII y diagnóstico?",
o:["6: posible","9: definitivo","8: definitivo","4: posible"],
c:1,
e:"Signo <b>específico</b> de hipertensión portal: rigidez esplénica &gt; 40 kPa sin neoplasia mieloproliferativa (+3; supera a las várices pequeñas y la plaquetopenia, que son inespecíficas, +2). Lesión histológica <b>mayor</b>: vénulas portales muscularizadas (+5). <b>Condición asociada</b>: tiopurina y EII (+1). Sin causa de cirrosis (0). Total <b>9: PSVD/NCPF definitivo</b> (≥ 5).",
w:{0:"Suma mal los componentes; un signo específico más una lesión mayor ya dan 8.",2:"Omite el punto de la condición asociada (azatioprina y EII).",3:"Toma las várices pequeñas (+2) como el signo más alto y la lesión como menor."},
p:"Rigidez hepática &lt; 10 kPa con signos de hipertensión portal: pensar en enfermedad vascular (Baveno VIII 1.6). Suspender la tiopurina en conjunto con el equipo de EII.",
r:"Baveno VIII, Fig. 4 y enunciados 8.38–8.45"},

{id:"HP12",b:"CI",t:"Hipertensión portal y HDA",n:"R",md:"X",
q:"Hombre de 47 años con trombosis portal reciente no cirrótica. El estudio muestra mutación JAK2 V617F con hemograma normal. Anticoagulado, a los 6 meses tiene recanalización completa. ¿Conducta a largo plazo según Baveno VIII?",
o:["Suspender: recanalizó por completo","ACOD a dosis baja indefinido","Anticoagulación indefinida a dosis plena","Aspirina y suspender la anticoagulación"],
c:2,
e:"La <b>neoplasia mieloproliferativa</b> (aunque sea oculta, con hemograma normal) es un factor de riesgo permanente <b>mayor</b>: el riesgo de recurrencia es alto y corresponde <b>anticoagulación indefinida a dosis terapéutica</b> (fuerte), aunque haya recanalizado. Derivar a hematología para el tratamiento de la neoplasia.",
w:{0:"Suspender solo procede si la trombosis fue provocada, el factor reversible resolvió y no hay factor permanente.",1:"La dosis baja de ACOD es para riesgo intermedio: factor no mayor o trombosis no provocada sin factor permanente.",3:"La aspirina no reemplaza la anticoagulación en un factor mayor."},
p:"Clasificar siempre: provocada (factor reversible en los 3 meses previos) o no provocada, y factor permanente ausente, no mayor o mayor (Baveno VIII, Fig. 5 y tabla S4).",
r:"Baveno VIII, enunciados 9.5–9.10"},

{id:"HP13",b:"CI",t:"Hipertensión portal y HDA",n:"S",md:"E",
q:"Paciente con cirrosis Child-Pugh A6, no candidato a trasplante, con trombosis reciente del tronco portal con luz remanente del 30 %, asintomática. Filtración glomerular 75 mL/min, plaquetas 85.000/mm³. ¿Qué recomienda Baveno VIII?",
o:["Vigilar con imagen cada 3 meses sin anticoagular","Anticoagular al menos 6 meses y considerar mantenerla a largo plazo aunque recanalice","Anticoagular solo si progresa a la mesentérica superior","TIPS de primera línea"],
c:1,
e:"Una luz remanente &lt; 50 % es oclusión <b>parcial</b> (VALDIG). La trombosis reciente parcial o completa del tronco es indicación de anticoagular (fuerte en Baveno VIII). Se mantiene <b>≥ 6 meses</b> y se considera a largo plazo independiente de la recanalización. En Child A los ACOD son seguros.",
w:{0:"La vigilancia sin anticoagular se reserva para la trombosis mínima (luz remanente ≥ 50 %) estable en el no candidato.",2:"La progresión es criterio para anticoagular a quien se estaba vigilando; esta trombosis ya cumple indicación.",3:"El TIPS es primera línea solo si hay complicaciones de hipertensión portal y la anticoagulación está contraindicada."},
p:"Riesgos de sangrado que obligan a individualizar: edad, fragilidad, filtración &lt; 30 mL/min, descompensación y plaquetas &lt; 50.000/mm³.",
r:"Baveno VIII, enunciados 9.3, 9.19–9.24 · EASL vascular 2026"},
{id:"AS01",b:"CI",t:"Ascitis, PBE y HRS-AKI",n:"R",md:"E",
q:"Ascitis nueva: albúmina sérica 2,9 g/dL, albúmina en ascitis 1,0 g/dL, proteínas en ascitis 3,1 g/dL. ¿Orientación?",
o:["Cirrosis","Insuficiencia cardíaca o Budd-Chiari","Carcinomatosis peritoneal","Síndrome nefrótico"],
c:1,
e:"GASA 1,9 (≥ 1,1 = hipertensión portal) con <b>proteínas ≥ 2,5 g/dL</b>: congestión postsinusoidal (cardíaca, Budd-Chiari, obstrucción sinusoidal). En cirrosis las proteínas suelen ser &lt; 2,5.",
w:{0:"La cirrosis suele tener proteínas bajas.",2:"La carcinomatosis tiene GASA &lt; 1,1.",3:"El nefrótico tiene GASA &lt; 1,1 y proteínas bajas."},
p:"Pida NT-proBNP: &gt; 364 pg/mL orienta a causa cardíaca.",
r:"EASL 2018 · AASLD 2021"},

{id:"AS02",b:"CI",t:"Ascitis, PBE y HRS-AKI",n:"R",md:"X",
q:"Cirrótico con fiebre y dolor abdominal: PMN en ascitis 820/mm³, proteínas 2,4 g/dL, glucosa 32 mg/dL, LDH ascítica mayor que el LSN sérico. Gram con flora mixta. ¿Diagnóstico y conducta?",
o:["PBE; ceftriaxona y albúmina","Peritonitis secundaria; TC de abdomen, antibiótico amplio y evaluación quirúrgica","Bacteriascitis; repetir paracentesis","Ascitis quilosa"],
c:1,
e:"Criterios de Runyon (≥ 2 de: proteínas &gt; 1 g/dL, glucosa &lt; 50 mg/dL, LDH &gt; LSN sérico) y flora polimicrobiana: <b>peritonitis secundaria</b> (perforación o absceso).",
w:{0:"La PBE es monomicrobiana y sin esos criterios bioquímicos.",2:"Bacteriascitis es cultivo + con PMN &lt; 250.",3:"La quilosa tiene triglicéridos &gt; 200 mg/dL."},
p:"CEA &gt; 5 ng/mL o FA &gt; 240 U/L en ascitis sugieren perforación de víscera hueca.",
r:"EASL 2018"},

{id:"AS03",b:"CI",t:"Ascitis, PBE y HRS-AKI",n:"R",md:"E",
q:"PBE comunitaria en paciente con bilirrubina 5 mg/dL y creatinina 1,4 mg/dL. Además de ceftriaxona, ¿qué reduce la lesión renal y la mortalidad?",
o:["Albúmina 1,5 g/kg día 1 y 1 g/kg día 3","Furosemida EV","Terlipresina profiláctica","Paracentesis evacuadora diaria"],
c:0,
e:"Sort NEJM 1999: la albúmina en PBE redujo la falla renal (10 % vs 33 %) y la mortalidad (10 % vs 29 %), sobre todo con creatinina &gt; 1 mg/dL, BUN &gt; 30 o bilirrubina &gt; 4.",
w:{1:"Los diuréticos se suspenden en PBE.",2:"No hay indicación sin HRS-AKI.",3:"Las paracentesis grandes sin albúmina empeoran la función renal."},
p:"Control con paracentesis a las 48 h: caída de PMN &lt; 25 % = falla.",
r:"Sort P, NEJM 1999 · EASL 2018"},

{id:"AS04",b:"CI",t:"Ascitis, PBE y HRS-AKI",n:"R",md:"X",
q:"Tras un episodio de PBE resuelto, ¿qué profilaxis corresponde?",
o:["Ninguna","Norfloxacino 400 mg/día o ciprofloxacino 500 mg/día de forma indefinida","Ceftriaxona semanal","Rifaximina como única opción"],
c:1,
e:"La recurrencia de PBE al año es ~70 % sin profilaxis: <b>profilaxis secundaria indefinida</b> (o hasta trasplante) con norfloxacino o ciprofloxacino.",
w:{0:"La recurrencia es muy alta.",2:"No es estándar.",3:"La rifaximina no es la profilaxis estándar de PBE."},
p:"Profilaxis primaria: proteínas &lt; 1,5 g/dL + (Child ≥ 9 con bilirrubina ≥ 3, o creatinina ≥ 1,2, BUN ≥ 25 o Na ≤ 130).",
r:"EASL 2018"},

{id:"AS05",b:"CI",t:"Ascitis, PBE y HRS-AKI",n:"R",md:"E",
q:"Cirrótico con ascitis: creatinina basal 0,9 mg/dL, hoy 1,7 mg/dL. Suspendió diuréticos hace 48 h y recibió albúmina 1 g/kg × 2 días sin mejoría. Sin shock ni nefrotóxicos, sedimento normal. ¿Diagnóstico y tratamiento?",
o:["Necrosis tubular aguda; diálisis","HRS-AKI; terlipresina + albúmina","LRA prerrenal; más volumen","Nefropatía por IgA; biopsia renal"],
c:1,
e:"Cumple HRS-AKI: cirrosis con ascitis, LRA (≥ 1,5 × basal), sin respuesta a expansión, sin shock, sin nefrotóxicos, sin daño estructural. <b>Terlipresina + albúmina</b>.",
w:{0:"El sedimento normal y la falta de proteinuria van contra NTA.",2:"Ya no respondió a la expansión.",3:"No hay hematuria ni proteinuria."},
p:"ICA-ADQI 2024: la expansión se individualiza según volemia; ya no es obligatoria a todos por 48 h.",
r:"Nadim MK, J Hepatol 2024 (ICA-ADQI)"},

{id:"AS06",b:"CI",t:"Ascitis, PBE y HRS-AKI",n:"F",md:"X",
q:"Al día 3 de terlipresina 1 mg c/6 h por HRS-AKI, la creatinina bajó de 2,4 a 2,1 mg/dL. ¿Conducta?",
o:["Suspender por falta de respuesta","Aumentar la terlipresina (hasta 2 mg c/4–6 h o 12 mg/día en infusión)","Mantener la dosis hasta el día 14","Agregar midodrina"],
c:1,
e:"Caída &lt; 25 % al día 3 → <b>escalar la dosis</b> si se tolera. Respuesta completa: creatinina dentro de 0,3 mg/dL del basal; máximo 14 días.",
w:{0:"Se escala antes de declarar falla.",2:"Mantener la dosis cuando la respuesta es insuficiente es subóptimo.",3:"La midodrina no se combina con terlipresina."},
p:"La infusión continua (2 mg/día inicial) tiene menos efectos isquémicos que los bolos.",
r:"ICA-ADQI 2024 · Cavallin M, Hepatology 2016"},

{id:"AS07",b:"CI",t:"Ascitis, PBE y HRS-AKI",n:"F",md:"E",
q:"¿Qué efecto adverso de la terlipresina destacó el ensayo CONFIRM y obliga a vigilancia diaria?",
o:["Hiperkalemia","Insuficiencia respiratoria por sobrecarga de volumen","Hepatotoxicidad","Neutropenia"],
c:1,
e:"CONFIRM: insuficiencia respiratoria 10 % vs 3 % con placebo, sobre todo con ACLF-3 y creatinina ≥ 5. Monitorizar SpO₂ y volemia; reducir la albúmina si hay sobrecarga.",
w:{0:"Hiponatremia, no hiperkalemia.",2:"No es un efecto relevante.",3:"No es un efecto descrito."},
p:"Evitar terlipresina con SpO₂ &lt; 90 %, isquemia coronaria o periférica activa.",
r:"Wong F, NEJM 2021 (CONFIRM)"},

{id:"AS08",b:"CI",t:"Ascitis, PBE y HRS-AKI",n:"R",md:"X",
q:"Paciente con ascitis en espironolactona 400 mg + furosemida 160 mg/día que sigue acumulando ascitis con restricción de sodio adecuada. ¿Cómo se clasifica y qué opción definitiva existe?",
o:["Ascitis grado 2; aumentar furosemida a 240 mg","Ascitis refractaria resistente a diuréticos; TIPS cubierto si no hay contraindicaciones","Ascitis quilosa; dieta con triglicéridos de cadena media","Ascitis por hipoalbuminemia; albúmina semanal"],
c:1,
e:"Refractaria: sin respuesta a dosis máximas (400/160) o complicaciones que impiden alcanzarlas. El <b>TIPS cubierto</b> mejora el control de la ascitis y la sobrevida en seleccionados; evaluar trasplante.",
w:{0:"Se superó la dosis máxima.",2:"No hay datos de quilosidad.",3:"La albúmina crónica no es estándar."},
p:"Contraindicaciones de TIPS: bilirrubina &gt; 5 mg/dL, insuficiencia cardíaca, hipertensión pulmonar, encefalopatía recurrente.",
r:"EASL 2018 · Bureau C, Gastroenterology 2017"},

{id:"AS09",b:"CI",t:"Ascitis, PBE y HRS-AKI",n:"R",md:"E",
q:"Cirrótico con Na 124 mmol/L asintomático, euvolémico-hipervolémico con ascitis. ¿Manejo inicial?",
o:["Suero salino hipertónico","Restricción hídrica a 1–1,5 L/día y suspender diuréticos si Na &lt; 125","Tolvaptán ambulatorio","Corregir a 135 mmol/L en 24 h"],
c:1,
e:"Hiponatremia hipervolémica: suspender diuréticos con Na &lt; 125 y <b>restringir líquidos</b> (1–1,5 L/día). El hipertónico solo si hay síntomas graves; corrección ≤ 8 mmol/L/24 h.",
w:{0:"Solo en hiponatremia sintomática grave.",2:"El tolvaptán no se recomienda en cirrosis (hepatotoxicidad) salvo excepción hospitalizada.",3:"Corrección rápida = mielinólisis."},
p:"Na &lt; 130 empeora el pronóstico y es parte del MELD-Na.",
r:"EASL 2018"},

{id:"AS10",b:"CI",t:"Ascitis, PBE y HRS-AKI",n:"R",md:"X",
q:"Paracentesis evacuadora de 8 L. ¿Cuánta albúmina corresponde?",
o:["No requiere","20 g","48–64 g (6–8 g/L)","100 g"],
c:2,
e:"Sobre 5 L, reponer <b>6–8 g de albúmina por litro</b> extraído para prevenir la disfunción circulatoria post-paracentesis: 48–64 g.",
w:{0:"Sobre 5 L sí se requiere.",1:"Insuficiente.",3:"Excesivo."},
p:"La albúmina es superior a los cristaloides y otros expansores en paracentesis grandes.",
r:"EASL 2018"}
];

{id:"EH03",b:"CI",t:"Encefalopatía",n:"F",md:"E",

{id:"EH05",b:"CI",t:"Encefalopatía",n:"F",md:"X",

{id:"AC03",b:"CI",t:"ACLF",n:"F",md:"E",
q:"Paciente con ACLF-3 al ingreso. ¿Cuándo predice mejor el grado el pronóstico?",
o:["Solo al ingreso","Al reevaluarlo entre los días 3 y 7","Al alta","Al mes"],
c:1,
e:"El curso es dinámico: el <b>grado a los 3–7 días</b> de tratamiento predice mejor la mortalidad a 28 y 90 días (Gustot 2015).",
w:{0:"El ingreso subestima la reversibilidad.",2:"Demasiado tarde para decidir.",3:"Demasiado tarde."},
p:"ACLF-3 persistente con ≥ 4 fallas: mortalidad &gt; 90 % sin trasplante.",

{id:"AC04",b:"CI",t:"ACLF",n:"F",md:"X",
q:"¿Cuál es el desencadenante más frecuente de ACLF en Occidente?",

c:1,
e:"En Europa y Latinoamérica predominan la <b>infección bacteriana</b> y la <b>hepatitis alcohólica</b>; en Asia, la reactivación de VHB. En ~40 % no se identifica precipitante.",
w:{0:"Es más frecuente en Asia (VHB).",2:"Posible pero menos frecuente.",3:"Menos frecuente."},
p:"Siempre buscar infección: hemocultivos, urocultivo, paracentesis, radiografía.",
r:"Moreau R, Gastroenterology 2013"},

{id:"AC05",b:"CI",t:"ACLF",n:"S",md:"E",
q:"Paciente con ACLF-3 evaluado para trasplante. Edad 55, lactato 4,6 mmol/L, ventilación mecánica con PaO₂/FiO₂ 180, leucocitos 14.000. ¿Qué indica el modelo TAM?",
o:["Candidato ideal","TAM 3: sobrevida a 1 año postrasplante &lt; 10 %; considerar futilidad","El TAM no aplica a ACLF","TAM 0"],
c:1,
e:"TAM suma: edad ≥ 53, lactato ≥ 4, VM con PaO₂/FiO₂ ≤ 200, leucocitos ≤ 10 ×10⁹/L. Este paciente tiene 3 (leucocitos &gt; 10 no suman). TAM &gt; 2 → sobrevida a 1 año &lt; 10 %.",
w:{0:"Tiene criterios de alto riesgo.",2:"Se diseñó para ACLF-3.",3:"Suma 3 puntos."},
p:"Evaluar el TAM en el momento de la oferta, no al ingreso.",
r:"Artzner T, Am J Transplant 2020 · EASL ACLF 2023"},

{id:"AC06",b:"CI",t:"ACLF",n:"F",md:"X",
q:"¿Qué sistema de soporte o terapia mostró beneficio de sobrevida en ACLF en ensayos aleatorizados?",
o:["MARS","G-CSF","Ninguno de forma consistente; el trasplante es la única terapia que cambia el pronóstico","Albúmina en dosis altas"],
c:2,
e:"MARS (RELIEF) y G-CSF (GRAFT) no mejoraron la sobrevida; la plasmaféresis (APACHE) tiene señal a corto plazo aún no estándar. El <b>trasplante</b> en ACLF-2/3 seleccionado: sobrevida ~80–90 %.",
w:{0:"RELIEF negativo.",1:"GRAFT negativo.",3:"Sin beneficio demostrado en ACLF."},
p:"Sin trasplante, la mortalidad a 1 mes en ACLF grave es 64–93 %.",
r:"EASL ACLF 2023"},

{id:"AC07",b:"CI",t:"ACLF",n:"R",md:"E",

c:1,
e:"CLIF-C ACLF = 10 × [0,33 × CLIF-OF + 0,04 × edad + 0,63 × ln(leucocitos) − 2]. Reemplaza al MELD en ACLF.",

{id:"AC08",b:"CI",t:"ACLF",n:"R",md:"X",

{id:"AC09",b:"CI",t:"ACLF",n:"S",md:"X",

c:1,
e:"APASL: insulto hepático agudo con <b>ictericia (bilirrubina ≥ 5) y coagulopatía (INR ≥ 1,5)</b>, complicado con ascitis y/o encefalopatía en 4 semanas, en enfermedad hepática crónica con o sin cirrosis. EASL-CLIF exige cirrosis y fallas orgánicas.",
w:{0:"No exige infección.",2:"Usa su propio score (AARC).",3:"Son definiciones distintas."},

{id:"AC10",b:"CI",t:"ACLF",n:"F",md:"E",

/* ===================== Bloque 7 · El cirrótico integral ===================== */
{id:"CX01",b:"CI",t:"Cirrótico integral",n:"R",md:"E",
q:"Cirrótico Child B con INR 2,0 y plaquetas 58.000 programado para ligadura de várices. ¿Qué corrección previa corresponde?",
o:["Plasma 15 mL/kg","Transfusión de plaquetas a &gt; 100.000","Ninguna: la ligadura es de bajo riesgo y el INR no refleja el riesgo hemorrágico","Vitamina K y esperar 48 h"],
c:2,
e:"En cirrosis la hemostasia está <b>rebalanceada</b>: el INR no predice sangrado. Para procedimientos de bajo riesgo no se corrige; en alto riesgo se individualiza (plaquetas ≥ 50.000, fibrinógeno &gt; 120 mg/dL).",
w:{0:"El plasma aumenta la presión portal.",1:"Innecesario para bajo riesgo.",3:"La vitamina K no corrige la coagulopatía por síntesis."},
p:"AGA 2021 · ISTH: no usar el INR para estimar riesgo de sangrado en cirrosis.",
r:"AGA CPU coagulación en cirrosis 2021 · Baveno VII"},

{id:"CX02",b:"CI",t:"Cirrótico integral",n:"R",md:"X",
q:"Cirrótico Child A con fibrilación auricular, CHA₂DS₂-VASc 3. ¿Anticoagulación?",
o:["Contraindicada por la cirrosis","ACOD (apixabán o rivaroxabán) con control de función renal","Solo aspirina","Warfarina con meta INR 4"],
c:1,
e:"En <b>Child A</b> los ACOD son seguros y al menos tan eficaces como warfarina. Child B: apixabán con cautela; Child C: evitar.",
w:{0:"La cirrosis no contraindica.",2:"Aspirina no previene el ictus en FA.",3:"Meta incorrecta y difícil de controlar."},
p:"Tratar várices de alto riesgo antes de anticoagular.",
r:"AASLD vascular 2020 · Baveno VIII"},

{id:"CX03",b:"CI",t:"Cirrótico integral",n:"R",md:"E",
q:"¿Cuál es la herramienta recomendada para evaluar fragilidad en el cirrótico ambulatorio?",

c:1,
e:"El <b>LFI</b> es objetivo, rápido y predice mortalidad en lista independiente del MELD. Robusto &lt; 3,2; prefrágil 3,2–4,4; frágil ≥ 4,5.",
w:{0:"El IMC subestima la desnutrición por ascitis y edema.",2:"Refleja síntesis, no fragilidad.",3:"Subjetivo."},
p:"Sarcopenia por TC en L3: &lt; 38,5 cm²/m² mujeres, &lt; 52,4 cm²/m² hombres.",
r:"Lai JC, Hepatology 2017 · AASLD frailty 2021"},

{id:"CX04",b:"CI",t:"Cirrótico integral",n:"F",md:"X",

c:1,
e:"Child B y MELD 10–15: mortalidad perioperatoria relevante. Estimar riesgo con <b>VOCAL-Penn</b> o Mayo, controlar ascitis, nutrición, decidir en centro con hepatología; TIPS preoperatorio solo seleccionado.",
w:{0:"Subestima el riesgo.",2:"No es absoluta en Child B.",3:"El TIPS preoperatorio no tiene evidencia sólida para todos."},
p:"Cirugía electiva generalmente contraindicada en Child C o MELD &gt; 20.",
r:"AGA CPU riesgo quirúrgico en cirrosis (Northup, Clin Gastroenterol Hepatol 2019) · Mahmud N, Hepatology 2021 (VOCAL-Penn)"},

{id:"CX05",b:"CI",t:"Cirrótico integral",n:"R",md:"E",
q:"Según el GES 88, ¿cuál de estos pacientes egresado por cirrosis debe derivarse a especialidad?",

c:2,
e:"Deriva a especialidad: Child ≥ 8, MELD-Na ≥ 15, <b>cirrosis autoinmune</b> (CBP, HAI, CEP), encefalopatía ≥ II recurrente o persistente, antecedente de HCC, todo paciente pediátrico.",

{id:"CX06",b:"CI",t:"Cirrótico integral",n:"R",md:"X",
q:"¿Qué vacunas se recomiendan en el cirrótico?",
o:["Ninguna: están contraindicadas","Hepatitis A y B (si no inmune), neumocócica, influenza anual, COVID-19 y zóster recombinante","Solo influenza","Vacunas vivas atenuadas en Child C"],
c:1,
e:"Todas las inactivadas: VHA, VHB, neumocócica, influenza, COVID-19, <b>zóster recombinante</b>. Las vivas se evitan en inmunosupresión y antes del trasplante con precaución.",

{id:"CX07",b:"CI",t:"Cirrótico integral",n:"F",md:"E",
q:"Cirrótico con disnea y SpO₂ 88 % de pie que mejora acostado (ortodesoxia). Ecocardiograma con burbujas: paso tardío al corazón izquierdo (&gt; 3 latidos). PaO₂ 58 mmHg. ¿Diagnóstico y conducta?",

{id:"CX08",b:"CI",t:"Cirrótico integral",n:"R",md:"X",

c:1,
e:"El <b>tubo pleural</b> en hidrotórax hepático produce pérdida de proteínas, infección, insuficiencia renal y alta mortalidad. Toracocentesis repetidas, TIPS o trasplante.",

{id:"CX09",b:"CI",t:"Cirrótico integral",n:"R",md:"E",
q:"¿Cuál es el aporte calórico recomendado en el cirrótico no obeso?",

c:1,
e:"<b>30–35 kcal/kg/día</b> y 1,2–1,5 g/kg/día de proteínas, comidas fraccionadas y colación nocturna. En obesos, reducción calórica moderada manteniendo proteínas.",
w:{0:"Insuficiente.",2:"Excesivo.",3:"Se calcula con peso seco."},
p:"El ayuno nocturno en cirrosis equivale a 3 días de ayuno en sano.",

/* ===================== Bloque 8 · MASLD y enfermedad hepática por alcohol ===================== */
{id:"MA01",b:"ET",t:"MASLD y alcohol",n:"R",md:"E",

c:1,
e:"Esteatosis + ≥ 1 criterio cardiometabólico + consumo de <b>140–350 g/semana en mujeres</b> (210–420 en hombres) = <b>MetALD</b>. Bajo 140 g/semana sería MASLD; sobre 350 g/semana, enfermedad hepática por alcohol.",
w:{0:"Supera el umbral de 140 g/semana en mujeres.",2:"Requiere &gt; 350 g/semana en mujeres.",3:"Hay criterios cardiometabólicos y una causa identificada."},
p:"Cortes: mujeres 140–350 g/semana (20–50 g/día), hombres 210–420 g/semana (30–60 g/día).",
r:"Rinella ME, J Hepatol 2023 (nomenclatura Delphi)"},
