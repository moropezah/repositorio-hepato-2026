o:["Observar: hepatitis B crónica HBeAg negativa sin fibrosis","Tratar con entecavir o tenofovir","Peg-interferón obligatorio","Solo vacunar a los contactos"],
c:1,
e:"EASL 2025 simplificó la indicación: <b>DNA &gt; 2.000 UI/mL con ALT elevada</b> (LSN 30 hombres, 19 mujeres) basta para tratar, aun sin fibrosis significativa.",
w:{0:"Con el nuevo LSN de ALT y DNA &gt; 2.000 corresponde tratar.",2:"Es opción en casos seleccionados, no obligatorio.",3:"Se vacuna a los contactos además de tratar."},
p:"GES 68: evaluación en 30 días y tratamiento en 30 días desde la indicación.",
r:"EASL VHB 2025"},

{id:"VI02",b:"ET",t:"Hepatitis virales",n:"R",md:"X",
q:"Paciente con cirrosis compensada y HBsAg positivo, DNA-VHB 120 UI/mL, ALT normal. ¿Tratamiento?",
o:["No: la viremia es baja","Sí: en cirrosis se trata cualquier viremia detectable","Solo si HBeAg es positivo","Solo si hay HCC"],
c:1,
e:"En <b>cirrosis se trata con cualquier DNA detectable</b>, independiente de ALT y HBeAg.",
w:{0:"En cirrosis no hay umbral de DNA.",2:"No depende del HBeAg.",3:"Se trata para prevenir HCC y descompensación."},
p:"Vigilancia de HCC semestral persiste aunque el DNA sea indetectable.",
r:"EASL VHB 2025"},

{id:"VI03",b:"ET",t:"Hepatitis virales",n:"F",md:"E",
q:"Mujer HBsAg negativo, anti-HBc positivo, anti-HBs positivo, que iniciará rituximab por linfoma. ¿Conducta?",
o:["Nada: infección resuelta","Profilaxis con entecavir o tenofovir desde el inicio y hasta ≥ 18 meses tras la última dosis","Solo monitorizar ALT mensual","Lamivudina por 3 meses"],
c:1,
e:"Anti-CD20 en anti-HBc positivo = <b>riesgo alto</b> de reactivación (seroconversión reversa): profilaxis con análogo de alta barrera, mantenida al menos 18 meses tras la última dosis.",
w:{0:"La infección resuelta reactiva con anti-CD20.",2:"El monitoreo solo es para riesgo moderado-bajo.",3:"Lamivudina tiene resistencia y duración insuficiente."},
p:"Anti-HBs positivo no elimina el riesgo con rituximab.",
r:"EASL VHB 2025 · AGA reactivación VHB 2025"},

{id:"VI04",b:"ET",t:"Hepatitis virales",n:"R",md:"X",
q:"Embarazada de 26 semanas, HBsAg positivo, DNA-VHB 3,5 × 10⁷ UI/mL. ¿Conducta?",
o:["Solo vacuna e inmunoglobulina al recién nacido","Tenofovir disoproxil desde la semana 24–28, más vacuna e inmunoglobulina al recién nacido","Cesárea obligatoria","Contraindicar la lactancia"],
c:1,
e:"DNA &gt; 200.000 UI/mL: <b>TDF desde la semana 24–28</b> reduce la transmisión vertical, además de inmunoprofilaxis del recién nacido en las primeras 12 h.",
w:{0:"Con carga alta la inmunoprofilaxis sola falla en ~10 %.",2:"La cesárea no está indicada por VHB.",3:"La lactancia se permite."},
p:"TAF es alternativa en embarazo según datos recientes (EASL 2025).",
r:"EASL embarazo 2023 · EASL VHB 2025"},

{id:"VI05",b:"ET",t:"Hepatitis virales",n:"R",md:"E",
q:"Hepatitis C crónica sin cirrosis, sin tratamiento previo, en tratamiento con omeprazol 40 mg/día y amiodarona. ¿Qué es correcto?",
o:["Sofosbuvir/velpatasvir sin precauciones","La amiodarona contraindica sofosbuvir (bradicardia grave); preferir glecaprevir/pibrentasvir y revisar interacciones","Ribavirina en monoterapia","No tratar"],
c:1,
e:"<b>Sofosbuvir + amiodarona</b>: bradicardia grave y paro. Glecaprevir/pibrentasvir 8 semanas es una opción (revisar estatinas y anticonceptivos). Además, el IBP en dosis alta reduce la absorción de velpatasvir.",
w:{0:"Interacción grave.",2:"Ineficaz.",3:"Debe tratarse."},
p:"Consultar siempre hep-druginteractions.org (Liverpool).",
r:"EASL VHC 2020 · AASLD-IDSA HCV guidance"},

{id:"VI06",b:"ET",t:"Hepatitis virales",n:"F",md:"X",
q:"Hepatitis C con cirrosis Child B 8. ¿Esquema?",
o:["Glecaprevir/pibrentasvir 8 semanas","Sofosbuvir/velpatasvir + ribavirina 12 semanas","Sofosbuvir/velpatasvir/voxilaprevir 12 semanas","Diferir hasta el trasplante siempre"],
c:1,
e:"En descompensados se evitan los <b>inhibidores de proteasa</b> (glecaprevir, voxilaprevir): hepatotoxicidad. Sofosbuvir/velpatasvir + ribavirina 12 semanas (o 24 sin ribavirina).",
w:{0:"Contraindicado en Child B y C.",2:"Contiene inhibidor de proteasa.",3:"Se puede tratar antes; con MELD muy alto se discute tratar postrasplante."},
p:"Con MELD &gt; 18–20 en lista, a veces se difiere el tratamiento para no perder prioridad (purgatorio MELD).",
r:"EASL VHC 2020"},

{id:"VI07",b:"ET",t:"Hepatitis virales",n:"R",md:"E",
q:"Todo paciente HBsAg positivo debe estudiarse además con…",
o:["Anti-VHE","Anti-VHD (y RNA-VHD si es positivo)","Anti-VHA IgM","Carga viral de VHC"],
c:1,
e:"EASL 2023: <b>tamizaje universal de VHD</b> en todo HBsAg positivo; la coinfección acelera la progresión a cirrosis y HCC.",
w:{0:"No es estándar.",2:"Solo si hay hepatitis aguda.",3:"Se tamiza VHC por anticuerpos, no carga directa."},
p:"Tratamiento de VHD: bulevirtida 2 mg/día SC (sin registro en Chile).",
r:"EASL VHD 2023"},

{id:"VI08",b:"ET",t:"Hepatitis virales",n:"R",md:"X",
q:"¿Qué define la curación de la hepatitis C?",
o:["ALT normal al terminar el tratamiento","RNA-VHC indetectable 12 semanas después de terminar (RVS 12)","Anti-VHC negativo","Rigidez &lt; 7 kPa"],
c:1,
e:"<b>RVS 12</b>: RNA indetectable 12 semanas post-tratamiento; la recaída tardía es &lt; 1 %. El anti-VHC permanece positivo de por vida.",
w:{0:"No define curación.",2:"El anticuerpo persiste.",3:"La rigidez no define curación virológica."},
p:"Reinfección posible: tamizar con RNA, no con anticuerpos, en personas en riesgo.",
r:"EASL VHC 2020"},

{id:"VI09",b:"ET",t:"Hepatitis virales",n:"S",md:"E",
q:"Paciente HBeAg negativo con DNA indetectable y HBsAg cuantitativo 60 UI/mL tras 6 años de entecavir, sin cirrosis. ¿Qué opción plantea EASL 2025?",
o:["Continuar indefinidamente siempre","Suspender el análogo con seguimiento estrecho (HBsAg bajo predice pérdida de HBsAg)","Cambiar a lamivudina","Agregar ribavirina"],
c:1,
e:"En no cirróticos HBeAg negativos con supresión prolongada, la <b>suspensión del análogo</b> es opción; HBsAg &lt; 100 UI/mL (o &lt; 1.000 en algunos genotipos) predice pérdida de HBsAg. Requiere seguimiento por riesgo de exacerbación.",
w:{0:"La suspensión es una opción reconocida.",2:"Menor barrera.",3:"Sin rol."},
p:"Nunca suspender en cirrosis.",
r:"EASL VHB 2025 · Hirode G, Gastroenterology 2022 (RETRACT-B)"},

{id:"VI10",b:"ET",t:"Hepatitis virales",n:"R",md:"X",
q:"Según GES 69, ¿cuál es la garantía de oportunidad para iniciar el tratamiento de la hepatitis C tras la indicación?",
o:["7 días","30 días","90 días","No tiene garantía de oportunidad"],
c:1,
e:"GES 69: diagnóstico en 45 días desde la sospecha, evaluación pretratamiento en 30 días y <b>tratamiento en 30 días</b> desde la indicación.",
w:{0:"No.",2:"No.",3:"Sí la tiene."},
p:"Copago FONASA A–D 0 %, ISAPRE 20 %.",
r:"Superintendencia de Salud, GES 69"},

/* ===================== Bloque 10 · Autoinmunes ===================== */
{id:"AI01",b:"ET",t:"Autoinmunes",n:"R",md:"E",
q:"Mujer de 34 años: ALT 380 U/L, ANA 1:160, IgG 1,4 × LSN, biopsia típica de hepatitis autoinmune, virus negativos. Sin cirrosis. ¿Puntaje simplificado y tratamiento?",
o:["6 puntos; observar","8 puntos; prednisona (o budesonida) + azatioprina o micofenolato","5 puntos; biopsia repetida","8 puntos; solo ursodeoxicólico"],
c:1,
e:"ANA ≥ 1:80 (2) + IgG &gt; 1,1 × LSN (2) + histología típica (2) + sin virus (2) = <b>8: HAI definida</b>. Inducción con corticoide (budesonida 9 mg si no hay cirrosis) + ahorrador de corticoides.",
w:{0:"El puntaje es 8 y hay actividad.",2:"El puntaje no es 5.",3:"El AUDC no trata la HAI."},
p:"CAMARO: micofenolato logró más respuesta completa que azatioprina (56 % vs 29 %).",
r:"Hennes EM, Hepatology 2008 · EASL HAI 2025 · Snijders, J Hepatol 2024"},

{id:"AI02",b:"ET",t:"Autoinmunes",n:"R",md:"X",
q:"¿Cuál es la meta de tratamiento de la hepatitis autoinmune?",
o:["ALT &lt; 2 × LSN","Respuesta bioquímica completa: ALT e IgG normales a los 6 meses","Anticuerpos negativos","Solo mejoría de síntomas"],
c:1,
e:"Respuesta bioquímica completa = <b>ALT e IgG normales</b>; la actividad residual se asocia a progresión.",
w:{0:"Insuficiente.",2:"Los anticuerpos no guían el tratamiento.",3:"Insuficiente."},
p:"La mantención dura al menos 3 años y ≥ 2 años de remisión antes de intentar suspender.",
r:"EASL HAI 2025"},

{id:"AI03",b:"ET",t:"Autoinmunes",n:"F",md:"E",
q:"Paciente con HAI en azatioprina 100 mg sin respuesta completa: 6-TGN bajo y 6-MMP 12.000. ¿Interpretación y conducta?",
o:["No adherencia; reforzar","Perfil hipermetilador: alopurinol 100 mg y reducir azatioprina al 25–50 %","Deficiencia de TPMT; suspender","Dosis insuficiente; subir a 200 mg"],
c:1,
e:"6-TGN bajo con <b>6-MMP alto</b> = hipermetilador (riesgo hepatotóxico). Alopurinol desvía el metabolismo hacia 6-TGN.",
w:{0:"La no adherencia daría ambos metabolitos bajos.",2:"La deficiencia de TPMT da 6-TGN muy alto.",3:"Aumentaría la hepatotoxicidad."},
p:"Alternativa: cambiar a micofenolato.",
r:"EASL HAI 2025"},

{id:"AI04",b:"ET",t:"Autoinmunes",n:"R",md:"X",
q:"CBP en AUDC 15 mg/kg por 12 meses: FA 2,3 × LSN, bilirrubina normal. ¿Conducta?",
o:["Continuar igual","Respuesta incompleta: agregar seladelpar, elafibranor o bezafibrato","Suspender AUDC","Corticoides"],
c:1,
e:"FA &gt; 1,67 × LSN o bilirrubina &gt; LSN tras 6–12 meses = <b>respuesta incompleta</b>; segunda línea con agonistas PPAR.",
w:{0:"Persiste riesgo de progresión.",2:"El AUDC se mantiene.",3:"Solo en sobreposición con HAI."},
p:"En Chile, bezafibrato 400 mg/día es la opción disponible fuera de indicación.",
r:"EASL CBP 2017 · ELATIVE/RESPONSE, NEJM 2024"},

{id:"AI05",b:"ET",t:"Autoinmunes",n:"F",md:"E",
q:"CBP con prurito intenso que no responde a colestiramina. ¿Siguiente escalón?",
o:["Antihistamínicos en dosis altas","Rifampicina 150–300 mg/día con control de transaminasas","Ácido obeticólico","Corticoides"],
c:1,
e:"Escalera del prurito: colestiramina → <b>rifampicina</b> → naltrexona → sertralina. Fibratos y seladelpar también mejoran el prurito.",
w:{0:"Poco eficaces salvo sedación.",2:"Empeora el prurito.",3:"Sin rol."},
p:"Rifampicina: hepatotoxicidad ~5–10 %; transaminasas a las 2, 6 y 12 semanas.",
r:"EASL CBP 2017"},

{id:"AI06",b:"ET",t:"Autoinmunes",n:"R",md:"X",
q:"Hombre de 29 años con colitis ulcerosa y FA 3 × LSN. Colangiorresonancia: estenosis multifocales y dilataciones intrahepáticas. ¿Diagnóstico y qué estudio adicional?",
o:["CBP; AMA","CEP de grandes ductos; IgG4 sérica, colonoscopía con biopsias y vigilancia","Colangitis isquémica; angio-TC","Coledocolitiasis; CPRE"],
c:1,
e:"Patrón en rosario en paciente con EII: <b>CEP</b>. Descartar colangitis por IgG4; colonoscopía (riesgo de cáncer colorrectal) y vigilancia de colangiocarcinoma.",
w:{0:"La CBP no da estenosis en colangiorresonancia.",2:"No hay contexto isquémico.",3:"No hay litiasis."},
p:"AUDC en dosis altas (28–30 mg/kg) es dañino en CEP.",
r:"EASL CEP 2022"},

{id:"AI07",b:"ET",t:"Autoinmunes",n:"S",md:"E",
q:"En CEP, ¿qué vigilancia de colangiocarcinoma recomienda EASL 2022?",
o:["CA 19-9 mensual","Ecografía o colangiorresonancia anual (± CA 19-9)","CPRE anual con cepillado","No se vigila"],
c:1,
e:"Imagen anual (ecografía o colangiorresonancia) ± CA 19-9; la CPRE con cepillado y FISH solo ante estenosis dominante o deterioro.",
w:{0:"Sin evidencia.",2:"Invasiva y con complicaciones.",3:"Riesgo de 10–20 % en la vida."},
p:"Colonoscopía anual si hay EII asociada.",
r:"EASL CEP 2022"},

{id:"AI08",b:"ET",t:"Autoinmunes",n:"F",md:"X",
q:"Hombre de 66 años con ictericia indolora, páncreas en salchicha y estenosis de colédoco distal e hiliar. IgG4 sérica 4 × LSN. ¿Tratamiento?",
o:["Duodenopancreatectomía","Prednisona 0,6 mg/kg/día por 2–4 semanas y descenso","AUDC","Quimioterapia"],
c:1,
e:"Colangitis asociada a IgG4 con pancreatitis autoinmune: <b>corticoides</b> (respuesta rápida). Recaída: rituximab o ahorradores. Descartar siempre colangiocarcinoma y cáncer de páncreas.",
w:{0:"Se evita la cirugía si el diagnóstico es firme.",2:"Sin rol.",3:"No es neoplasia."},
p:"IgG4 &gt; 4 × LSN tiene alta especificidad; la ausencia de respuesta a corticoides obliga a replantear el diagnóstico.",
r:"Consenso internacional IgG4 2019 · EASL CEP 2022"},

{id:"AI09",b:"ET",t:"Autoinmunes",n:"R",md:"E",
q:"¿Cuándo está contraindicada la budesonida en la HAI?",
o:["En mujeres jóvenes","En cirrosis (pierde el primer paso hepático)","En diabéticos","En HAI tipo 1"],
c:1,
e:"Con <b>cirrosis o shunts portosistémicos</b> la budesonida pierde su metabolismo de primer paso: efectos sistémicos y riesgo de trombosis portal.",
w:{0:"Es de elección para evitar efectos esteroidales.",2:"Puede ser preferible en diabéticos.",3:"Se usa en tipo 1."},
p:"Budesonida 9 mg/día; mantención 6 mg.",
r:"EASL HAI 2025"},

{id:"AI10",b:"ET",t:"Autoinmunes",n:"F",md:"X",
q:"Mujer de 45 años con CBP (AMA +) que además tiene ALT 6 × LSN e IgG 1,8 × LSN; biopsia con hepatitis de interfase moderada-grave. ¿Conducta?",
o:["Solo AUDC","AUDC + inmunosupresión (variante con rasgos de HAI)","Solo prednisona","Trasplante"],
c:1,
e:"Variante CBP con rasgos de HAI (criterios de París): <b>AUDC + corticoide ± azatioprina</b>.",
w:{0:"La actividad de interfase no responde al AUDC solo.",2:"La CBP requiere AUDC.",3:"Sin indicación."},
p:"Criterios de París para HAI: ALT ≥ 5 × LSN, IgG ≥ 2 × LSN o AML +, e interfase moderada-grave (2 de 3).",
r:"EASL CBP 2017"},

/* ===================== Bloque 11 · Metabólicas ===================== */
{id:"MT01",b:"ET",t:"Metabólicas",n:"R",md:"E",
q:"Hombre de 22 años con ALT 140 U/L, temblor y disartria. Ceruloplasmina 9 mg/dL, cobre urinario 240 µg/24 h, anillos de Kayser-Fleischer. ¿Puntaje de Leipzig y conducta?",
o:["3; estudio genético antes de tratar","≥ 4 (KF 2 + neuro + ceruloplasmina 2 + cobre urinario): Wilson establecido; quelación (trientina o penicilamina) titulada","2; observar","Biopsia obligatoria antes de tratar"],
c:1,
e:"KF (2) + síntomas neurológicos (1–2) + ceruloplasmina &lt; 10 (2) + cobre urinario &gt; 2 × LSN (2) ≥ 4: <b>diagnóstico establecido</b>. En forma neurológica, subir la dosis lentamente (riesgo de empeoramiento).",
w:{0:"El puntaje ya es diagnóstico.",2:"Puntaje mayor.",3:"No es necesaria con Leipzig ≥ 4."},
p:"Tamizar a hermanos (riesgo 25 %).",
r:"EASL-ERN Wilson 2025"},

{id:"MT02",b:"ET",t:"Metabólicas",n:"F",md:"X",
q:"Paciente con Wilson en mantención con penicilamina 1 g/día: cobre urinario 1.600 µg/24 h. ¿Interpretación?",
o:["Tratamiento adecuado","Probable no adherencia reciente (o reinicio)","Sobretratamiento","Falla hepática inminente"],
c:1,
e:"En mantención con quelante se espera <b>200–500 µg/24 h</b>; &gt; 1.000 sugiere no adherencia (reinicio con gran cupriuresis) y &lt; 100 sobretratamiento.",
w:{0:"Está fuera de rango.",2:"Sería &lt; 100.",3:"No se deduce del cobre urinario."},
p:"Con zinc, la meta es &lt; 75 µg/24 h.",
r:"EASL-ERN Wilson 2025"},

{id:"MT03",b:"ET",t:"Metabólicas",n:"R",md:"E",
q:"Hombre de 48 años con ferritina 1.250 µg/L, saturación de transferrina 78 %, ALT 70 U/L. HFE C282Y homocigoto. ¿Qué define la necesidad de biopsia o elastografía?",
o:["Siempre biopsia","Ferritina &gt; 1.000 µg/L o transaminasas elevadas: evaluar fibrosis (elastografía; biopsia si duda)","Solo si hay diabetes","Nunca"],
c:1,
e:"Ferritina &gt; 1.000 µg/L, transaminasas elevadas o hepatomegalia aumentan el riesgo de fibrosis avanzada: <b>elastografía</b> y biopsia si hay duda; con cirrosis, vigilancia de HCC.",
w:{0:"No es necesaria en todos.",2:"No es el único criterio.",3:"Hay subgrupo de riesgo."},
p:"Flebotomía hasta ferritina 50–100 µg/L.",
r:"EASL HH 2022"},

{id:"MT04",b:"ET",t:"Metabólicas",n:"R",md:"X",
q:"¿Cuál es la meta de ferritina en la fase de depleción de la hemocromatosis?",
o:["&lt; 300 µg/L","50–100 µg/L","&lt; 10 µg/L","Normalizar la saturación sin importar la ferritina"],
c:1,
e:"Flebotomías semanales o quincenales hasta <b>ferritina 50–100 µg/L</b>; luego mantención (3–4 por año).",
w:{0:"Insuficiente.",2:"Anemia ferropénica.",3:"La meta es la ferritina."},
p:"Cada flebotomía de 500 mL extrae ~250 mg de hierro.",
r:"EASL HH 2022"},

{id:"MT05",b:"ET",t:"Metabólicas",n:"F",md:"E",
q:"Hombre de 35 años con enfisema basal y elevación de transaminasas; α1-antitripsina sérica 30 mg/dL. ¿Genotipo más probable y daño hepático?",
o:["PiMM; sin daño","PiZZ: polímeros retenidos en el retículo del hepatocito (glóbulos PAS + resistentes a diastasa)","PiSS; hemocromatosis asociada","Pi nulo; cirrosis por acumulación"],
c:1,
e:"<b>PiZZ</b>: la proteína Z polimeriza y se retiene en el hepatocito (daño hepático por ganancia de función) y su déficit sérico causa enfisema (pérdida de función).",
w:{0:"Niveles normales.",2:"PiSS no da enfermedad relevante.",3:"El alelo nulo no produce proteína: enfisema sin daño hepático."},
p:"Fazirsiran (ARNi) reduce los polímeros hepáticos: fase 3 en curso.",
r:"EASL α1-antitripsina 2023"},

{id:"MT06",b:"ET",t:"Metabólicas",n:"S",md:"X",
q:"¿Cuál es la única condición hepatológica cubierta por la Ley Ricarte Soto?",
o:["Hepatitis autoinmune","Tirosinemia tipo 1 (nitisinona)","Enfermedad de Wilson","Colangitis biliar primaria"],
c:1,
e:"La LRS cubre la <b>tirosinemia tipo 1</b> con nitisinona: confirmación (succinilacetona) en 4 días hábiles e inicio en 48 h.",
w:{0:"No está en la LRS.",2:"No está en la LRS.",3:"No está en la LRS."},
p:"Los fármacos de la cirrosis tras el alta están en el GES 88, no en la LRS.",
r:"Superintendencia de Salud · Ley 20.850"},

{id:"MT07",b:"ET",t:"Metabólicas",n:"R",md:"E",
q:"Ceruloplasmina baja aislada (15 mg/dL) en mujer asintomática con transaminasas normales y cobre urinario normal, sin anillos. ¿Interpretación?",
o:["Wilson confirmado","Puede ser heterocigota o hipoceruloplasminemia por otras causas; Leipzig 1: diagnóstico improbable, considerar estudio genético si hay sospecha familiar","Inicio inmediato de penicilamina","Biopsia obligatoria"],
c:1,
e:"Ceruloplasmina 10–20 suma 1 punto en Leipzig; sin otros hallazgos el diagnóstico es improbable. Causas de ceruloplasmina baja: heterocigotos, desnutrición, nefrótico, enteropatía perdedora.",
w:{0:"No cumple criterios.",2:"Sin diagnóstico no se trata.",3:"No es el primer paso."},
p:"La ceruloplasmina puede ser normal en Wilson con inflamación (reactante de fase aguda).",
r:"EASL-ERN Wilson 2025"},

{id:"MT08",b:"ET",t:"Metabólicas",n:"F",md:"X",
q:"En la porfiria aguda intermitente con crisis abdominal y neuropatía, ¿cuál es el tratamiento específico?",
o:["Opioides y glucosa solamente","Hemina EV (o givosirán para prevención de crisis recurrentes)","Flebotomía","Hidroxicloroquina"],
c:1,
e:"Crisis aguda: <b>hemina EV</b> 3–4 mg/kg/día × 4 días + carbohidratos; suspender inductores. Givosirán (ARNi) reduce crisis recurrentes.",
w:{0:"La glucosa sola es insuficiente en crisis graves.",2:"Es para porfiria cutánea tarda.",3:"Es para porfiria cutánea tarda."},
p:"Riesgo de HCC aumentado en porfirias agudas: vigilancia desde los 50 años.",
r:"Balwani M, NEJM 2020 (ENVISION)"},

{id:"MT09",b:"ET",t:"Metabólicas",n:"R",md:"E",
q:"Mujer de 41 años con Wilson diagnosticado, asintomática y con transaminasas normales tras 3 años de quelación. ¿Mantención?",
o:["Suspender el tratamiento","Zinc 150 mg/día de zinc elemental (o quelante en dosis de mantención)","D-penicilamina en dosis de inducción","Dieta libre de cobre como único tratamiento"],
c:1,
e:"En fase de mantención estable, <b>zinc</b> o el quelante en dosis menor. El tratamiento es de por vida: suspenderlo puede causar FHA.",
w:{0:"Riesgo de FHA.",2:"Innecesariamente alta.",3:"La dieta sola no basta."},
p:"Embarazo: mantener el tratamiento, reduciendo la dosis de quelante en el tercer trimestre.",
r:"EASL-ERN Wilson 2025"},

{id:"MT10",b:"ET",t:"Metabólicas",n:"R",md:"X",
q:"¿Qué saturación de transferrina hace sospechar sobrecarga primaria de hierro?",
o:["&gt; 20 %","&gt; 45 %","&gt; 90 %","La saturación no sirve"],
c:1,
e:"Saturación de transferrina <b>&gt; 45 %</b> (en ayunas) con ferritina elevada → estudio HFE.",
w:{0:"Rango normal.",2:"Demasiado alto como umbral de sospecha.",3:"Es el primer filtro."},
p:"Ferritina alta con saturación normal sugiere síndrome dismetabólico, alcohol o inflamación.",
r:"EASL HH 2022"},

/* ===================== Bloque 12 · DILI ===================== */
{id:"DI01",b:"ET",t:"DILI",n:"R",md:"E",
q:"Mujer de 67 años con ictericia colestásica 4 semanas después de un ciclo de amoxicilina-clavulánico. ALT 180 U/L (LSN 40), FA 620 U/L (LSN 120). ¿Factor R y patrón?",
o:["R ≈ 1 · colestásico","R ≈ 6 · hepatocelular","R ≈ 3 · mixto","No calculable"],
c:0,

<script>
(function(){
"use strict";
const SNAP="<!doctype html>\n"+document.documentElement.outerHTML;
const ALL=[...Q1,...Q2,...Q3,...Q4].map(q=>({...q,mode:q.md||"E",m:q.m||""}));
const byId=Object.fromEntries(ALL.map(q=>[q.id,q]));
const BL={BA:"Bases y FHA",CI:"Cirrosis y complicaciones",ET:"Etiologías",OT:"Oncología, trasplante e imágenes"};
const BS={BA:"Bases",CI:"Cirrosis",ET:"Etiologías",OT:"Onco · Tx · Img"};
const BSEG=[["all","Todos"],["BA","Bases"],["CI","Cirrosis"],["ET","Etiologías"],["OT","Onco·Tx·Img"]];
const NV={R:"Residente",F:"Fellow",S:"Staff"};
const LET="ABCDE";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- almacenamiento: este navegador + nube (Google Sheets) ---------- */
const KEY="quizHepato_2026";
const CLOUD_DEF={api:"",token:"hepato-2026"};
const CLOUD=(()=>{let o={};try{o=JSON.parse(localStorage.getItem("quizHepato_cloud")||"{}")}catch(e){}
  const api=o.api||CLOUD_DEF.api, tk=o.token||CLOUD_DEF.token;return {api:api.startsWith("http")?api:"",tokens:[tk],token:tk,id:"quizHepato_2026"}})();
let tokenReady=null;         // se resuelve cuando se sabe qué clave acepta el script
let booting=true;            // durante la carga no se marca cambio ni se envía a la nube
const LOG=[];                // respuestas pendientes de enviar a la hoja "respuestas"
let pushTimer=null,dirty=false;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function writeLocal(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
function save(){
  if(!booting){DB._t=Date.now();dirty=true;clearTimeout(pushTimer);pushTimer=setTimeout(pushCloud,1500);}
  writeLocal();
}
function setSync(st,txt){const el=document.getElementById("syncState");if(!el)return;el.className="sync "+st;el.textContent=txt;el.title=st==="err"?"Motivo: "+syncWhy:"Estado de guardado";
  const p=document.getElementById("syncNote");if(p)p.textContent=syncNote();}
let lastSync=null,syncErr=false,syncWhy="";
function syncNote(){if(!CLOUD.api)return "Sin conexión configurada con Google Sheets: el progreso se guarda solo en este navegador. Pegue abajo la URL del Apps Script para sincronizar entre dispositivos.";return syncErr?`Sin conexión con la nube (${syncWhy||"error desconocido"}): el progreso queda en este navegador y se sincroniza al volver la conexión.`:lastSync?`Progreso sincronizado con Google Sheets (${lastSync.toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"})}): lo retomas desde cualquier dispositivo.`:"Conectando con la nube…"}
async function readJSON(r){const t=await r.text();try{return JSON.parse(t)}catch(e){
  const m=t.replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim().slice(0,140);throw new Error("Google respondió una página en vez de datos: "+m)}}
async function resolveToken(){
  for(const t of CLOUD.tokens){
    const r=await fetch(`${CLOUD.api}?action=load&quizId=${encodeURIComponent(CLOUD.id)}&token=${encodeURIComponent(t)}`);
    const d=await readJSON(r);
    if(d.ok){CLOUD.token=t;return d;}
    if(d.error!=="token inválido")throw new Error(d.error);
  }
  throw new Error("token inválido (la clave del script no coincide con la del quiz)");
}
async function pushCloud(){
  clearTimeout(pushTimer);pushTimer=null;
  if(!CLOUD.api){dirty=false;LOG.length=0;return;}
  if(tokenReady)try{await tokenReady}catch(e){}
  if(!dirty&&!LOG.length)return;
  const lote=LOG.splice(0);dirty=false;
  try{
    const r=await fetch(CLOUD.api,{method:"POST",body:JSON.stringify({token:CLOUD.token,action:"save",quizId:CLOUD.id,estado:DB,respuestas:lote})});
    const d=await readJSON(r);if(!d.ok)throw new Error(d.error);
    lastSync=new Date();syncErr=false;setSync("ok","☁ guardado");
  }catch(e){LOG.unshift(...lote);dirty=true;syncErr=true;syncWhy=e.message||String(e);setSync("err","● sin conexión");}
}
addEventListener("pagehide",()=>{
  if(!CLOUD.api||(!dirty&&!LOG.length))return;
  try{navigator.sendBeacon(CLOUD.api,new Blob([JSON.stringify({token:CLOUD.token,action:"save",quizId:CLOUD.id,estado:DB,respuestas:LOG.splice(0)})],{type:"text/plain"}));dirty=false}catch(e){}
});
addEventListener("online",()=>{if(dirty||LOG.length)pushCloud()});
const DB=load(); DB.q=DB.q||{}; DB.exams=DB.exams||[];
function record(id,ok,chosen){const r=DB.q[id]||{n:0,ok:0};r.n++;if(ok)r.ok++;r.last=ok?1:0;DB.q[id]=r;
  const q=byId[id];if(q)LOG.push({preguntaId:id,tema:`${q.b} · ${q.t}`,elegida:chosen==null?"":chosen,correcta:q.c,fecha:new Date().toISOString()});
  save()}

/* ---------- tema ---------- */
$("#themeBtn").addEventListener("click",()=>{
  const root=document.documentElement;
  const cur=root.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  const next=cur==="dark"?"light":"dark";root.setAttribute("data-theme",next);DB.theme=next;save();
});
if(DB.theme)document.documentElement.setAttribute("data-theme",DB.theme);

/* ---------- pestañas ---------- */
const tabs=[...document.querySelectorAll(".tabs button")];
function showTab(t){tabs.forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));
  document.querySelectorAll("main>section").forEach(s=>s.hidden=s.id!=="tab-"+t);
  DB.tab=t;save(); if(t==="stats")renderStats(); if(t==="flash")renderFlash(); if(t==="changes")renderChanges();}
tabs.forEach(b=>b.addEventListener("click",()=>showTab(b.dataset.tab)));
$("#nStudy").textContent=ALL.filter(q=>q.mode==="E").length;
$("#nExam").textContent=ALL.filter(q=>q.mode==="X").length;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function segHTML(name,opts,val){return `<div class="seg" data-seg="${name}">`+opts.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${v===val}">${l}</button>`).join("")+`</div>`}
function bindSeg(root,name,cb){root.querySelectorAll(`[data-seg="${name}"] button`).forEach(b=>b.addEventListener("click",()=>cb(b.dataset.v)))}
function chips(q){return `<span class="chip b-${q.b}">${BS[q.b]}</span><span class="chip lv-${q.n}">${NV[q.n]}</span><span class="chip">${esc(q.t)}</span>`+(q.fix?`<span class="chip fix">corrige v5</span>`:"")+(q.nuevo?`<span class="chip new">actualización</span>`:"")}
function explainHTML(q,order,chosen){
  const ok=chosen===q.c;
  const wrongs=order.map((oi,pos)=>oi===q.c?"":`<li><b class="L">${LET[pos]}</b>${q.w[oi]}</li>`).join("");
  return `<div class="explain">
    ${chosen==null?`<div class="verdict bad">Sin responder</div>`:`<div class="verdict ${ok?"ok":"bad"}">${ok?"Correcto.":"Incorrecto."} Respuesta: ${LET[order.indexOf(q.c)]}</div>`}
    <div class="blk"><h4>Explicación</h4><p>${q.e}</p></div>
    <div class="blk"><h4>Por qué no las otras</h4><ul>${wrongs}</ul></div>
    ${q.m?`<div class="blk mech"><h4>Mecanismo / fisiopatología</h4><p>${q.m}</p></div>`:""}
    <div class="blk pearl"><h4>Perla</h4><p>${q.p}</p></div>
    ${q.nuevo?`<div class="blk newbox"><h4>Qué cambió</h4><p>${q.nuevo}</p></div>`:""}
    ${q.fix?`<div class="blk fixbox"><h4>Corrección respecto de v5 / otras herramientas</h4><p>${q.fix}</p></div>`:""}
    <div class="blk refs"><h4>Referencias</h4><p>${q.r}</p></div>
  </div>`;
}
function themes(list){return [...new Set(list.map(q=>q.t))].sort((a,b)=>a.localeCompare(b,"es"))}

/* ================= ESTUDIO ================= */
const ST_DEF=()=>({bank:"E",b:"all",n:"all",t:"all",failed:false,i:0,orders:{},ans:{}});
const ST=ST_DEF();
function restoreST(){const d=ST_DEF();Object.keys(ST).forEach(k=>delete ST[k]);Object.assign(ST,d,DB.st||{});ST.orders=ST.orders||{};ST.ans=ST.ans||{};}
restoreST();
function studyList(){return ALL.filter(q=>(ST.bank==="all"||q.mode==="E")&&(ST.b==="all"||q.b===ST.b)&&(ST.n==="all"||q.n===ST.n)&&(ST.t==="all"||q.t===ST.t)&&(!ST.failed||(DB.q[q.id]&&DB.q[q.id].last===0)))}
function renderStudy(){
  const root=$("#tab-study");const list=studyList();
  if(ST.i>=list.length)ST.i=Math.max(0,list.length-1);
  const pool=ALL.filter(q=>ST.bank==="all"||q.mode==="E");
  let h=`<div class="filters">
    <span><span class="flabel">Banco</span>${segHTML("bank",[["E",`Estudio (${ALL.filter(q=>q.mode==="E").length})`],["all",`Todo (${ALL.length})`]],ST.bank)}</span>
    <span><span class="flabel">Bloque</span>${segHTML("b",BSEG,ST.b)}</span>
    <span><span class="flabel">Nivel</span>${segHTML("n",[["all","Todos"],["R","Residente"],["F","Fellow"],["S","Staff"]],ST.n)}</span>
    <span><label class="flabel" for="stTema">Tema</label><select id="stTema"><option value="all">Todos</option>${themes(pool).map(t=>`<option ${t===ST.t?"selected":""}>${esc(t)}</option>`).join("")}</select></span>
    <span>${segHTML("failed",[["0","Todas"],["1","Solo falladas"]],ST.failed?"1":"0")}</span>
  </div>`;

function examPool(){return ALL.filter(q=>q.mode==="X"&&(EX.b==="all"||q.b===EX.b)&&(EX.n==="all"||q.n===EX.n))}
function persistEX(){

}
function restoreEX(){

function startExam(pool){
  const n=EX.count==="all"?pool.length:Math.min(pool.length,+EX.count);
  EX.qs=pool.slice(0,n);EX.orders={};EX.ans={};EX.i=0;EX.confirm=false;
  EX.qs.forEach(q=>EX.orders[q.id]=shuffle(q.o.map((_,i)=>i)));

function updTimer(){

}
function finishExam(){
  clearInterval(EX.tick);EX.state="done";
  EX.qs.forEach(q=>{if(EX.ans[q.id]!==undefined)record(q.id,EX.ans[q.id]===q.c,EX.ans[q.id])});

  DB.exams.push({d:Date.now(),n:EX.qs.length,ok});if(DB.exams.length>30)DB.exams.shift();save();

}

function seededOrder(q){let h=2166136261;for(const ch of q.id+"hep"){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)>>>0}
  const o=q.o.map((_,i)=>i);for(let i=o.length-1;i>0;i--){h=(Math.imul(h,1664525)+1013904223)>>>0;const j=h%(i+1);[o[i],o[j]]=[o[j],o[i]]}return o}
function bankRows(list){return list.map(q=>{const or=seededOrder(q);const L=oi=>LET[or.indexOf(+oi)];return {id:q.id,modo:q.mode==="E"?"Estudio":"Examen",bloque:BL[q.b],nivel:NV[q.n],tema:q.t,pregunta:plain(q.q),opciones:or.map(i=>plain(q.o[i])),correcta:L(q.c),respuesta:plain(q.o[q.c]),explicacion:plain(q.e),porQueNo:Object.keys(q.w).sort((x,y)=>or.indexOf(+x)-or.indexOf(+y)).map(k=>L(k)+": "+plain(q.w[k])).join(" | "),mecanismo:plain(q.m||""),perla:plain(q.p),cambio:plain(q.nuevo||""),correccionV5:plain(q.fix||""),referencias:plain(q.r)}})}
function exportCSV(list){const R=bankRows(list);const H=["id","modo","bloque","nivel","tema","pregunta","A","B","C","D","correcta","respuesta","explicacion","porQueNo","mecanismo","perla","cambio","correccionV5","referencias"];
  return "﻿"+H.join(";")+"\n"+R.map(r=>[r.id,r.modo,r.bloque,r.nivel,r.tema,r.pregunta,...[0,1,2,3].map(i=>r.opciones[i]||""),r.correcta,r.respuesta,r.explicacion,r.porQueNo,r.mecanismo,r.perla,r.cambio,r.correccionV5,r.referencias].map(csvCell).join(";")).join("\n")}
function exportAnki(list){const t=s=>String(s).replace(/\t/g," ").replace(/\n/g,"<br>");
  return "#separator:tab\n#html:true\n#tags column:3\n"+list.map(q=>{const or=seededOrder(q);const front=`<b>${q.id}</b> · ${q.t}<br>${q.q}<br><br>`+or.map((oi,i)=>`${LET[i]}) ${q.o[oi]}`).join("<br>");
    const back=`<b>${LET[or.indexOf(q.c)]}) ${q.o[q.c]}</b><br><br>${q.e}<br><br><i>Perla:</i> ${q.p}`+(q.m?`<br><br><i>Mecanismo:</i> ${q.m}`:"")+`<br><br><small>${q.r}</small>`;
    return [t(front),t(back),["Hepatologia",q.b,NV[q.n],q.mode==="E"?"estudio":"examen",q.t.replace(/\s+/g,"_")].join(" ")].join("\t")}).join("\n")}

function copyFallback(name,content,msg){const out=$("#expOut");
  out.innerHTML=`<p class="muted" style="margin:0 0 6px">${msg||"Esta vista no permite descargas."} Copia el contenido y pégalo en un archivo <b>${esc(name)}</b>.</p><textarea class="dump" id="dump" readonly></textarea><div class="actions"><button class="btn primary" type="button" id="copyDump">Copiar</button></div>`;
  $("#dump").value=content;
  $("#copyDump").addEventListener("click",()=>{const ta=$("#dump");const done=()=>{$("#copyDump").textContent="Copiado"};
    const legacy=()=>{ta.select();try{document.execCommand("copy");done()}catch(e){}};
    if(navigator.clipboard)navigator.clipboard.writeText(content).then(done).catch(legacy);else legacy();});}
function deliver(name,content,mime){
  const out=$("#expOut");
  if(!EMBED){try{const b=new Blob([content],{type:mime+";charset=utf-8"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);out.innerHTML=`<p class="muted">Descargado: <b>${esc(name)}</b></p>`;return}catch(e){}}
  if(DL){out.innerHTML=`<p class="muted">Confirma la descarga de <b>${esc(name)}</b> en el aviso.</p>`;
    DL.save({filename:name,data:content}).then(r=>{out.innerHTML=`<p class="muted">${r&&r.status==="delivered"?"Enviado":"Descargado"}: <b>${esc(name)}</b></p>`})
      .catch(e=>{const c=e&&e.code;if(c==="declined")out.innerHTML=`<p class="muted">Descarga cancelada.</p>`;else if(c==="rate_limited")out.innerHTML=`<p class="muted">Ya hay un aviso de descarga abierto; intenta de nuevo en unos segundos.</p>`;else copyFallback(name,content,"No se pudo descargar en esta vista.")});return}
  copyFallback(name,content);
}

function applyRemote(src){
  booting=true;
  Object.keys(DB).forEach(k=>delete DB[k]);Object.assign(DB,src);DB.q=DB.q||{};DB.exams=DB.exams||[];
  if(DB.theme)document.documentElement.setAttribute("data-theme",DB.theme);

(async()=>{

    if(remote&&(remote._t||0)>(DB._t||0))applyRemote(remote);
